[package]
name = "blyte"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Blyte unified interactive agent harness and state engine runner."

[lib]
name = "blyte_cli"
path = "src/lib.rs"

[[bin]]
name = "blyte"
path = "src/main.rs"

[dependencies]
libc = "0.2"
blyte-agent = { path = "../blyte-agent", version = "0.1.0" }
blyte-provider = { path = "../blyte-provider", version = "0.1.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
