    function renderExceptionFlagsHtml(run) {
      if (!run.checks_recorded) {
        return '<div class="exc-not-recorded">checks not recorded</div>';
      }
      if (run.flags.length === 0) {
        return '<div class="exc-flag-item">outcome: ' + escapeHtml(run.outcome) + '</div>';
      }
      const shown = run.flags.slice(0, 3).map(fl =>
        '<div class="exc-flag-item" title="' + escapeHtml(fl) + '">• ' + escapeHtml(fl) + '</div>'
      ).join("");
      const more = run.flags.length > 3
        ? '<div class="exc-flag-more">+' + (run.flags.length - 3) + ' more</div>'
        : "";
      return shown + more;
    }

    function renderQueue(state, force) {
      if (mode !== "review") return;

      const arrivedKeys = state.arrived.map(r => r.key).join(",");
      const decisionSig = Array.from(decisions.entries()).map(([k, v]) => k + ":" + v.action + ":" + v.note).join(",");
      const detailsSig = Array.from(openDetails).join(",");
      const pendingSig = Array.from(pendingNoteAction.entries()).map(([k, v]) => k + ":" + v).join(",");
      const errSig = Array.from(noteErrors.entries()).map(([k, v]) => k + ":" + v).join(",");
      const threadSig = Array.from(groupThreads.entries()).map(([k, v]) => k + ":" + v.length).join(",");
      const sig = [arrivedKeys, decisionSig, detailsSig, pendingSig, errSig, threadSig, focusedGroup || "", checkinOpen ? "1" : "0"].join("||");

      if (!force && sig === lastQueueSig) return;
      lastQueueSig = sig;

      const queueEl = document.getElementById("queue");
      if (checkinOpen) {
        queueEl.hidden = true;
        return;
      }
      queueEl.hidden = false;

      const nowMs = Date.now();
      for (const r of state.undecidedArrived) {
        if (!firstShownAt.has(r.key)) {
          firstShownAt.set(r.key, nowMs);
        }
      }

      const activeInput = document.activeElement;
      const activeInputId = activeInput && activeInput.dataset ? activeInput.dataset.preserveId : null;
      const activeSelStart = activeInput && typeof activeInput.selectionStart === "number" ? activeInput.selectionStart : null;

      const byGroup = new Map();
      for (const r of state.arrived) {
        const g = runGroupName(r);
        if (!byGroup.has(g)) byGroup.set(g, { undecided: [], decided: [] });
        if (isResolved(r.key)) {
          byGroup.get(g).decided.push(r);
        } else {
          byGroup.get(g).undecided.push(r);
        }
      }

      if (byGroup.size === 0) {
        queueEl.innerHTML = '<div class="thread-empty">No arrived runs yet. Advance the clock or click Next arrival.</div>';
        return;
      }

      const orderedGroups = allGroups.filter(g => byGroup.has(g));
      for (const g of byGroup.keys()) {
        if (!orderedGroups.includes(g)) orderedGroups.push(g);
      }

      const groupsHtml = orderedGroups.map(groupName => {
        const bucket = byGroup.get(groupName);
        const undecided = bucket.undecided;
        const decided = bucket.decided;
        const cleanRuns = undecided.filter(r => r.card === "clean");
        const exceptionRuns = undecided.filter(r => r.card === "exception");
        const isFocused = focusedGroup === groupName;

        let headActions = '<span class="group-count">' +
          (undecided.length > 0 ? undecided.length + ' undecided' : 'all decided') +
          '</span>';
        if (cleanRuns.length >= 2) {
          headActions = '<button type="button" class="btn btn-pass" data-accept-all-clean="' + escapeHtml(groupName) + '">Accept all clean (' + cleanRuns.length + ')</button>' + headActions;
        }

        const cleanHtml = cleanRuns.map(r => {
          const isOpen = openDetails.has(r.key);
          return '<div>' +
            '<div class="clean-row">' +
              '<div class="clean-main">' +
                '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
                '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
              '</div>' +
              '<div class="row-actions">' +
                '<button type="button" class="btn btn-ghost" data-toggle-details="' + escapeHtml(r.key) + '">' + (isOpen ? "Hide details" : "Details") + '</button>' +
                '<button type="button" class="btn btn-pass" data-action="accept" data-run-key="' + escapeHtml(r.key) + '">Accept</button>' +
              '</div>' +
            '</div>' +
            renderDetailsHtml(r) +
          '</div>';
        }).join("");

        const excHtml = exceptionRuns.map(r => {
          const dec = decisions.get(r.key);
          const held = isHeld(r.key);
          const isOpen = openDetails.has(r.key);
          const pending = pendingNoteAction.get(r.key) || null;
          const draft = noteDrafts.get(r.key) || "";
          const err = noteErrors.get(r.key) || "";
          const outcomeClass = r.outcome === "verified" ? "verified" : "failed";
          const cardClass = "exception-card" + (held ? " is-held" : (r.outcome !== "verified" ? " is-failed" : ""));
          const verdictHtml = held && r.verdict !== null
            ? '<span class="recorded-verdict">recorded then: ' + escapeHtml(r.verdict) + '</span>'
            : "";

          let promptHtml = "";
          if (pending === "send_back" || pending === "hold") {
            const label = pending === "send_back" ? "Send back" : "Hold";
            promptHtml = '<form class="note-prompt" data-note-form="' + escapeHtml(r.key) + '" data-note-action="' + pending + '">' +
              '<input type="text" data-note-input="' + escapeHtml(r.key) + '" data-preserve-id="note:' + escapeHtml(r.key) + '" value="' + escapeHtml(draft) + '" placeholder="One-line note required for ' + label + '..." autocomplete="off">' +
              '<button type="submit" class="btn btn-primary">' + label + '</button>' +
              '<button type="button" class="btn btn-ghost" data-cancel-note="' + escapeHtml(r.key) + '">Cancel</button>' +
              (err ? '<div class="note-error">' + escapeHtml(err) + '</div>' : "") +
              '</form>';
          }

          return '<div class="exception-wrap">' +
            '<div class="' + cardClass + '">' +
              (held ? '<div class="hold-note-first" title="' + escapeHtml(dec.note) + '">Held: ' + escapeHtml(dec.note) + '</div>' : "") +
              '<div class="exc-top">' +
                '<div class="exc-title-group">' +
                  '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
                  '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
                '</div>' +
                '<span class="outcome-pill ' + outcomeClass + '">' + escapeHtml(r.outcome) + '</span>' +
              '</div>' +
              '<div class="exc-flags">' + renderExceptionFlagsHtml(r) + '</div>' +
              '<div class="exc-footer">' +
                '<div class="row-actions">' +
                  '<button type="button" class="btn btn-pass" data-action="accept" data-run-key="' + escapeHtml(r.key) + '">Accept</button>' +
                  '<button type="button" class="btn btn-warn" data-action="send_back" data-run-key="' + escapeHtml(r.key) + '">Send back</button>' +
                  '<button type="button" class="btn btn-danger" data-action="redo" data-run-key="' + escapeHtml(r.key) + '">Redo</button>' +
                  '<button type="button" class="btn" data-action="hold" data-run-key="' + escapeHtml(r.key) + '">Hold</button>' +
                '</div>' +
                '<div class="row-actions">' +
                  verdictHtml +
                  '<button type="button" class="btn btn-ghost" data-toggle-details="' + escapeHtml(r.key) + '">' + (isOpen ? "Hide details" : "Details") + '</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            promptHtml +
            renderDetailsHtml(r) +
          '</div>';
        }).join("");

        const decidedHtml = decided.map(r => {
          const dec = decisions.get(r.key);
          const isOpen = openDetails.has(r.key);
          const actionLabel = dec.action === "accept" ? "Accepted"
            : dec.action === "send_back" ? "Sent back"
            : dec.action === "redo" ? "Redo"
            : dec.action;
          const noteSnippet = dec.note ? ' — "' + escapeHtml(dec.note) + '"' : "";
          const recordedHtml = r.verdict !== null
            ? '<span class="recorded-verdict">recorded then: ' + escapeHtml(r.verdict) + '</span>'
            : "";

          return '<div>' +
            '<div class="decided-row">' +
              '<div class="decided-main">' +
                '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
                '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
                '<span class="decision-badge">' + escapeHtml(actionLabel) + noteSnippet + '</span>' +
                recordedHtml +
              '</div>' +
              '<button type="button" class="btn btn-ghost" data-toggle-details="' + escapeHtml(r.key) + '">' + (isOpen ? "Hide details" : "Details") + '</button>' +
            '</div>' +
            renderDetailsHtml(r) +
          '</div>';
        }).join("");

        let threadHtml = "";
        if (undecided.length > 0) {
          const msgs = groupThreads.get(groupName) || [];
          const inputVal = groupInputDrafts.get(groupName) || "";
          const msgsHtml = msgs.length > 0
            ? '<div class="group-thread-msgs">' + msgs.map(m =>
                '<div class="group-thread-msg ' + m.role + '">' + escapeHtml(m.text) + '</div>'
              ).join("") + '</div>'
            : "";
          threadHtml = '<div class="group-thread">' +
            msgsHtml +
            '<form class="group-thread-form" data-group-thread="' + escapeHtml(groupName) + '">' +
              '<input type="text" data-group-input="' + escapeHtml(groupName) + '" data-preserve-id="gthread:' + escapeHtml(groupName) + '" value="' + escapeHtml(inputVal) + '" placeholder="Thread for ' + escapeHtml(groupName) + '..." autocomplete="off">' +
              '<button type="submit" class="btn">Send</button>' +
            '</form>' +
          '</div>';
        }

        return '<section class="queue-group' + (isFocused ? " focused" : "") + '" data-group="' + escapeHtml(groupName) + '">' +
          '<div class="group-head">' +
            '<span class="group-name">' + escapeHtml(groupName) + '</span>' +
            '<div class="group-meta">' + headActions + '</div>' +
          '</div>' +
          '<div class="group-body">' +
            excHtml +
            cleanHtml +
            decidedHtml +
          '</div>' +
          threadHtml +
        '</section>';
      }).join("");

      queueEl.innerHTML = groupsHtml;

      if (activeInputId) {
        const restored = queueEl.querySelector('[data-preserve-id="' + CSS.escape(activeInputId) + '"]');
        if (restored) {
          restored.focus();
          if (activeSelStart !== null) {
            try { restored.setSelectionRange(activeSelStart, activeSelStart); } catch (_) {}
          }
        }
      }

      if (pendingScrollGroup) {
        const target = pendingScrollGroup;
        pendingScrollGroup = null;
        scrollQueueToGroup(target);
      }
    }

    function scrollQueueToGroup(groupName) {
      if (mode !== "review" || checkinOpen) return;
      const queueEl = document.getElementById("queue");
      const target = queueEl.querySelector('[data-group="' + CSS.escape(groupName) + '"]');
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderMap(state, force) {
      if (mapTab !== "runs") return;
      const counts = new Map();
      for (const g of allGroups) {
        counts.set(g, { running: 0, waiting: 0 });
      }
      for (const r of state.inProgress) {
        const g = runGroupName(r);
        if (!counts.has(g)) counts.set(g, { running: 0, waiting: 0 });
        counts.get(g).running += 1;
      }
      for (const r of state.undecidedArrived) {
        const g = runGroupName(r);
        if (!counts.has(g)) counts.set(g, { running: 0, waiting: 0 });
        counts.get(g).waiting += 1;
      }

      const sig = Array.from(counts.entries()).map(([g, c]) => g + ":" + c.running + ":" + c.waiting).join("|") + "||" + (focusedGroup || "");
      if (!force && sig === lastMapSig) return;
      lastMapSig = sig;

      const mapEl = document.getElementById("map");
      if (allGroups.length === 0) {
        mapEl.innerHTML = '<div class="thread-empty">No groups in this replay window.</div>';
        return;
      }

      mapEl.innerHTML = allGroups.map(g => {
        const c = counts.get(g) || { running: 0, waiting: 0 };
        const isFocused = focusedGroup === g;
        return '<button type="button" class="map-box' + (isFocused ? " focused" : "") + '" data-map-group="' + escapeHtml(g) + '" aria-pressed="' + (isFocused ? "true" : "false") + '">' +
          '<span class="map-box-name">' + escapeHtml(g) + '</span>' +
          '<span class="map-box-stats nums">' +
            '<span class="' + (c.running > 0 ? "map-stat-running" : "") + '">' + c.running + ' in progress</span>' +
            '<span class="' + (c.waiting > 0 ? "map-stat-waiting" : "") + '">' + c.waiting + ' waiting</span>' +
          '</span>' +
        '</button>';
      }).join("");
    }

    function unitShortName(id) {
      if (id.includes("::")) {
        const parts = id.split("::");
        return parts[parts.length - 1];
      }
      if (id.includes(".")) {
        const parts = id.split(".");
        return parts[parts.length - 1];
      }
      return id;
    }

    function computeDependencyColumns(ids, edges) {
      const sortedIds = Array.from(ids).sort();
      const idSet = new Set(sortedIds);
      const deps = new Map();
      for (const id of sortedIds) {
        deps.set(id, []);
      }
      for (const e of edges) {
        if (e.from !== e.to && idSet.has(e.from) && idSet.has(e.to)) {
          deps.get(e.from).push(e.to);
        }
      }
      for (const list of deps.values()) {
        list.sort();
      }
      const visiting = new Set();
      const depth = new Map();

      function visit(id) {
        if (depth.has(id)) return depth.get(id);
        visiting.add(id);
        let maxDep = -1;
        for (const dep of deps.get(id)) {
          if (visiting.has(dep)) continue;
          const d = visit(dep);
          if (d > maxDep) maxDep = d;
        }
        visiting.delete(id);
        const col = maxDep + 1;
        depth.set(id, col);
        return col;
      }

      for (const id of sortedIds) {
        visit(id);
      }

      const cols = [];
      for (const id of sortedIds) {
        const c = depth.get(id) || 0;
        while (cols.length <= c) cols.push([]);
        cols[c].push(id);
      }
      return cols;
    }

    function addToSetMap(map, key, val) {
      if (!map.has(key)) map.set(key, new Set());
      map.get(key).add(val);
    }

    function computeOverlay(mapData, state) {
      const repoRunning = state.inProgress.filter(r => r.repo === selectedRepo);
      const repoWaiting = state.undecidedArrived.filter(r => r.repo === selectedRepo);

      const fileToUnit = new Map();
      for (const u of mapData.units) {
        fileToUnit.set(u.file, u);
      }
      const groupPrefixes = mapData.groups.map(g => ({
        group: g,
        prefix: g.path === "." ? "." : g.path.replace(/\/+$/, "")
      }));

      function placeFile(filePath) {
        if (fileToUnit.has(filePath)) {
          return { type: "unit", unit: fileToUnit.get(filePath) };
        }
        let best = null;
        let bestLen = -1;
        for (const gp of groupPrefixes) {
          if (gp.prefix === ".") {
            if (bestLen < 0) {
              best = gp.group;
              bestLen = 0;
            }
          } else if (filePath === gp.prefix || filePath.startsWith(gp.prefix + "/")) {
            if (gp.prefix.length > bestLen) {
              best = gp.group;
              bestLen = gp.prefix.length;
            }
          }
        }
        if (best) return { type: "group", group: best };
        return { type: "outside" };
      }

      const unitRunning = new Map();
      const unitWaiting = new Map();
      const groupRunning = new Map();
      const groupWaiting = new Map();
      const outsideFiles = new Set();

      for (const r of repoRunning) {
        for (const f of r.changed_files) {
          const loc = placeFile(f);
          if (loc.type === "unit") {
            addToSetMap(unitRunning, loc.unit.id, r.key);
            addToSetMap(groupRunning, loc.unit.group, r.key);
          } else if (loc.type === "group") {
            addToSetMap(groupRunning, loc.group.id, r.key);
          } else {
            outsideFiles.add(f);
          }
        }
      }

      for (const r of repoWaiting) {
        for (const f of r.changed_files) {
          const loc = placeFile(f);
          if (loc.type === "unit") {
            addToSetMap(unitWaiting, loc.unit.id, r.key);
            addToSetMap(groupWaiting, loc.unit.group, r.key);
          } else if (loc.type === "group") {
            addToSetMap(groupWaiting, loc.group.id, r.key);
          } else {
            outsideFiles.add(f);
          }
        }
      }

      const sig = repoRunning.map(r => r.key).join(",") + "|" + repoWaiting.map(r => r.key).join(",");
      return {
        unitRunning,
        unitWaiting,
        groupRunning,
        groupWaiting,
        outsideCount: outsideFiles.size,
        sig
      };
    }

    function ensureRepoMapLoaded(repo) {
      if (!repo || mapCache.has(repo)) return;
      mapCache.set(repo, { status: "loading" });
      renderAll(true);
      (async () => {
        let response;
        try {
          response = await fetch("/api/map?repo=" + encodeURIComponent(repo));
        } catch (err) {
          mapCache.set(repo, {
            status: "error",
            error: err && err.message ? err.message : String(err)
          });
          renderAll(true);
          return;
        }
        let bodyText = "";
        try {
          bodyText = await response.text();
        } catch (_) {}
        if (response.status !== 200) {
          let errMsg = bodyText || ("HTTP " + response.status);
          try {
            const parsed = JSON.parse(bodyText);
            if (isPlainObject(parsed) && typeof parsed.error === "string") {
              errMsg = parsed.error;
            }
          } catch (_) {}
          mapCache.set(repo, { status: "error", error: errMsg });
          renderAll(true);
          return;
        }
        try {
          const data = JSON.parse(bodyText);
          if (!isPlainObject(data) || !Array.isArray(data.groups) || !Array.isArray(data.units) ||
              !Array.isArray(data.edges) || !Array.isArray(data.structures) ||
              !Array.isArray(data.unparsed) || !Array.isArray(data.unresolved)) {
            mapCache.set(repo, { status: "error", error: "Invalid /api/map payload." });
          } else {
            mapCache.set(repo, { status: "ok", data });
          }
        } catch (err) {
          mapCache.set(repo, {
            status: "error",
            error: err && err.message ? err.message : String(err)
          });
        }
        renderAll(true);
      })();
    }

    function renderMapMeta(mapData, overlay, force) {
      const barEl = document.getElementById("map-meta-bar");
      const outsideEl = document.getElementById("map-outside");
      const notesEl = document.getElementById("map-notes");

      if (mapTab === "runs" || !mapData) {
        barEl.hidden = true;
        outsideEl.hidden = true;
        notesEl.hidden = true;
        lastMetaSig = "";
        return;
      }

      const unparsedCount = mapData.unparsed.length;
      const unresolvedCount = mapData.unresolved.length;
      const sig = [selectedRepo, overlay.outsideCount, unparsedCount, unresolvedCount, mapNotesOpen ? "1" : "0"].join("|");
      if (!force && sig === lastMetaSig) return;
      lastMetaSig = sig;

      if (overlay.outsideCount > 0) {
        outsideEl.hidden = false;
        outsideEl.textContent = overlay.outsideCount + " files outside the code";
      } else {
        outsideEl.hidden = true;
        outsideEl.textContent = "";
      }

      if (unparsedCount > 0 || unresolvedCount > 0) {
        notesEl.hidden = false;
        const parts = [];
        if (unparsedCount > 0) parts.push(unparsedCount + " files not parsed");
        if (unresolvedCount > 0) parts.push(unresolvedCount + " references not resolved");
        let listHtml = "";
        if (mapNotesOpen) {
          let sections = "";
          if (unparsedCount > 0) {
            sections += '<div><div class="map-notes-section-title">files not parsed</div><ul class="map-notes-items">' +
              mapData.unparsed.map(u =>
                '<li><span>' + escapeHtml(u.file) + '</span> <span class="map-notes-reason">— ' + escapeHtml(u.reason) + '</span></li>'
              ).join("") + '</ul></div>';
          }
          if (unresolvedCount > 0) {
            sections += '<div><div class="map-notes-section-title">references not resolved</div><ul class="map-notes-items">' +
              mapData.unresolved.map(u =>
                '<li><span>' + escapeHtml(u.file) + ':' + escapeHtml(u.line) + '</span> <span class="map-notes-reason">— ' + escapeHtml(u.reference) + '</span></li>'
              ).join("") + '</ul></div>';
          }
          listHtml = '<div class="map-notes-list">' + sections + '</div>';
        }
        notesEl.innerHTML =
          '<button type="button" class="map-notes-toggle nums" data-toggle-notes="1" aria-expanded="' + (mapNotesOpen ? "true" : "false") + '">' +
            escapeHtml(parts.join(" · ")) +
          '</button>' + listHtml;
      } else {
        notesEl.hidden = true;
        notesEl.innerHTML = "";
      }

      barEl.hidden = outsideEl.hidden && notesEl.hidden;
    }

    function renderMapDetail(mapData) {
      const detailEl = document.getElementById("map-detail");
      if (mapTab === "runs" || !mapData) {
        detailEl.hidden = true;
        detailEl.innerHTML = "";
        return;
      }

      if (mapTab === "system") {
        const activeUnit = hoveredMapUnit || selectedMapUnit;
        if (!activeUnit) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const unit = mapData.units.find(u => u.id === activeUnit);
        if (!unit) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const dependsOn = mapData.edges
          .filter(e => e.level === "unit" && e.from === activeUnit)
          .map(e => e.to);
        const dependedBy = mapData.edges
          .filter(e => e.level === "unit" && e.to === activeUnit)
          .map(e => e.from);
        const definedStructs = mapData.structures.filter(s => s.unit === activeUnit);

        const depsHtml = dependsOn.length > 0
          ? '<ul class="map-detail-list">' + dependsOn.map(id => '<li>' + escapeHtml(id) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const revDepsHtml = dependedBy.length > 0
          ? '<ul class="map-detail-list">' + dependedBy.map(id => '<li>' + escapeHtml(id) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const structsHtml = definedStructs.length > 0
          ? '<ul class="map-detail-list">' + definedStructs.map(s =>

          : '<div class="map-detail-empty">None</div>';

        detailEl.hidden = false;
        detailEl.innerHTML =
          '<div class="map-detail-head">' +
            '<div>' +
              '<div class="map-detail-id">' + escapeHtml(unit.id) + '</div>' +
              '<div class="map-detail-file">' + escapeHtml(unit.file) + '</div>' +
            '</div>' +
            '<button type="button" class="btn btn-ghost" data-close-detail="1" aria-label="Close detail">×</button>' +
          '</div>' +
          '<div class="map-detail-section"><div class="details-label">depends on (' + dependsOn.length + ')</div>' + depsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">depended on by (' + dependedBy.length + ')</div>' + revDepsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">structures (' + definedStructs.length + ')</div>' + structsHtml + '</div>';
        return;
      }

      if (mapTab === "data") {
        if (!selectedMapStructure) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const s = mapData.structures.find(x => x.id === selectedMapStructure);
        if (!s) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const fieldsHtml = s.fields.length > 0
          ? '<ul class="map-detail-list">' + s.fields.map(f =>
              '<li>' + escapeHtml(f.name) + (f.type ? ': <span class="map-detail-type">' + escapeHtml(f.type) + '</span>' : "") + '</li>'
            ).join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const refsHtml = s.referenced_by.length > 0
          ? '<ul class="map-detail-list">' + s.referenced_by.map(u => '<li>' + escapeHtml(u) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';

        detailEl.hidden = false;
        detailEl.innerHTML =
          '<div class="map-detail-head">' +
            '<div>' +
              '<div class="map-detail-id">' + escapeHtml(s.id) + '</div>' +
              '<div class="map-detail-file">' + escapeHtml(s.file + ":" + s.line) + ' · ' + escapeHtml(s.kind) + '</div>' +
            '</div>' +
            '<button type="button" class="btn btn-ghost" data-close-detail="1" aria-label="Close detail">×</button>' +
          '</div>' +
          '<div class="map-detail-section"><div class="details-label">fields (' + s.fields.length + ')</div>' + fieldsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">referenced_by (' + s.referenced_by.length + ')</div>' + refsHtml + '</div>';
      }
    }

    function applySystemHighlight() {
      const entry = selectedRepo ? mapCache.get(selectedRepo) : null;
      const mapData = entry && entry.status === "ok" ? entry.data : null;
      const sysEl = document.getElementById("map-system");
      const activeUnit = hoveredMapUnit || selectedMapUnit;

      const connectedNodes = new Set();
      if (activeUnit) {
        connectedNodes.add("unit:" + activeUnit);
      }

      const paths = sysEl.querySelectorAll(".sys-edge");
      paths.forEach(p => {
        const idx = Number(p.dataset.edgeIdx);
        const edgeMeta = renderedSysEdges[idx];
        if (!activeUnit || !edgeMeta) {
          p.classList.remove("edge-strong", "edge-dim");
          p.setAttribute("marker-end", "url(#sys-arrow-faint)");
          return;
        }
        if (edgeMeta.units.has(activeUnit)) {
          p.classList.add("edge-strong");
          p.classList.remove("edge-dim");
          p.setAttribute("marker-end", "url(#sys-arrow-strong)");
          connectedNodes.add(edgeMeta.fromNode);
          connectedNodes.add(edgeMeta.toNode);
        } else {
          p.classList.add("edge-dim");
          p.classList.remove("edge-strong");
          p.setAttribute("marker-end", "url(#sys-arrow-faint)");
        }
      });

      const nodeEls = sysEl.querySelectorAll("[data-node-id]");
      nodeEls.forEach(el => {
        const nid = el.dataset.nodeId;
        if (!activeUnit) {
          el.classList.remove("node-active", "node-related", "node-dim");
          return;
        }
        el.classList.toggle("node-active", nid === "unit:" + activeUnit);
        el.classList.toggle("node-related", nid !== "unit:" + activeUnit && connectedNodes.has(nid));
        el.classList.toggle("node-dim", !connectedNodes.has(nid));
      });

      renderMapDetail(mapData);
    }

    function buildEdgePath(a, b) {
      const ax = a.x + a.w / 2;
      const ay = a.y + a.h / 2;
      const bx = b.x + b.w / 2;
      const by = b.y + b.h / 2;
      const dx = bx - ax;
      const dy = by - ay;

      if (Math.abs(dx) >= Math.abs(dy)) {
        const x1 = dx < 0 ? a.x : a.x + a.w;
        const y1 = ay;
        const x2 = dx < 0 ? b.x + b.w : b.x;
        const y2 = by;
        const span = Math.max(24, Math.abs(x2 - x1) * 0.45);
        const cx1 = dx < 0 ? x1 - span : x1 + span;
        const cx2 = dx < 0 ? x2 + span : x2 - span;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " C " + cx1.toFixed(1) + " " + y1.toFixed(1) + ", " +
          cx2.toFixed(1) + " " + y2.toFixed(1) + ", " +
          x2.toFixed(1) + " " + y2.toFixed(1);
      }

      if (Math.abs(dx) < 20) {
        const x1 = a.x + a.w;
        const y1 = ay;
        const x2 = b.x + b.w;
        const y2 = by;
        const bow = Math.min(34, 14 + Math.abs(dy) * 0.08);
        const cx = Math.max(x1, x2) + bow;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " C " + cx.toFixed(1) + " " + y1.toFixed(1) + ", " +
          cx.toFixed(1) + " " + y2.toFixed(1) + ", " +
          x2.toFixed(1) + " " + y2.toFixed(1);
      }

      const x1 = ax;
      const y1 = dy < 0 ? a.y : a.y + a.h;
      const x2 = bx;
      const y2 = dy < 0 ? b.y + b.h : b.y;
      const span = Math.max(20, Math.abs(y2 - y1) * 0.45);
      const cy1 = dy < 0 ? y1 - span : y1 + span;
      const cy2 = dy < 0 ? y2 + span : y2 - span;
      return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
        " C " + x1.toFixed(1) + " " + cy1.toFixed(1) + ", " +
        x2.toFixed(1) + " " + cy2.toFixed(1) + ", " +
        x2.toFixed(1) + " " + y2.toFixed(1);
    }

    function drawSystemEdges(mapData) {
      const sysEl = document.getElementById("map-system");
      const canvas = sysEl.querySelector(".sys-canvas");
      const svg = sysEl.querySelector(".sys-svg");
      if (!canvas || !svg || !mapData) return;

      const canvasRect = canvas.getBoundingClientRect();
      const width = Math.max(1, canvas.scrollWidth);
      const height = Math.max(1, canvas.scrollHeight);
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);

      const rects = new Map();
      canvas.querySelectorAll("[data-node-id]").forEach(el => {
        const r = el.getBoundingClientRect();
        rects.set(el.dataset.nodeId, {
          x: r.left - canvasRect.left,
          y: r.top - canvasRect.top,
          w: r.width,
          h: r.height
        });
      });

      const edgeMap = new Map();
      function addEdge(fromNode, toNode, unitIds) {
        if (!rects.has(fromNode) || !rects.has(toNode) || fromNode === toNode) return;
        const key = fromNode + "->" + toNode;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, { fromNode, toNode, units: new Set() });
        }
        const item = edgeMap.get(key);
        for (const u of unitIds) {
          item.units.add(u);
        }
      }

      if (openMapGroup === null) {
        for (const e of mapData.edges) {
          if (e.level === "group") {
            addEdge("group:" + e.from, "group:" + e.to, []);
          }
        }
      } else {
        const unitToGroup = new Map();
        for (const u of mapData.units) {
          unitToGroup.set(u.id, u.group);
        }
        for (const e of mapData.edges) {
          if (e.level === "group" && e.from !== openMapGroup && e.to !== openMapGroup) {
            addEdge("group:" + e.from, "group:" + e.to, []);
          } else if (e.level === "unit") {
            const fg = unitToGroup.get(e.from);
            const tg = unitToGroup.get(e.to);
            if (fg === openMapGroup && tg === openMapGroup) {
              addEdge("unit:" + e.from, "unit:" + e.to, [e.from, e.to]);
            } else if (fg === openMapGroup && tg && tg !== openMapGroup) {
              addEdge("unit:" + e.from, "group:" + tg, [e.from]);
            } else if (tg === openMapGroup && fg && fg !== openMapGroup) {
              addEdge("group:" + fg, "unit:" + e.to, [e.to]);
            }
          }
        }
      }

      renderedSysEdges = Array.from(edgeMap.values());
      const defs =
        '<defs>' +
          '<marker id="sys-arrow-faint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 1 L 7 4 L 0 7 z" class="sys-arrow-faint"></path>' +
          '</marker>' +
          '<marker id="sys-arrow-strong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 1 L 7 4 L 0 7 z" class="sys-arrow-strong"></path>' +
          '</marker>' +
        '</defs>';

      const pathsHtml = renderedSysEdges.map((edge, idx) => {
        const d = buildEdgePath(rects.get(edge.fromNode), rects.get(edge.toNode));
        return '<path class="sys-edge" data-edge-idx="' + idx + '" d="' + d + '" marker-end="url(#sys-arrow-faint)"></path>';
      }).join("");

      svg.innerHTML = defs + pathsHtml;
      applySystemHighlight();
    }

    function renderSystemTab(state, force) {
      if (mapTab !== "system") return;
      const sysEl = document.getElementById("map-system");

      if (!selectedRepo) {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        sysEl.innerHTML = '<div class="map-loading">No repositories in this replay.</div>';
        lastSystemSig = "no-repo";
        return;
      }

      const entry = mapCache.get(selectedRepo);
      if (!entry) {
        ensureRepoMapLoaded(selectedRepo);
        return;
      }
      if (entry.status === "loading") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        sysEl.innerHTML = '<div class="map-loading">reading the code</div>';
        lastSystemSig = "loading:" + selectedRepo;
        return;
      }
      if (entry.status === "error") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        sysEl.innerHTML = '<div class="map-error">' + escapeHtml(entry.error) + '</div>';
        lastSystemSig = "error:" + selectedRepo + ":" + entry.error;
        return;
      }

      const mapData = entry.data;
      const overlay = computeOverlay(mapData, state);
      renderMapMeta(mapData, overlay, force);

      const sig = [selectedRepo, openMapGroup || "", focusedGroup || "", overlay.sig].join("||");
      if (!force && sig === lastSystemSig) {
        renderMapDetail(mapData);
        return;
      }
      lastSystemSig = sig;

      if (mapData.groups.length === 0) {
        sysEl.innerHTML = '<div class="map-loading">No groups found.</div>';
        renderMapDetail(mapData);
        return;
      }

      const unitsByGroup = new Map();
      for (const g of mapData.groups) {
        unitsByGroup.set(g.id, []);
      }
      for (const u of mapData.units) {
        if (!unitsByGroup.has(u.group)) unitsByGroup.set(u.group, []);
        unitsByGroup.get(u.group).push(u);
      }

      const groupById = new Map();
      for (const g of mapData.groups) {
        groupById.set(g.id, g);
      }
      const groupEdges = mapData.edges.filter(e => e.level === "group");
      const groupCols = computeDependencyColumns(mapData.groups.map(g => g.id), groupEdges);
      const unitById = new Map();
      for (const u of mapData.units) {
        unitById.set(u.id, u);
      }

      function renderGroupHtml(g) {
        const gUnits = unitsByGroup.get(g.id) || [];
        const isOpen = openMapGroup === g.id;
        const isFocused = focusedGroup !== null && focusedGroup === g.path && allGroups.includes(g.path);
        const gRun = (overlay.groupRunning.get(g.id) || { size: 0 }).size;
        const gWait = (overlay.groupWaiting.get(g.id) || { size: 0 }).size;

        const classes = ["sys-group", isOpen ? "open" : "collapsed"];
        if (isFocused) classes.push("focused");
        if (gRun > 0) classes.push("has-running");
        if (gWait > 0) classes.push("has-waiting");

        const statsParts = [
          '<span>' + gUnits.length + (gUnits.length === 1 ? " unit" : " units") + '</span>'
        ];
        if (gRun > 0) {
          statsParts.push('<span class="map-stat-running">' + gRun + ' in progress</span>');
        }
        if (gWait > 0) {
          statsParts.push('<span class="map-stat-waiting">' + gWait + ' waiting</span>');
        }

        let bodyHtml = "";
        if (isOpen) {
          if (gUnits.length === 0) {
            bodyHtml = '<div class="sys-empty-units">No units in this group.</div>';
          } else {
            const groupUnitIds = gUnits.map(u => u.id);
            const groupUnitSet = new Set(groupUnitIds);
            const internalEdges = mapData.edges.filter(
              e => e.level === "unit" && groupUnitSet.has(e.from) && groupUnitSet.has(e.to)
            );
            const unitCols = computeDependencyColumns(groupUnitIds, internalEdges);
            bodyHtml = '<div class="sys-units-cols">' + unitCols.map(col =>
              '<div class="sys-unit-col">' + col.map(uid => {
                const u = unitById.get(uid);
                const uRun = (overlay.unitRunning.get(uid) || { size: 0 }).size;
                const uWait = (overlay.unitWaiting.get(uid) || { size: 0 }).size;
                const uClasses = ["sys-unit"];
                if (uRun > 0) uClasses.push("has-running");
                if (uWait > 0) uClasses.push("has-waiting");
                let uOverlayHtml = "";
                if (uRun > 0 || uWait > 0) {
                  uOverlayHtml = '<span class="sys-unit-overlay nums">' +
                    (uRun > 0 ? '<span class="map-stat-running">' + uRun + ' in progress</span>' : "") +
                    (uWait > 0 ? '<span class="map-stat-waiting">' + uWait + ' waiting</span>' : "") +
                  '</span>';
                }
                return '<button type="button" class="' + uClasses.join(" ") + '" data-unit-id="' + escapeHtml(u.id) + '" data-node-id="unit:' + escapeHtml(u.id) + '" title="' + escapeHtml(u.id) + '">' +
                  '<span class="sys-unit-label">' + escapeHtml(unitShortName(u.id)) + '</span>' +
                  uOverlayHtml +
                '</button>';
              }).join("") + '</div>'
            ).join("") + '</div>';
          }
        }

        const nodeAttr = isOpen ? "" : ' data-node-id="group:' + escapeHtml(g.id) + '"';
        return '<div class="' + classes.join(" ") + '"' + nodeAttr + '>' +
          '<button type="button" class="sys-group-head" data-sys-group="' + escapeHtml(g.id) + '" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="sys-group-top">' +
              '<span class="sys-group-id">' + escapeHtml(g.id) + '</span>' +
              '<span class="sys-group-kind">' + escapeHtml(g.kind) + '</span>' +
            '</span>' +
            '<span class="sys-group-meta nums">' + statsParts.join("") + '</span>' +
          '</button>' +
          bodyHtml +
        '</div>';
      }

      let groupsMarkup = "";
      if (groupCols.length > 1) {
        groupsMarkup = '<div class="sys-groups-cols">' + groupCols.map(col =>
          '<div class="sys-group-col">' + col.map(gid => renderGroupHtml(groupById.get(gid))).join("") + '</div>'
        ).join("") + '</div>';
      } else {
        groupsMarkup = '<div class="sys-groups-grid">' + mapData.groups.map(renderGroupHtml).join("") + '</div>';
      }

      sysEl.innerHTML =
        '<div class="sys-canvas">' +
          '<svg class="sys-svg" aria-hidden="true"></svg>' +
          groupsMarkup +
        '</div>';

      drawSystemEdges(mapData);
      requestAnimationFrame(() => drawSystemEdges(mapData));
    }

    function renderDataTab(state, force) {
      if (mapTab !== "data") return;
      const headEl = document.getElementById("map-data-head");
      const bodyEl = document.getElementById("map-data-body");

      if (!selectedRepo) {
        headEl.hidden = true;
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        bodyEl.innerHTML = '<div class="map-loading">No repositories in this replay.</div>';
        lastDataSig = "no-repo";
        return;
      }

      const entry = mapCache.get(selectedRepo);
      if (!entry) {
        ensureRepoMapLoaded(selectedRepo);
        return;
      }
      if (entry.status === "loading") {
        headEl.hidden = true;
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        bodyEl.innerHTML = '<div class="map-loading">reading the code</div>';
        lastDataSig = "loading:" + selectedRepo;
        return;
      }
      if (entry.status === "error") {
        headEl.hidden = true;
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        bodyEl.innerHTML = '<div class="map-error">' + escapeHtml(entry.error) + '</div>';
        lastDataSig = "error:" + selectedRepo + ":" + entry.error;
        return;
      }

      headEl.hidden = false;
      const mapData = entry.data;
      const overlay = computeOverlay(mapData, state);
      renderMapMeta(mapData, overlay, force);
      renderMapDetail(mapData);

      const sig = [selectedRepo, showAllStructures ? "1" : "0", selectedMapStructure || "", overlay.sig].join("||");
      if (!force && sig === lastDataSig) return;
      lastDataSig = sig;

      const shown = showAllStructures
        ? mapData.structures
        : mapData.structures.filter(s => s.serialisable);

      if (shown.length === 0) {
        bodyEl.innerHTML = '<div class="map-loading">' +
          (mapData.structures.length > 0 && !showAllStructures
            ? "No serialisable structures in this repository."
            : "No structures in this repository.") +
        '</div>';
        return;
      }

      const byUnit = new Map();
      for (const s of shown) {
        if (!byUnit.has(s.unit)) byUnit.set(s.unit, []);
        byUnit.get(s.unit).push(s);
      }

      const groupsHtml = Array.from(byUnit.entries()).map(([unitId, structs]) => {
        const uRun = (overlay.unitRunning.get(unitId) || { size: 0 }).size;
        const uWait = (overlay.unitWaiting.get(unitId) || { size: 0 }).size;
        const unitStats = [];
        if (uRun > 0) unitStats.push('<span class="map-stat-running">' + uRun + ' in progress</span>');
        if (uWait > 0) unitStats.push('<span class="map-stat-waiting">' + uWait + ' waiting</span>');
        const unitStatsHtml = unitStats.length > 0
          ? '<span class="sys-unit-overlay nums">' + unitStats.join("") + '</span>'
          : "";

        const rowsHtml = structs.map(s => {
          const isSelected = selectedMapStructure === s.id;
          const refCount = s.referenced_by.length;
          return '<button type="button" class="data-struct-row' + (isSelected ? " selected" : "") + '" data-struct-id="' + escapeHtml(s.id) + '">' +
            '<span class="data-struct-main">' +
              '<span class="data-struct-name">' + escapeHtml(s.name) + '</span>' +
              '<span class="data-struct-kind">' + escapeHtml(s.kind) + '</span>' +
            '</span>' +
            '<span class="data-struct-refs nums">' + refCount + (refCount === 1 ? " ref" : " refs") + '</span>' +
          '</button>';
        }).join("");

        return '<section class="data-unit-group">' +
          '<div class="data-unit-head"><span>' + escapeHtml(unitId) + '</span>' + unitStatsHtml + '</div>' +
          '<div class="data-unit-list">' + rowsHtml + '</div>' +
        '</section>';
      }).join("");

      bodyEl.innerHTML = groupsHtml;
    }

    function renderMapPane(state, force) {
      renderMapChrome();
      if (mapTab === "runs") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        renderMap(state, force);
      } else if (mapTab === "system") {
        renderSystemTab(state, force);
      } else if (mapTab === "data") {
        renderDataTab(state, force);
      }
    }

    function checkArrivalsForOffer(prevT, nextT) {
      if (mode !== "design" || focusedGroup === null || activeOffer !== null) return;
      if (nextT <= prevT) return;
      for (const r of replayData.runs) {
        if (r.finished_at > prevT && r.finished_at <= nextT) {
          if (r.card === "exception" && runGroupName(r) === focusedGroup && !isResolved(r.key) && !dismissedOffers.has(r.key)) {
            activeOffer = { key: r.key, id: r.id, group: focusedGroup };
            return;
          }
        }
      }
    }

    function setReplayTime(nextT) {
      const clamped = Math.max(windowStart, Math.min(windowEnd, nextT));
      const prevT = replayTime;
      replayTime = clamped;
      checkArrivalsForOffer(prevT, replayTime);
      renderAll(false);
    }

    function renderModeChrome() {
      const designTab = document.getElementById("mode-design");
      const reviewTab = document.getElementById("mode-review");
      const convEl = document.getElementById("conversation");
      const reviewWrap = document.getElementById("review-wrap");
      const checkinEl = document.getElementById("checkin");

      const isDesign = mode === "design";
      designTab.classList.toggle("active", isDesign);
      designTab.setAttribute("aria-selected", isDesign ? "true" : "false");
      reviewTab.classList.toggle("active", !isDesign);
      reviewTab.setAttribute("aria-selected", !isDesign ? "true" : "false");

      convEl.hidden = !isDesign;
      reviewWrap.hidden = isDesign;
      checkinEl.hidden = !(!isDesign && checkinOpen);
    }

    function renderAll(force) {
      if (!replayData) return;
      const state = computeState(replayTime);
      updateClockBar(state);
      renderModeChrome();
      updateFocusIndicator();
      renderMapPane(state, force);
      renderConversation(force);
      renderOffer();
      renderQueue(state, force);
    }

    function resetCheckinControls() {
      checkinFocus = null;
      checkinTiredness = null;
      stopPauseTimer();
      pauseElapsed = 0;
      document.getElementById("pause-status").textContent = "Optional one-minute pause before starting review.";
      document.getElementById("pause-btn").textContent = "One-minute pause";
      document.querySelectorAll("#checkin .scale-btn").forEach(btn => {
        btn.classList.remove("selected");
      });
    }

    function stopPauseTimer() {
      if (pauseTimerId !== null) {
        clearInterval(pauseTimerId);
        pauseTimerId = null;
      }
      pauseRemaining = 0;
    }

    function switchMode(targetMode, scrollToGroup) {
      if (targetMode === mode) {
        if (targetMode === "review" && scrollToGroup) {
          scrollQueueToGroup(scrollToGroup);
        }
        return;
      }
      const prevMode = mode;
      mode = targetMode;
      appendLog({ type: "mode_switch", from: prevMode, to: targetMode });

      if (targetMode === "review") {
        activeOffer = null;
        checkinOpen = true;
        pendingScrollGroup = scrollToGroup || focusedGroup || null;
        resetCheckinControls();
      } else {
        stopPauseTimer();
        checkinOpen = false;
      }
      renderAll(true);
    }

    function applyDecision(runKey, action, note) {
      const trimmedNote = (note || "").trim();
      if ((action === "send_back" || action === "hold") && trimmedNote.length === 0) {
        noteErrors.set(runKey, "A one-line note is required.");
        renderAll(true);
        return;
      }
      const shownAt = firstShownAt.get(runKey);
      const secondsSinceShown = shownAt != null
        ? Math.round(((Date.now() - shownAt) / 1000) * 10) / 10
        : 0;

      decisions.set(runKey, {
        action,
        note: trimmedNote,
        at: Date.now()
      });
      pendingNoteAction.delete(runKey);
      noteDrafts.delete(runKey);
      noteErrors.delete(runKey);

      appendLog({
        type: "decision",
        run_key: runKey,
        action,
        note: trimmedNote,
        seconds_in_queue: secondsSinceShown
      });

      renderAll(true);
    }

    function acceptAllCleanInGroup(groupName) {
      const state = computeState(replayTime);
      const targets = state.undecidedArrived.filter(r => r.card === "clean" && runGroupName(r) === groupName);
      for (const r of targets) {
        const shownAt = firstShownAt.get(r.key);
        const secondsSinceShown = shownAt != null
          ? Math.round(((Date.now() - shownAt) / 1000) * 10) / 10
          : 0;
        decisions.set(r.key, { action: "accept", note: "", at: Date.now() });
        appendLog({
          type: "decision",
          run_key: r.key,
          action: "accept",
          note: "",
          seconds_in_queue: secondsSinceShown
        });
      }
      renderAll(true);
    }

    function setFocusGroup(groupName) {
      const next = focusedGroup === groupName ? null : groupName;
      focusedGroup = next;
      if (activeOffer && activeOffer.group !== focusedGroup) {
        activeOffer = null;
      }
      appendLog({ type: "focus_change", group: focusedGroup });
      renderAll(true);
      if (focusedGroup !== null && mode === "review" && !checkinOpen) {
        scrollQueueToGroup(focusedGroup);
      }
    }

    function startPlayback() {
      if (playing) return;
      if (replayTime >= windowEnd) {
        setReplayTime(windowStart);
      }
      playing = true;
      lastTickRealMs = performance.now();
      renderAll(false);
      playRafId = requestAnimationFrame(playbackStep);
    }

    function stopPlayback() {
      playing = false;
      lastTickRealMs = null;
      if (playRafId !== null) {
        cancelAnimationFrame(playRafId);
        playRafId = null;
      }
      renderAll(false);
    }

    function playbackStep(nowMs) {
      if (!playing) return;
      const dtSec = Math.min(0.25, Math.max(0, (nowMs - lastTickRealMs) / 1000));
      lastTickRealMs = nowMs;
      const nextT = replayTime + dtSec * speed;
      if (nextT >= windowEnd) {
        setReplayTime(windowEnd);
        stopPlayback();
        return;
      }
      setReplayTime(nextT);
      playRafId = requestAnimationFrame(playbackStep);
    }

    function jumpToNextArrival() {
      let nextFinished = null;
      for (const r of replayData.runs) {
        if (r.finished_at > replayTime) {
          if (nextFinished === null || r.finished_at < nextFinished) {
            nextFinished = r.finished_at;
          }
        }
      }
      if (nextFinished !== null) {
        setReplayTime(nextFinished);
      }
    }

    function updateSessionTimer() {
      const el = document.getElementById("session");
      if (!el) return;
      const elapsedSec = (Date.now() - sessionOpenedMs) / 1000;
      const val = el.querySelector(".metric-val");
      if (val) val.textContent = formatDuration(elapsedSec);
    }

    function setMapTab(nextTab, logChange) {
      if (nextTab === mapTab) return;
      mapTab = nextTab;
      hoveredMapUnit = null;
      if (logChange) {
        appendLog({ type: "map_tab", tab: mapTab });
      }
      if ((mapTab === "system" || mapTab === "data") && selectedRepo) {
        ensureRepoMapLoaded(selectedRepo);
      }
      renderAll(true);
    }

    function shouldAutoOpenGuide() {
      try {
        if (typeof localStorage === "undefined" || localStorage === null) {
          return false;
        }
        if (localStorage.getItem(GUIDE_SEEN_KEY)) {
          return false;
        }
        localStorage.setItem(GUIDE_SEEN_KEY, "1");
        return true;
      } catch (_) {
        return false;
      }
    }

    function markGuideSeen() {
      try {
        if (typeof localStorage !== "undefined" && localStorage !== null) {
          localStorage.setItem(GUIDE_SEEN_KEY, "1");
        }
      } catch (_) {}
    }

    function clearGuideTarget() {
      if (guideTargetEl) {
        guideTargetEl.classList.remove("guide-target");
        guideTargetEl = null;
      }
    }

    function isGuideTargetVisible(el) {
      if (!el || el.hidden || el.closest("[hidden]")) return false;
      const rect = el.getBoundingClientRect();
      return rect.width > 0 || rect.height > 0;
    }

    function positionGuidePanel() {
      const panel = document.getElementById("guide-panel");
      if (!guideOpen || !panel) return;
      if (!guideTargetEl || !isGuideTargetVisible(guideTargetEl)) {
        clearGuideTarget();
        panel.classList.add("centered");
        panel.style.top = "";
        panel.style.left = "";
        return;
      }

      panel.classList.remove("centered");
      const rect = guideTargetEl.getBoundingClientRect();
      const panelRect = panel.getBoundingClientRect();
      const pw = panelRect.width || 340;
      const ph = panelRect.height || 180;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const margin = 12;
      const gap = 12;

      const clampX = (x) => Math.max(margin, Math.min(vw - pw - margin, x));
      const clampY = (y) => Math.max(margin, Math.min(vh - ph - margin, y));

      let top;
      let left;
      if (rect.bottom + gap + ph + margin <= vh) {
        top = rect.bottom + gap;
        left = clampX(rect.left + (rect.width - pw) / 2);
      } else if (rect.top - gap - ph >= margin) {
        top = rect.top - gap - ph;
        left = clampX(rect.left + (rect.width - pw) / 2);
      } else if (rect.right + gap + pw + margin <= vw) {
        left = rect.right + gap;
        top = clampY(rect.top + 16);
      } else if (rect.left - gap - pw >= margin) {
        left = rect.left - gap - pw;
        top = clampY(rect.top + 16);
      } else {
        left = clampX((vw - pw) / 2);
        top = clampY(rect.top + 24);
      }

      panel.style.top = Math.round(top) + "px";
      panel.style.left = Math.round(left) + "px";
    }

    function showGuideStep(index) {
      if (index < 0 || index >= GUIDE_STEPS.length) return;
      guideStepIndex = index;
      const step = GUIDE_STEPS[guideStepIndex];

      clearGuideTarget();
      if (step.tab) {
        setMapTab(step.tab, false);
      }

      const panel = document.getElementById("guide-panel");
      document.getElementById("guide-count").textContent = (guideStepIndex + 1) + " of " + GUIDE_STEPS.length;
      document.getElementById("guide-title").textContent = step.title;
      document.getElementById("guide-text").textContent = step.text;

      const backBtn = document.getElementById("guide-back");
      backBtn.disabled = guideStepIndex === 0;

      const nextBtn = document.getElementById("guide-next");
      nextBtn.textContent = guideStepIndex === GUIDE_STEPS.length - 1 ? "Done" : "Next";

      panel.hidden = false;

      const targetEl = document.querySelector(step.target);
      if (isGuideTargetVisible(targetEl)) {
        if (typeof targetEl.scrollIntoView === "function") {
          targetEl.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
        targetEl.classList.add("guide-target");
        guideTargetEl = targetEl;
      }

      positionGuidePanel();
      appendLog({ type: "guide_step", step: step.id });
    }

    function openGuide() {
      if (guideOpen) return;
      guideWasPlaying = playing;
      if (playing) {
        stopPlayback();
      }
      guideOpen = true;
      guideStepIndex = 0;
      markGuideSeen();
      const guideBtn = document.getElementById("guide");
      if (guideBtn) guideBtn.setAttribute("aria-expanded", "true");
      appendLog({ type: "guide_open" });
      showGuideStep(0);
      const nextBtn = document.getElementById("guide-next");
      if (nextBtn) nextBtn.focus();
    }

    function closeGuide() {
      if (!guideOpen) return;
      const step = GUIDE_STEPS[guideStepIndex];
      clearGuideTarget();
      const panel = document.getElementById("guide-panel");
      if (panel) panel.hidden = true;
      const guideBtn = document.getElementById("guide");
      if (guideBtn) guideBtn.setAttribute("aria-expanded", "false");
      guideOpen = false;
      markGuideSeen();
      appendLog({ type: "guide_close", step: step ? step.id : null });
      const shouldResume = guideWasPlaying;
      guideWasPlaying = false;
      if (shouldResume && !playing) {
        startPlayback();
      }
    }

    function bindEvents() {

        if (playing) stopPlayback();
        else startPlayback();
      });

      document.getElementById("speed").addEventListener("change", (e) => {

      });

      document.getElementById("save-btn").addEventListener("click", () => {

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "blyte-mock-log.json";
        document.body.appendChild(a);
        a.click();
        a.remove();

      });

      document.getElementById("clear-btn").addEventListener("click", () => {
        logEntries = [];
        try {
          localStorage.removeItem(LOG_STORAGE_KEY);
        } catch (_) {}

      });

      document.getElementById("mode-design").addEventListener("click", () => {
        switchMode("design", null);
      });

      document.getElementById("mode-review").addEventListener("click", () => {
        switchMode("review", null);
      });

      document.getElementById("focus-indicator").addEventListener("click", (e) => {
        if (e.target.closest("[data-clear-focus]")) {
          setFocusGroup(focusedGroup);
        }
      });

      document.getElementById("conversation-form").addEventListener("submit", (e) => {
        e.preventDefault();

        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        const prefix = focusedGroup !== null ? "about " + focusedGroup + " · " : "";
        designMessages.push({
          seq: ++msgSeq,
          replayTime,
          role: "user",
          meta: prefix + formatReplayDateTime(replayTime),
          text
        });
        designMessages.push({
          seq: ++msgSeq,
          replayTime,
          role: "assistant",
          meta: "orchestrator",
          text: FIXED_REPLY
        });

          type: "conversation_message",
          group: focusedGroup,
          text
        });
        renderConversation(true);
      });

      document.getElementById("offer").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-offer-choice]");
        if (!btn || !activeOffer) return;
        const choice = btn.dataset.offerChoice;
        const offerSnapshot = activeOffer;
        appendLog({
          type: "offer",
          choice,
          run_key: offerSnapshot.key,
          group: offerSnapshot.group
        });
        if (choice === "now") {
          activeOffer = null;
          switchMode("review", offerSnapshot.group);
        } else {
          dismissedOffers.add(offerSnapshot.key);
          activeOffer = null;
          renderOffer();
        }
      });

      document.getElementById("checkin").addEventListener("click", (e) => {
        const scaleBtn = e.target.closest(".scale-btn");
        if (scaleBtn) {
          const group = scaleBtn.closest(".scale-group");
          const scale = group.dataset.scale;
          const val = Number(scaleBtn.dataset.val);
          if (scale === "focus") checkinFocus = val;
          if (scale === "tiredness") checkinTiredness = val;
          group.querySelectorAll(".scale-btn").forEach(b => {
            b.classList.toggle("selected", Number(b.dataset.val) === val);
          });
          return;
        }

        if (e.target.id === "pause-btn") {
          if (pauseTimerId !== null) {
            stopPauseTimer();
            document.getElementById("pause-btn").textContent = "One-minute pause";
            document.getElementById("pause-status").textContent = "Pause stopped (" + pauseElapsed + "s).";
          } else {
            pauseRemaining = 60;
            document.getElementById("pause-btn").textContent = "Stop pause";
            document.getElementById("pause-status").textContent = "One-minute pause: 01:00 remaining";
            pauseTimerId = setInterval(() => {
              pauseRemaining -= 1;
              pauseElapsed += 1;
              if (pauseRemaining <= 0) {
                stopPauseTimer();
                document.getElementById("pause-btn").textContent = "One-minute pause";
                document.getElementById("pause-status").textContent = "One-minute pause complete.";
              } else {
                document.getElementById("pause-status").textContent =
                  "One-minute pause: " + formatDuration(pauseRemaining) + " remaining";
              }
            }, 1000);
          }
          return;
        }

        if (e.target.id === "checkin-continue") {
          stopPauseTimer();
          appendLog({
            type: "checkin",
            skipped: false,
            focus: checkinFocus,
            tiredness: checkinTiredness,
            paused_seconds: pauseElapsed
          });
          checkinOpen = false;
          renderAll(true);
          return;
        }

        if (e.target.id === "checkin-skip") {
          stopPauseTimer();
          appendLog({
            type: "checkin",
            skipped: true,
            focus: null,
            tiredness: null,
            paused_seconds: pauseElapsed
          });
          checkinOpen = false;
          renderAll(true);
        }
      });

      document.getElementById("map").addEventListener("click", (e) => {
        const box = e.target.closest("[data-map-group]");
        if (!box) return;
        setFocusGroup(box.dataset.mapGroup);
      });

      document.getElementById("map-tabs").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-map-tab]");
        if (!btn) return;
        setMapTab(btn.dataset.mapTab, true);
      });

      document.getElementById("map-repo").addEventListener("change", (e) => {
        const nextRepo = e.target.value || null;
        if (nextRepo === selectedRepo) return;
        selectedRepo = nextRepo;
        openMapGroup = null;
        selectedMapUnit = null;
        hoveredMapUnit = null;
        selectedMapStructure = null;
        mapNotesOpen = false;
        lastSystemSig = "";
        lastDataSig = "";
        lastMetaSig = "";
        appendLog({ type: "map_repo", repo: selectedRepo });
        if ((mapTab === "system" || mapTab === "data") && selectedRepo) {
          ensureRepoMapLoaded(selectedRepo);
        }
        renderAll(true);
      });

      document.getElementById("map-wide").addEventListener("click", () => {
        mapWide = !mapWide;
        appendLog({ type: "map_wide", wide: mapWide });
        renderMapChrome();
        if (mapTab === "system" && selectedRepo) {
          const entry = mapCache.get(selectedRepo);
          if (entry && entry.status === "ok") {
            requestAnimationFrame(() => drawSystemEdges(entry.data));
          }
        }
      });

      document.getElementById("map-data-all").addEventListener("change", (e) => {
        showAllStructures = Boolean(e.target.checked);
        if (!showAllStructures && selectedMapStructure && selectedRepo) {
          const entry = mapCache.get(selectedRepo);
          if (entry && entry.status === "ok") {
            const s = entry.data.structures.find(x => x.id === selectedMapStructure);
            if (s && !s.serialisable) {
              selectedMapStructure = null;
            }
          }
        }
        renderAll(true);
      });

      document.getElementById("map-notes").addEventListener("click", (e) => {
        if (!e.target.closest("[data-toggle-notes]")) return;
        mapNotesOpen = !mapNotesOpen;
        renderAll(true);
      });

      document.getElementById("map-detail").addEventListener("click", (e) => {
        if (!e.target.closest("[data-close-detail]")) return;
        if (mapTab === "system") {
          selectedMapUnit = null;
          hoveredMapUnit = null;
          applySystemHighlight();
        } else if (mapTab === "data") {
          selectedMapStructure = null;
          renderAll(true);
        }
      });

      const sysEl = document.getElementById("map-system");
      sysEl.addEventListener("click", (e) => {
        const unitBtn = e.target.closest("[data-unit-id]");
        if (unitBtn) {
          const uid = unitBtn.dataset.unitId;
          selectedMapUnit = selectedMapUnit === uid ? null : uid;
          appendLog({ type: "map_unit", repo: selectedRepo, unit: selectedMapUnit });
          applySystemHighlight();
          return;
        }
        const groupBtn = e.target.closest("[data-sys-group]");
        if (groupBtn) {
          const gid = groupBtn.dataset.sysGroup;
          openMapGroup = openMapGroup === gid ? null : gid;
          selectedMapUnit = null;
          hoveredMapUnit = null;
          appendLog({ type: "map_group", repo: selectedRepo, group: openMapGroup });
          const entry = selectedRepo ? mapCache.get(selectedRepo) : null;
          const groupObj = entry && entry.status === "ok"
            ? entry.data.groups.find(g => g.id === gid)
            : null;
          if (groupObj && allGroups.includes(groupObj.path)) {
            setFocusGroup(groupObj.path);
          } else {
            renderAll(true);
          }
        }
      });

      sysEl.addEventListener("mouseover", (e) => {
        const unitBtn = e.target.closest("[data-unit-id]");
        if (!unitBtn) return;
        const uid = unitBtn.dataset.unitId;
        if (hoveredMapUnit !== uid) {
          hoveredMapUnit = uid;
          applySystemHighlight();
        }
      });

      sysEl.addEventListener("mouseout", (e) => {
        const unitBtn = e.target.closest("[data-unit-id]");
        if (!unitBtn) return;
        const related = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("[data-unit-id]") : null;
        if (related === unitBtn) return;
        if (hoveredMapUnit !== null) {
          hoveredMapUnit = null;
          applySystemHighlight();
        }
      });

      document.getElementById("map-data").addEventListener("click", (e) => {
        const row = e.target.closest("[data-struct-id]");
        if (!row) return;
        const sid = row.dataset.structId;
        selectedMapStructure = selectedMapStructure === sid ? null : sid;
        appendLog({ type: "map_structure", repo: selectedRepo, structure: selectedMapStructure });
        renderAll(true);
      });

      window.addEventListener("resize", () => {
        if (guideOpen) {
          positionGuidePanel();
        }
        if (mapTab !== "system" || !selectedRepo) return;
        const entry = mapCache.get(selectedRepo);
        if (entry && entry.status === "ok") {
          drawSystemEdges(entry.data);
        }
      });

      document.getElementById("guide").addEventListener("click", () => {
        if (guideOpen) closeGuide();
        else openGuide();
      });

      document.getElementById("guide-close").addEventListener("click", () => {
        closeGuide();
      });

      document.getElementById("guide-back").addEventListener("click", () => {
        if (guideStepIndex > 0) {
          showGuideStep(guideStepIndex - 1);
        }
      });

      document.getElementById("guide-next").addEventListener("click", () => {
        if (guideStepIndex >= GUIDE_STEPS.length - 1) {
          closeGuide();
        } else {
          showGuideStep(guideStepIndex + 1);
        }
      });

      document.addEventListener("keydown", (e) => {
        if (!guideOpen) return;
        if (e.key === "Escape") {
          e.preventDefault();
          closeGuide();
          return;
        }
        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
        if (tag === "input" || tag === "textarea" || tag === "select") return;
        if (e.key === "ArrowRight") {
          e.preventDefault();
          if (guideStepIndex < GUIDE_STEPS.length - 1) {
            showGuideStep(guideStepIndex + 1);
          }
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (guideStepIndex > 0) {
            showGuideStep(guideStepIndex - 1);
          }
        }
      });

      const queueEl = document.getElementById("queue");
      queueEl.addEventListener("click", (e) => {
        const acceptAllBtn = e.target.closest("[data-accept-all-clean]");
        if (acceptAllBtn) {
          acceptAllCleanInGroup(acceptAllBtn.dataset.acceptAllClean);
          return;
        }

        const detailsBtn = e.target.closest("[data-toggle-details]");
        if (detailsBtn) {
          const key = detailsBtn.dataset.toggleDetails;
          if (openDetails.has(key)) {
            openDetails.delete(key);
          } else {
            openDetails.add(key);
            appendLog({ type: "details_opened", run_key: key });
          }
          renderAll(true);
          return;
        }

        const cancelNoteBtn = e.target.closest("[data-cancel-note]");
        if (cancelNoteBtn) {
          const key = cancelNoteBtn.dataset.cancelNote;
          pendingNoteAction.delete(key);
          noteErrors.delete(key);
          renderAll(true);
          return;
        }

        const actionBtn = e.target.closest("[data-action][data-run-key]");
        if (actionBtn) {
          const key = actionBtn.dataset.runKey;
          const action = actionBtn.dataset.action;
          if (action === "accept" || action === "redo") {
            applyDecision(key, action, "");
          } else if (action === "send_back" || action === "hold") {
            pendingNoteAction.set(key, action);
            noteErrors.delete(key);
            renderAll(true);
            const inp = queueEl.querySelector('[data-note-input="' + CSS.escape(key) + '"]');
            if (inp) inp.focus();
          }
        }
      });

      queueEl.addEventListener("input", (e) => {
        const noteInp = e.target.closest("[data-note-input]");
        if (noteInp) {
          const key = noteInp.dataset.noteInput;
          noteDrafts.set(key, noteInp.value);
          noteErrors.delete(key);
          return;
        }
        const gInp = e.target.closest("[data-group-input]");
        if (gInp) {
          groupInputDrafts.set(gInp.dataset.groupInput, gInp.value);
        }
      });

      queueEl.addEventListener("submit", (e) => {
        const noteForm = e.target.closest("[data-note-form]");
        if (noteForm) {
          e.preventDefault();
          const key = noteForm.dataset.noteForm;
          const action = noteForm.dataset.noteAction;
          const val = noteDrafts.get(key) || "";
          applyDecision(key, action, val);
          return;
        }

        const gForm = e.target.closest("[data-group-thread]");
        if (gForm) {
          e.preventDefault();
          const gName = gForm.dataset.groupThread;
          const text = (groupInputDrafts.get(gName) || "").trim();
          if (!text) return;
          groupInputDrafts.set(gName, "");
          if (!groupThreads.has(gName)) groupThreads.set(gName, []);
          groupThreads.get(gName).push({ role: "user", text });
          groupThreads.get(gName).push({ role: "assistant", text: FIXED_REPLY });
          appendLog({ type: "group_message", group: gName, text });
          renderAll(true);
          const inp = queueEl.querySelector('[data-group-input="' + CSS.escape(gName) + '"]');
          if (inp) inp.focus();
        }
      });
    }

    async function init() {
      updateLogCount();
      updateSessionTimer();
      setInterval(updateSessionTimer, 1000);

      let response;
      try {
        response = await fetch("/api/replay");
      } catch (err) {
        showFatalError("Failed to fetch /api/replay: " + (err && err.message ? err.message : String(err)));
        return;
      }

      if (!response.ok) {
        let bodyText = "";
        try { bodyText = await response.text(); } catch (_) {}
        showFatalError("Failed to load /api/replay: HTTP " + response.status + (bodyText ? "\n" + bodyText : ""));
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch (err) {
        showFatalError("Invalid JSON from /api/replay: " + (err && err.message ? err.message : String(err)));
        return;
      }

      const validationErr = validateContract(data);
      if (validationErr) {
        showFatalError(validationErr);
        return;
      }

      replayData = data;

      const namedGroups = new Set();
      let hasNoFiles = false;
      for (const r of replayData.runs) {
        if (r.group === null) {
          hasNoFiles = true;
        } else {
          namedGroups.add(r.group);
        }
      }
      allGroups = Array.from(namedGroups).sort();
      if (hasNoFiles) {
        allGroups.push(NO_FILES_GROUP);
      }

      const repoCounts = new Map();
      for (const r of replayData.runs) {
        repoCounts.set(r.repo, (repoCounts.get(r.repo) || 0) + 1);
      }
      repoList = Array.from(repoCounts.entries())
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => (b.count !== a.count ? b.count - a.count : a.name.localeCompare(b.name)));
      selectedRepo = repoList.length > 0 ? repoList[0].name : null;

      const repoSelect = document.getElementById("map-repo");
      if (repoList.length === 0) {
        repoSelect.innerHTML = '<option value="">no repos</option>';
        repoSelect.disabled = true;
      } else {
        repoSelect.disabled = false;
        repoSelect.innerHTML = repoList.map(item =>
          '<option value="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + ' (' + item.count + ')</option>'
        ).join("");
        repoSelect.value = selectedRepo;
      }

      if (replayData.runs.length > 0) {
        let minS = replayData.runs[0].started_at;
        let maxF = replayData.runs[0].finished_at;
        for (const r of replayData.runs) {
          if (r.started_at < minS) minS = r.started_at;
          if (r.finished_at > maxF) maxF = r.finished_at;
        }
        windowStart = minS;
        windowEnd = Math.max(maxF, minS + 1);
        replayTime = windowStart;
      } else {
        windowEnd = replayData.exported_at;
        windowStart = Math.max(0, replayData.exported_at - replayData.window_days * 86400);
        if (windowEnd <= windowStart) windowEnd = windowStart + 1;
        replayTime = windowStart;
      }

      const slider = document.getElementById("clock");
      slider.min = String(windowStart);
      slider.max = String(windowEnd);
      slider.value = String(replayTime);

      bindEvents();
      renderAll(true);
      if (shouldAutoOpenGuide()) {
        openGuide();
      }
    }

    init();
  </script>
</body>
</html>
