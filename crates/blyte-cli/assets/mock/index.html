<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blyte mock</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("/fonts/archivo.woff2") format("woff2");
      font-weight: 400 900;
      font-stretch: 62% 125%;
      font-display: swap;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/fonts/plex-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/fonts/plex-mono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --color-page: #ECEFF0;
      --color-card: #F4F6F7;
      --color-line: #C9D0D4;
      --color-line-dark: #B3BCC1;
      --color-text: #2A3238;
      --color-strong: #141A1E;
      --color-muted: #56616A;
      --color-faint: #8A959C;

      --status-running: #A6441A;
      --status-amber: #8A6A12;
      --status-jade: #2E7A4D;
      --status-jade-label: #2E7A4D;
      --status-red: #A93A36;
      --status-red-label: #A93A36;
      --status-grey: #8A959C;

      --focus-ring: #A6441A;
      --brand-rust: #A6441A;
      --brand-rust-soft: #E8C8B7;

      --font-sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --page: #ECEFF0;
      --card: #F4F6F7;
      --line: #C9D0D4;
      --line-2: #B3BCC1;
      --text: #2A3238;
      --strong: #141A1E;
      --muted: #56616A;
      --faint: #8A959C;
      --rust: #A6441A;
      --rust-soft: #E8C8B7;
      --pass: #2E7A4D;
      --pass-soft: #CFE3D6;
      --fail: #A93A36;
      --fail-soft: #F0D3D1;
      --amber: #8A6A12;
      --amber-soft: #EFE3BF;
      --merged: #3E6D64;
      --merged-soft: #C3D6D1;
      --lane: #E6EAEC;
      --ink: #141A1E;
      --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-page: #0F1315;
        --color-card: #171D20;
        --color-line: #283136;
        --color-line-dark: #36414A;
        --color-text: #C9D1D5;
        --color-strong: #E2E7E9;
        --color-muted: #93A0A7;
        --color-faint: #5F6C73;

        --status-running: #E27A44;
        --status-amber: #D9B45A;
        --status-jade: #6CC08E;
        --status-jade-label: #6CC08E;
        --status-red: #E27B76;
        --status-red-label: #E27B76;
        --status-grey: #5F6C73;

        --focus-ring: #E27A44;
        --brand-rust: #E27A44;
        --brand-rust-soft: #4A2B1D;

        --page: #0F1315;
        --card: #171D20;
        --line: #283136;
        --line-2: #36414A;
        --text: #C9D1D5;
        --strong: #E2E7E9;
        --muted: #93A0A7;
        --faint: #5F6C73;
        --rust: #E27A44;
        --rust-soft: #4A2B1D;
        --pass: #6CC08E;
        --pass-soft: #1E3428;
        --fail: #E27B76;
        --fail-soft: #3A2120;
        --amber: #D9B45A;
        --amber-soft: #3A3218;
        --merged: #7FB2A6;
        --merged-soft: #1F3431;
        --lane: #131A1D;
        --ink: #E2E7E9;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--color-page);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    [hidden] {
      display: none !important;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .nums {
      font-variant-numeric: tabular-nums;
    }

    .fatal-error {
      max-width: 680px;
      margin: 64px auto;
      padding: 20px 24px;
      background: var(--fail-soft);
      border: 1px solid var(--fail);
      border-radius: 6px;
      color: var(--strong);
      font-family: var(--font-mono);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-line);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
    }

    .m-i { fill: var(--color-strong); }
    .m-s { fill: var(--brand-rust-soft); }
    .m-r { fill: var(--brand-rust); }

    .brand-word {
      font-weight: 900;
      font-variation-settings: "wdth" 125;
      letter-spacing: -0.02em;
      font-size: 17px;
      color: var(--color-strong);
      line-height: 1;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
    }

    .btn {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--brand-rust);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      background: var(--brand-rust);
      border-color: var(--brand-rust);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-pass {
      background: var(--pass-soft);
      border-color: var(--pass);
      color: var(--color-strong);
    }

    .btn-warn {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: var(--color-strong);
    }

    .btn-danger {
      background: var(--fail-soft);
      border-color: var(--fail);
      color: var(--color-strong);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--color-line);
      color: var(--color-muted);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--color-strong);
      border-color: var(--color-line-dark);
    }

    select.ctrl-select {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
    }

    .clock-readout {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      padding: 4px 8px;
      background: var(--color-page);
      border: 1px solid var(--color-line);
      border-radius: 4px;
      min-width: 156px;
      text-align: center;
    }

    .slider-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #clock {
      flex: 1;
      accent-color: var(--brand-rust);
      cursor: pointer;
      margin: 0;
    }

    .metric {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-text);
    }

    .metric-label {
      color: var(--color-muted);
      font-size: 11px;
    }

    .metric-val {
      font-weight: 500;
      color: var(--color-strong);
    }

    .metric.over-limit {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: var(--amber);
    }

    .metric.over-limit .metric-label,
    .metric.over-limit .metric-val {
      color: var(--amber);
      font-weight: 600;
    }

    .metric-btn {
      cursor: pointer;
    }

    .metric-btn:hover {
      border-color: var(--brand-rust);
    }

    .skipped-popover {
      position: relative;
    }

    .skipped-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 40;
      width: 360px;
      max-height: 280px;
      overflow-y: auto;
      background: var(--color-card);
      border: 1px solid var(--color-line-dark);
      border-radius: 6px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      font-size: 12px;
    }

    .skipped-panel h3 {
      margin: 0 0 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
    }

    .skipped-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .skipped-list li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--color-line);
      padding-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .skipped-list li:first-child {
      border-top: none;
      padding-top: 0;
    }

    #save {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .log-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
      gap: 0;
    }

    .workspace.map-wide {
      grid-template-columns: minmax(0, 2fr) minmax(300px, 3fr);
    }

    .pane-left {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--color-line);
      background: var(--color-page);
    }

    .pane-right {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--lane);
    }

    .pane-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--color-line);
      background: var(--color-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    #mode {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--color-line-dark);
      border-radius: 4px;
      color: var(--color-muted);
      background: transparent;
      cursor: pointer;
    }

    .mode-btn:hover {
      border-color: var(--brand-rust);
      color: var(--color-strong);
    }

    .mode-btn.active {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
      font-weight: 500;
    }

    .focus-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--brand-rust-soft);
      color: var(--color-strong);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .focus-chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0 2px;
      color: var(--color-strong);
      font-weight: 700;
    }

    #conversation {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thread-empty {
      color: var(--color-muted);
      font-size: 13px;
      padding: 24px 0;
      text-align: center;
    }

    .msg-line {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
      border: 1px solid var(--color-line);
      background: var(--color-card);
    }

    .msg-line.dispatch {
      background: transparent;
      border: none;
      border-left: 2px solid var(--color-line-dark);
      border-radius: 0;
      padding: 3px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-muted);
    }

    .msg-line.user {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
      align-self: flex-end;
      max-width: 85%;
    }

    .msg-line.assistant {
      background: var(--color-card);
      border-color: var(--color-line);
      color: var(--color-text);
      align-self: flex-start;
      max-width: 85%;
    }

    .msg-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-muted);
      margin-bottom: 2px;
    }

    #offer {
      margin: 0 16px 10px;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    #offer[hidden] {
      display: none;
    }

    .offer-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-strong);
    }

    .offer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .composer {
      border-top: 1px solid var(--color-line);
      background: var(--color-card);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .composer-about {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--brand-rust-soft);
      color: var(--color-strong);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-size: 13px;
    }

    .review-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #checkin {
      padding: 20px 24px;
      margin: 16px;
      border-radius: 8px;
      background: var(--color-card);
      border: 1px solid var(--brand-rust);
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }

    #checkin[hidden] {
      display: none;
    }

    .checkin-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--color-strong);
    }

    .checkin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .checkin-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-strong);
      min-width: 96px;
    }

    .scale-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scale-btn {
      width: 34px;
      height: 32px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
    }

    .scale-btn:hover {
      border-color: var(--brand-rust);
    }

    .scale-btn.selected {
      background: var(--brand-rust);
      border-color: var(--brand-rust);
      color: #FFFFFF;
      font-weight: 600;
    }

    .checkin-pause {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      background: var(--color-page);
      border: 1px solid var(--color-line);
      font-size: 12px;
      color: var(--color-muted);
    }

    .checkin-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    #queue {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .queue-group {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .queue-group.focused {
      border-color: var(--brand-rust);
      box-shadow: 0 0 0 1px var(--brand-rust);
    }

    .group-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-line);
      background: var(--lane);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .group-name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-strong);
    }

    .group-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .group-body {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clean-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
    }

    .clean-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .run-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      flex-shrink: 0;
    }

    .run-title {
      font-size: 13px;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .exception-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .exception-card {
      height: 184px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-line-dark);
      border-left: 3px solid var(--amber);
      background: var(--color-page);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .exception-card.is-failed {
      border-left-color: var(--fail);
    }

    .exception-card.is-held {
      border-left-color: var(--brand-rust);
    }

    .hold-note-first {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 3px;
      background: var(--brand-rust-soft);
      color: var(--color-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .exc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .exc-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .outcome-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--color-card);
      border: 1px solid var(--color-line-dark);
      color: var(--color-strong);
      flex-shrink: 0;
    }

    .outcome-pill.verified {
      background: var(--pass-soft);
      border-color: var(--pass);
    }

    .outcome-pill.failed {
      background: var(--fail-soft);
      border-color: var(--fail);
    }

    .exc-flags {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      margin: 4px 0;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.35;
      color: var(--color-muted);
    }

    .exc-flag-item {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-text);
    }

    .exc-flag-more {
      color: var(--color-muted);
      font-style: italic;
    }

    .exc-not-recorded {
      color: var(--amber);
      font-weight: 500;
    }

    .exc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .recorded-verdict {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
      white-space: nowrap;
    }

    .note-prompt {
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--brand-rust);
      background: var(--color-card);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .note-prompt input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-size: 12px;
    }

    .note-error {
      width: 100%;
      font-size: 11px;
      color: var(--fail);
      font-family: var(--font-mono);
    }

    .decided-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px dashed var(--color-line);
      background: transparent;
      color: var(--color-muted);
      font-size: 12px;
    }

    .decided-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }

    .decision-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--merged-soft);
      color: var(--color-strong);
      flex-shrink: 0;
    }

    .details-box {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .details-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
      margin-bottom: 2px;
    }

    .details-pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--color-page);
      border: 1px solid var(--color-line);
      border-radius: 4px;
      padding: 6px 8px;
      max-height: 180px;
      overflow-y: auto;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--color-text);
    }

    .details-list {
      margin: 0;
      padding-left: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text);
    }

    .group-thread {
      border-top: 1px solid var(--color-line);
      padding: 10px 14px;
      background: var(--color-page);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .group-thread-msgs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
    }

    .group-thread-msg {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--color-card);
      border: 1px solid var(--color-line);
    }

    .group-thread-msg.user {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
    }

    .group-thread-form {
      display: flex;
      gap: 6px;
    }

    .group-thread-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-card);
      color: var(--color-strong);
      font-size: 12px;
    }

    .map-title {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-muted);
      margin: 0;
    }

    #map {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      align-content: start;
      gap: 10px;
    }

    .map-box {
      text-align: left;
      padding: 12px;
      border-radius: 6px;
      border: 1.5px solid var(--color-line-dark);
      background: var(--color-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.12s, background 0.12s;
    }

    .map-box:hover {
      border-color: var(--brand-rust);
    }

    .map-box.focused {
      border-color: var(--brand-rust);
      background: var(--brand-rust-soft);
    }

    .map-box-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      word-break: break-word;
    }

    .map-box-stats {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .map-stat-running {
      color: var(--status-running);
      font-weight: 500;
    }

    .map-stat-waiting {
      color: var(--amber);
      font-weight: 500;
    }

    .map-pane-head {
      flex-wrap: wrap;
      gap: 8px;
    }

    #map-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #map-tabs .mode-btn {
      padding: 4px 10px;
    }

    .map-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    #map-repo {
      max-width: 180px;
    }

    #map-wide.active {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
    }

    .map-meta-bar {
      padding: 8px 16px;
      border-bottom: 1px solid var(--color-line);
      background: var(--color-card);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .map-outside {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--amber);
    }

    .map-notes {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-notes-toggle {
      align-self: flex-start;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
    }

    .map-notes-toggle:hover {
      border-color: var(--brand-rust);
      color: var(--color-strong);
    }

    .map-notes-list {
      max-height: 160px;
      overflow-y: auto;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .map-notes-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
      margin-bottom: 2px;
    }

    .map-notes-items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .map-notes-items li {
      color: var(--color-text);
      word-break: break-word;
    }

    .map-notes-reason {
      color: var(--color-muted);
    }

    .map-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-loading {
      padding: 24px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-muted);
    }

    .map-error {
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid var(--fail);
      background: var(--fail-soft);
      color: var(--color-strong);
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sys-canvas {
      position: relative;
      z-index: 0;
      min-width: min-content;
      min-height: 100%;
    }

    .sys-svg {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    .sys-edge {
      fill: none;
      stroke: var(--color-line-dark);
      stroke-width: 1.25;
      opacity: 0.45;
      transition: opacity 0.12s, stroke 0.12s, stroke-width 0.12s;
    }

    .sys-edge.edge-strong {
      stroke: var(--brand-rust);
      stroke-width: 2.2;
      opacity: 1;
    }

    .sys-edge.edge-dim {
      opacity: 0.1;
    }

    .sys-arrow-faint {
      fill: var(--color-line-dark);
    }

    .sys-arrow-strong {
      fill: var(--brand-rust);
    }

    .sys-groups-cols {
      display: flex;
      align-items: flex-start;
      gap: 28px;
    }

    .sys-group-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sys-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .sys-group {
      border-radius: 6px;
      border: 1.5px solid var(--color-line-dark);
      background: var(--color-card);
      transition: border-color 0.12s, background 0.12s, opacity 0.12s;
    }

    .sys-group.collapsed {
      position: relative;
      z-index: 3;
      min-width: 175px;
    }

    .sys-group.open {
      background: var(--color-page);
      border-color: var(--color-line-dark);
    }

    .sys-groups-grid .sys-group.open {
      grid-column: 1 / -1;
    }

    .sys-group.focused {
      border-color: var(--brand-rust);
    }

    .sys-group.collapsed.focused {
      background: var(--brand-rust-soft);
    }

    .sys-group.has-running {
      border-color: var(--status-running);
    }

    .sys-group.has-waiting:not(.has-running) {
      border-color: var(--amber);
    }

    .sys-group-head {
      position: relative;
      z-index: 3;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sys-group.open .sys-group-head {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-line);
      border-radius: 4px 4px 0 0;
    }

    .sys-group-head:hover .sys-group-id {
      color: var(--brand-rust);
    }

    .sys-group-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sys-group-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      word-break: break-word;
    }

    .sys-group-kind {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
      color: var(--color-muted);
      flex-shrink: 0;
    }

    .sys-group-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .sys-units-cols {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 12px;
    }

    .sys-unit-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 110px;
    }

    .sys-unit {
      position: relative;
      z-index: 3;
      text-align: left;
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.12s, background 0.12s, opacity 0.12s;
    }

    .sys-unit:hover,
    .sys-unit.node-active {
      border-color: var(--brand-rust);
      background: var(--brand-rust-soft);
    }

    .sys-unit.has-running {
      border-left: 3px solid var(--status-running);
    }

    .sys-unit.has-waiting:not(.has-running) {
      border-left: 3px solid var(--amber);
    }

    .sys-unit.node-related,
    .sys-group.node-related {
      border-color: var(--brand-rust);
    }

    .node-dim {
      opacity: 0.35;
    }

    .sys-unit-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      word-break: break-word;
    }

    .sys-unit-overlay {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .sys-empty-units {
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .map-data-head {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-line);
      flex-shrink: 0;
    }

    .map-data-note {
      margin: 0;
      font-size: 12px;
      color: var(--color-muted);
    }

    .map-data-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text);
      cursor: pointer;
      align-self: flex-start;
    }

    .map-data-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .data-unit-group {
      background: var(--color-card);
      border: 1px solid var(--color-line);
      border-radius: 6px;
      overflow: hidden;
    }

    .data-unit-head {
      padding: 7px 10px;
      border-bottom: 1px solid var(--color-line);
      background: var(--lane);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--color-strong);
    }

    .data-unit-list {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .data-struct-row {
      width: 100%;
      text-align: left;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .data-struct-row:hover,
    .data-struct-row.selected {
      border-color: var(--brand-rust);
      background: var(--brand-rust-soft);
    }

    .data-struct-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .data-struct-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      word-break: break-word;
    }

    .data-struct-kind {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--color-line);
      background: var(--color-card);
      color: var(--color-muted);
      flex-shrink: 0;
    }

    .data-struct-refs {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
      flex-shrink: 0;
    }

    .map-detail {
      flex-shrink: 0;
      max-height: 38%;
      overflow-y: auto;
      border-top: 1px solid var(--color-line);
      background: var(--color-card);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .map-detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .map-detail-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-strong);
      word-break: break-all;
    }

    .map-detail-file {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
      word-break: break-all;
    }

    .map-detail-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .map-detail-list {
      margin: 0;
      padding-left: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text);
    }

    .map-detail-empty {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .map-detail-type {
      color: var(--color-muted);
    }

    .guide-target {
      outline: 2px solid var(--brand-rust);
      outline-offset: -2px;
      box-shadow: inset 0 0 0 2px var(--brand-rust-soft);
    }

    #wip.guide-target,
    #save.guide-target {
      outline-offset: 2px;
      box-shadow: 0 0 0 3px var(--brand-rust-soft);
    }

    #guide-panel {
      position: fixed;
      z-index: 100;
      width: 340px;
      max-width: calc(100vw - 24px);
      background: var(--color-card);
      color: var(--color-text);
      border: 1.5px solid var(--brand-rust);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 0 0 4px var(--brand-rust-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #guide-panel[hidden] {
      display: none;
    }

    #guide-panel.centered {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .guide-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .guide-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .guide-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-strong);
      line-height: 1.3;
    }

    .guide-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--color-text);
    }

    .guide-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    @media (max-width: 900px) {
      .shell {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .workspace,
      .workspace.map-wide {
        grid-template-columns: 1fr;
      }

      .pane-left {
        border-right: none;
        border-bottom: 1px solid var(--color-line);
      }
    }
  </style>
</head>
<body>
  <div id="app" class="shell">
    <header id="bar">
      <div class="bar-row">
        <div class="bar-group">
          <span class="brand">
            <svg viewBox="0 0 100 100" width="20" height="20" aria-hidden="true">
              <rect class="m-i" x="10" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="38" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="66" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="10" y="38" width="24" height="24" rx="3"/>
              <rect class="m-s" x="38" y="38" width="24" height="24" rx="3"/>
              <rect class="m-r" x="66" y="38" width="24" height="24" rx="3"/>
              <rect class="m-i" x="10" y="66" width="24" height="24" rx="3"/>
              <rect class="m-r" x="38" y="66" width="24" height="24" rx="3"/>
              <rect class="m-r" x="66" y="66" width="24" height="24" rx="3"/>
            </svg>
            <span class="brand-word">blyte</span>
            <span class="brand-sub">mock</span>
          </span>
          <span id="clock-display" class="clock-readout nums">loading runs</span>
          <button type="button" id="play" class="btn">Play</button>
          <select id="speed" class="ctrl-select" aria-label="Replay speed">
            <option value="60">60x</option>
            <option value="600" selected>600x</option>
            <option value="3600">3600x</option>
          </select>
          <button type="button" id="next" class="btn">Next arrival</button>
        </div>

        <div class="bar-group">
          <div id="wip" class="metric nums"><span class="metric-label">wip</span><span class="metric-val">0 / 3</span></div>
          <div id="waiting" class="metric nums"><span class="metric-label">waiting</span><span class="metric-val">0 / 7</span></div>

    <div class="workspace">

            <button type="button" class="mode-btn" data-map-tab="system" role="tab" aria-selected="false">System</button>
            <button type="button" class="mode-btn" data-map-tab="data" role="tab" aria-selected="false">Data</button>

  <div id="guide-panel" role="dialog" aria-modal="false" aria-labelledby="guide-title" hidden>
    <div class="guide-head">
      <span id="guide-count" class="guide-count nums"></span>
      <button type="button" id="guide-close" class="btn btn-ghost" aria-label="Close guide">×</button>

  <script>
    const WIP_CAP = 3;
    const QUEUE_BOUND = 7;
    const LOG_STORAGE_KEY = "blyte-mock-log";
    const GUIDE_SEEN_KEY = "blyte-mock-guide-seen";
    const NO_FILES_GROUP = "no files changed";
    const FIXED_REPLY = "(mock) the orchestrator would answer here";
    const GUIDE_STEPS = [
      {
        id: "replay",
        target: "#bar",
        tab: null,
        title: "The replay",
        text: "This is a week of your real blyte runs, played back. Play, change the speed, or jump to the next event. Nothing here changes a repository."
      },
      {
        id: "conversation",
        target: "#conversation",
        tab: null,
        title: "The conversation",
        text: "Where you talk with the orchestrator. Results do not interrupt you here: they wait in the queue until you reach a stopping point."
      },
      {
        id: "queue",
        target: "#queue",
        tab: null,
        title: "The review queue",
        text: "Finished work, grouped by the part of the system it touches. Clean results fold into one line. Only exceptions ask for your attention."
      },
      {
        id: "offer",
        target: "#offer",
        tab: null,
        title: "Now or later",
        text: "When a result arrives while you are mid-thought, blyte offers it once. Take it now or leave it; it stays in the queue."
      },
      {
        id: "runs",
        target: "#map",
        tab: "runs",
        title: "Runs by area",
        text: "Each box is an area of the code with work in progress or waiting. Click one to focus the queue on it."
      },
      {
        id: "system",
        target: "#map-system",
        tab: "system",
        title: "The system map",
        text: "Crates or packages, and the dependencies between them, read from the code. Open one to see its modules. Lit boxes are being changed right now."
      },
      {
        id: "data",
        target: "#map-data",
        tab: "data",
        title: "The data map",
        text: "The data structures the code defines, with their fields and the modules that name them."
      },
      {
        id: "limits",
        target: "#wip",
        tab: null,
        title: "Load limits",
        text: "How much is in progress and how much is waiting for you. Past the limit blyte warns you; it never blocks you."
      },
      {
        id: "checkin",
        target: "#checkin",
        tab: null,
        title: "Check-ins",
        text: "At a natural boundary blyte asks two short questions about how you are doing. Skip them whenever you like."
      },
      {
        id: "record",
        target: "#save",
        tab: null,
        title: "Your record",
        text: "What you do in this mock is recorded in your browser only. Save it to tell us what worked."
      }
    ];

    let replayData = null;
    let allGroups = [];
    let windowStart = 0;
    let windowEnd = 1;
    let replayTime = 0;
    let playing = false;
    let speed = 600;
    let lastTickRealMs = null;
    let playRafId = null;

    let mode = "design";
    let checkinOpen = false;
    let checkinFocus = null;
    let checkinTiredness = null;
    let pauseTimerId = null;
    let pauseRemaining = 0;
    let pauseElapsed = 0;
    let pendingScrollGroup = null;

    let focusedGroup = null;
    let activeOffer = null;
    const dismissedOffers = new Set();

    const decisions = new Map();
    const firstShownAt = new Map();
    const openDetails = new Set();
    const pendingNoteAction = new Map();
    const noteDrafts = new Map();
    const noteErrors = new Map();

    const designMessages = [];
    const groupThreads = new Map();
    const groupInputDrafts = new Map();
    let msgSeq = 0;

    let skippedOpen = false;
    let lastQueueSig = "";
    let lastDesignSig = "";
    let lastMapSig = "";

    let mapTab = "runs";
    let mapWide = false;
    let repoList = [];
    let selectedRepo = null;
    const mapCache = new Map();
    let openMapGroup = null;
    let selectedMapUnit = null;
    let hoveredMapUnit = null;
    let selectedMapStructure = null;
    let showAllStructures = false;
    let mapNotesOpen = false;
    let lastSystemSig = "";
    let lastDataSig = "";
    let lastMetaSig = "";
    let renderedSysEdges = [];

    let guideOpen = false;
    let guideStepIndex = 0;
    let guideWasPlaying = false;
    let guideTargetEl = null;

    const sessionOpenedMs = Date.now();
    let logEntries = loadLog();

    function loadLog() {
      try {
        const raw = localStorage.getItem(LOG_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function persistLog(entries) {
      try {
        localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(entries));
      } catch (_) {}
    }

    function appendLog(entry) {
      const full = Object.assign({}, entry, {
        real_time: new Date().toISOString(),
        replay_time: Math.floor(replayTime)
      });
      logEntries.push(full);
      persistLog(logEntries);
      updateLogCount();
    }

    function updateLogCount() {
      const el = document.getElementById("log-count");
      if (el) el.textContent = String(logEntries.length);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isPlainObject(v) {
      return v !== null && typeof v === "object" && !Array.isArray(v);
    }

    function hasOwn(obj, key) {
      return Object.prototype.hasOwnProperty.call(obj, key);
    }

    function validateContract(data) {
      if (!isPlainObject(data)) {
        return "Invalid /api/replay contract: root payload must be a JSON object.";
      }
      if (typeof data.exported_at !== "number" || !Number.isFinite(data.exported_at)) {
        return "Invalid /api/replay contract: missing or non-numeric exported_at.";
      }
      if (typeof data.window_days !== "number" || !Number.isFinite(data.window_days)) {
        return "Invalid /api/replay contract: missing or non-numeric window_days.";
      }
      if (!Array.isArray(data.skipped)) {
        return "Invalid /api/replay contract: skipped must be an array.";
      }
      for (let i = 0; i < data.skipped.length; i++) {
        const s = data.skipped[i];
        if (!isPlainObject(s) || typeof s.key !== "string" || typeof s.reason !== "string") {
          return "Invalid /api/replay contract: skipped[" + i + "] must have string key and reason.";
        }
      }
      if (!Array.isArray(data.runs)) {
        return "Invalid /api/replay contract: runs must be an array.";
      }
      const requiredStrings = ["key", "id", "repo", "title", "task", "outcome"];
      const requiredBooleans = ["research", "checks_recorded"];
      const requiredNumbers = ["started_at", "finished_at", "turns"];
      const nullableStrings = ["plan_file", "plan_task", "final_message", "group", "verdict", "verdict_notes"];
      const nullableNumbers = ["cost_usd", "verdict_ts"];

      for (let i = 0; i < data.runs.length; i++) {
        const r = data.runs[i];
        if (!isPlainObject(r)) {
          return "Invalid /api/replay contract: runs[" + i + "] must be an object.";
        }
        for (const f of requiredStrings) {
          if (typeof r[f] !== "string") {
            return "Invalid /api/replay contract: runs[" + i + "]." + f + " must be a string.";
          }
        }
        for (const f of requiredBooleans) {
          if (typeof r[f] !== "boolean") {
            return "Invalid /api/replay contract: runs[" + i + "]." + f + " must be a boolean.";
          }
        }
        for (const f of requiredNumbers) {
          if (typeof r[f] !== "number" || !Number.isFinite(r[f])) {
            return "Invalid /api/replay contract: runs[" + i + "]." + f + " must be a number.";
          }
        }
        for (const f of nullableStrings) {
          if (!hasOwn(r, f) || (r[f] !== null && typeof r[f] !== "string")) {
            return "Invalid /api/replay contract: runs[" + i + "]." + f + " must be a string or null.";
          }
        }
        for (const f of nullableNumbers) {
          if (!hasOwn(r, f) || (r[f] !== null && (typeof r[f] !== "number" || !Number.isFinite(r[f])))) {
            return "Invalid /api/replay contract: runs[" + i + "]." + f + " must be a number or null.";
          }
        }
        if (r.card !== "clean" && r.card !== "exception") {
          return "Invalid /api/replay contract: runs[" + i + "].card must be \"clean\" or \"exception\".";
        }
        if (!Array.isArray(r.flags) || !r.flags.every(x => typeof x === "string")) {
          return "Invalid /api/replay contract: runs[" + i + "].flags must be an array of strings.";
        }
        if (!Array.isArray(r.changed_files) || !r.changed_files.every(x => typeof x === "string")) {
          return "Invalid /api/replay contract: runs[" + i + "].changed_files must be an array of strings.";
        }
        if (!Array.isArray(r.commits)) {
          return "Invalid /api/replay contract: runs[" + i + "].commits must be an array.";
        }
        for (let j = 0; j < r.commits.length; j++) {
          const c = r.commits[j];
          if (!isPlainObject(c) || typeof c.sha !== "string" || typeof c.subject !== "string") {
            return "Invalid /api/replay contract: runs[" + i + "].commits[" + j + "] must have string sha and subject.";
          }
        }
      }
      return null;
    }

    function showFatalError(msg) {
      document.body.innerHTML = "";
      const box = document.createElement("main");
      box.className = "fatal-error";
      box.textContent = msg;
      document.body.appendChild(box);
    }

    function runGroupName(run) {
      return run.group === null ? NO_FILES_GROUP : run.group;
    }

    function isInProgress(run, t) {
      return run.started_at <= t && t < run.finished_at;
    }

    function isArrived(run, t) {
      return run.finished_at <= t;
    }

    function isResolved(runKey) {
      const dec = decisions.get(runKey);
      return Boolean(dec && dec.action !== "hold");
    }

    function isHeld(runKey) {
      const dec = decisions.get(runKey);
      return Boolean(dec && dec.action === "hold");
    }

    function isUndecidedArrived(run, t) {
      return isArrived(run, t) && !isResolved(run.key);
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatReplayDateTime(epochSec) {
      const d = new Date(epochSec * 1000);
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
        " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
    }

    function formatDuration(sec) {
      const total = Math.max(0, Math.floor(sec));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) {
        return h + ":" + pad2(m) + ":" + pad2(s);
      }
      return pad2(m) + ":" + pad2(s);
    }

    function computeState(t) {
      const runs = replayData.runs;
      const inProgress = [];
      const arrived = [];
      const undecidedArrived = [];
      const waitingGroupSet = new Set();

      for (const r of runs) {
        if (isInProgress(r, t)) {
          inProgress.push(r);
        }
        if (isArrived(r, t)) {
          arrived.push(r);
          if (!isResolved(r.key)) {
            undecidedArrived.push(r);
            waitingGroupSet.add(runGroupName(r));
          }
        }
      }

      return {
        inProgress,
        arrived,
        undecidedArrived,
        waitingGroupsCount: waitingGroupSet.size
      };
    }

    function updateClockBar(state) {
      const clockDisplay = document.getElementById("clock-display");
      clockDisplay.textContent = formatReplayDateTime(replayTime);

      const slider = document.getElementById("clock");
      slider.value = String(Math.floor(replayTime));

      const playBtn = document.getElementById("play");
      playBtn.textContent = playing ? "Pause" : "Play";

      const nextBtn = document.getElementById("next");
      const hasNext = replayData.runs.some(r => r.finished_at > replayTime);
      nextBtn.disabled = !hasNext;

      const wipEl = document.getElementById("wip");
      wipEl.querySelector(".metric-val").textContent = state.inProgress.length + " / " + WIP_CAP;
      wipEl.classList.toggle("over-limit", state.inProgress.length > WIP_CAP);

      const waitEl = document.getElementById("waiting");
      waitEl.querySelector(".metric-val").textContent = state.waitingGroupsCount + " / " + QUEUE_BOUND;
      waitEl.classList.toggle("over-limit", state.waitingGroupsCount > QUEUE_BOUND);

      const skippedEl = document.getElementById("skipped");
      skippedEl.querySelector(".metric-val").textContent = String(replayData.skipped.length);

      const reviewTab = document.getElementById("mode-review");
      reviewTab.textContent = "Review (" + state.undecidedArrived.length + ")";
    }

    function renderSkippedPanel() {
      const panel = document.getElementById("skipped-panel");
      if (!skippedOpen) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      if (replayData.skipped.length === 0) {
        panel.innerHTML = '<h3>Skipped runs</h3><div class="mono" style="color: var(--color-muted);">None skipped.</div>';
        return;
      }
      const items = replayData.skipped.map(s =>
        '<li><span>' + escapeHtml(s.key) + '</span><span style="color: var(--color-muted);">' + escapeHtml(s.reason) + '</span></li>'
      ).join("");
      panel.innerHTML = '<h3>Skipped runs (' + replayData.skipped.length + ')</h3><ul class="skipped-list">' + items + '</ul>';
    }

    function updateFocusIndicator() {
      const holder = document.getElementById("focus-indicator");
      if (focusedGroup === null) {
        holder.innerHTML = "";
      } else {
        holder.innerHTML = '<span class="focus-chip">focus: ' + escapeHtml(focusedGroup) +
          ' <button type="button" data-clear-focus="1" aria-label="Clear focus">×</button></span>';
      }

      const aboutEl = document.getElementById("composer-about");
      const inputEl = document.getElementById("conversation-input");
      if (focusedGroup === null) {
        aboutEl.hidden = true;
        aboutEl.textContent = "";
        inputEl.placeholder = "Message the orchestrator...";
      } else {
        aboutEl.hidden = false;
        aboutEl.textContent = "about " + focusedGroup;
        inputEl.placeholder = "about " + focusedGroup;
      }
    }

    function renderOffer() {
      const offerEl = document.getElementById("offer");
      if (mode !== "design" || !activeOffer) {
        offerEl.hidden = true;
        offerEl.innerHTML = "";
        return;
      }
      const run = replayData.runs.find(r => r.key === activeOffer.key);
      if (!run || !isArrived(run, replayTime) || isResolved(run.key) || focusedGroup !== activeOffer.group) {
        activeOffer = null;
        offerEl.hidden = true;
        offerEl.innerHTML = "";
        return;
      }
      offerEl.hidden = false;
      offerEl.innerHTML =
        '<span class="offer-text">' + escapeHtml(run.id + " touches " + activeOffer.group + " and needs a decision") + '</span>' +
        '<div class="offer-actions">' +
          '<button type="button" class="btn btn-primary" data-offer-choice="now">Now</button>' +
          '<button type="button" class="btn btn-ghost" data-offer-choice="later">Later</button>' +
        '</div>';
    }

    function renderConversation(force) {
      const dispatched = replayData.runs.filter(r => r.started_at <= replayTime);
      const sig = dispatched.length + "|" + designMessages.length;
      if (!force && sig === lastDesignSig) return;
      lastDesignSig = sig;

      const threadEl = document.getElementById("conversation-thread");
      const atBottom = threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 40;

      const entries = [];
      for (const r of dispatched) {
        entries.push({
          sortTime: r.started_at,
          seq: -1,
          kind: "dispatch",
          text: "dispatched " + r.id + ": " + r.title,
          meta: formatReplayDateTime(r.started_at)
        });
      }
      for (const m of designMessages) {
        entries.push({
          sortTime: m.replayTime,
          seq: m.seq,
          kind: m.role,
          text: m.text,
          meta: m.meta
        });
      }
      entries.sort((a, b) => {
        if (a.sortTime !== b.sortTime) return a.sortTime - b.sortTime;
        return a.seq - b.seq;
      });

      if (entries.length === 0) {
        threadEl.innerHTML = '<div class="thread-empty">No runs dispatched at this replay time yet.</div>';
        return;
      }

      threadEl.innerHTML = entries.map(e => {
        if (e.kind === "dispatch") {
          return '<div class="msg-line dispatch">' + escapeHtml(e.meta) + " · " + escapeHtml(e.text) + '</div>';
        }
        return '<div class="msg-line ' + e.kind + '">' +
          '<div class="msg-meta">' + escapeHtml(e.meta) + '</div>' +
          '<div>' + escapeHtml(e.text) + '</div>' +
          '</div>';
      }).join("");

      if (atBottom) {
        threadEl.scrollTop = threadEl.scrollHeight;
      }
    }

    function renderDetailsHtml(run) {
      if (!openDetails.has(run.key)) return "";
      const finalMsg = run.final_message !== null ? run.final_message : "(not recorded)";
      const filesHtml = run.changed_files.length > 0
        ? '<ul class="details-list">' + run.changed_files.map(f => '<li>' + escapeHtml(f) + '</li>').join("") + '</ul>'
        : '<div class="mono" style="color: var(--color-muted);">None</div>';
      const commitsHtml = run.commits.length > 0
        ? '<ul class="details-list">' + run.commits.map(c => '<li><strong>' + escapeHtml(c.sha.slice(0, 7)) + '</strong> ' + escapeHtml(c.subject) + '</li>').join("") + '</ul>'
        : '<div class="mono" style="color: var(--color-muted);">None</div>';
      const extraFlagsHtml = run.checks_recorded && run.flags.length > 3
        ? '<div><div class="details-label">all flags (' + run.flags.length + ')</div><ul class="details-list">' +
          run.flags.map(fl => '<li>' + escapeHtml(fl) + '</li>').join("") + '</ul></div>'
        : "";
      return '<div class="details-box">' +
        '<div><div class="details-label">final_message</div><pre class="details-pre">' + escapeHtml(finalMsg) + '</pre></div>' +
        '<div><div class="details-label">task</div><pre class="details-pre">' + escapeHtml(run.task) + '</pre></div>' +
        extraFlagsHtml +
        '<div><div class="details-label">changed_files</div>' + filesHtml + '</div>' +
        '<div><div class="details-label">commits</div>' + commitsHtml + '</div>' +
