        document.getElementById("map-data").hidden = mapTab !== "data";
      }

      const wideBtn = document.getElementById("map-wide");
      wideBtn.classList.toggle("active", mapWide);
      wideBtn.setAttribute("aria-pressed", mapWide ? "true" : "false");
      wideBtn.textContent = mapWide ? "Narrow" : "Wide";
      const ws = document.querySelector(".workspace");
      if (ws) ws.classList.toggle("map-wide", readerOpen || mapWide);
    }

    function renderMapMeta(mapData, overlay, force) {
      const barEl = document.getElementById("map-meta-bar");
      const outsideEl = document.getElementById("map-outside");
      const notesEl = document.getElementById("map-notes");

      if (mapTab === "runs" || !mapData) {
        barEl.hidden = true;
        outsideEl.hidden = true;
        notesEl.hidden = true;
        lastMetaSig = "";
        return;
      }

      const unparsedCount = mapData.unparsed.length;
      const unresolvedCount = mapData.unresolved.length;
      const sig = [overlay.outsideCount, unparsedCount, unresolvedCount, mapNotesOpen ? "1" : "0"].join("|");
      if (!force && sig === lastMetaSig) return;
      lastMetaSig = sig;

      if (overlay.outsideCount > 0) {
        outsideEl.hidden = false;
        outsideEl.textContent = overlay.outsideCount + " files outside the code";
      } else {
        outsideEl.hidden = true;
        outsideEl.textContent = "";
      }

      if (unparsedCount > 0 || unresolvedCount > 0) {
        notesEl.hidden = false;
        const parts = [];
        if (unparsedCount > 0) parts.push(unparsedCount + " files not parsed");
        if (unresolvedCount > 0) parts.push(unresolvedCount + " references not resolved");
        let listHtml = "";
        if (mapNotesOpen) {
          let sections = "";
          if (unparsedCount > 0) {
            sections += '<div><div class="map-notes-section-title">files not parsed</div><ul class="map-notes-items">' +
              mapData.unparsed.map(u =>
                '<li><span>' + escapeHtml(u.file) + '</span> <span class="map-notes-reason">— ' + escapeHtml(u.reason) + '</span></li>'
              ).join("") + '</ul></div>';
          }
          if (unresolvedCount > 0) {
            sections += '<div><div class="map-notes-section-title">references not resolved</div><ul class="map-notes-items">' +
              mapData.unresolved.map(u =>
                '<li><span>' + escapeHtml(u.file) + ':' + escapeHtml(u.line) + '</span> <span class="map-notes-reason">— ' + escapeHtml(u.reference) + '</span></li>'
              ).join("") + '</ul></div>';
          }
          listHtml = '<div class="map-notes-list">' + sections + '</div>';
        }
        notesEl.innerHTML =
          '<button type="button" class="map-notes-toggle nums" data-toggle-notes="1" aria-expanded="' + (mapNotesOpen ? "true" : "false") + '">' +
            escapeHtml(parts.join(" · ")) +
          '</button>' + listHtml;
      } else {
        notesEl.hidden = true;
        notesEl.innerHTML = "";
      }

      barEl.hidden = outsideEl.hidden && notesEl.hidden;
    }

    function renderMapDetail(mapData) {
      const detailEl = document.getElementById("map-detail");
      if (mapTab === "runs" || !mapData) {
        detailEl.hidden = true;
        detailEl.innerHTML = "";
        return;
      }

      if (mapTab === "system") {
        const activeUnit = hoveredMapUnit || selectedMapUnit;
        if (!activeUnit) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const unit = mapData.units.find(u => u.id === activeUnit);
        if (!unit) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const dependsOn = mapData.edges
          .filter(e => e.level === "unit" && e.from === activeUnit)
          .map(e => e.to);
        const dependedBy = mapData.edges
          .filter(e => e.level === "unit" && e.to === activeUnit)
          .map(e => e.from);
        const definedStructs = mapData.structures.filter(s => s.unit === activeUnit);

        const depsHtml = dependsOn.length > 0
          ? '<ul class="map-detail-list">' + dependsOn.map(id => '<li>' + escapeHtml(id) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const revDepsHtml = dependedBy.length > 0
          ? '<ul class="map-detail-list">' + dependedBy.map(id => '<li>' + escapeHtml(id) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const structsHtml = definedStructs.length > 0
          ? '<ul class="map-detail-list">' + definedStructs.map(s =>
              '<li>' + escapeHtml(s.name) + ' <span class="map-detail-type">(' + escapeHtml(s.kind) + ')</span></li>'
            ).join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';

        detailEl.hidden = false;
        detailEl.innerHTML =
          '<div class="map-detail-head">' +
            '<div>' +
              '<div class="map-detail-id">' + escapeHtml(unit.id) + '</div>' +
              '<div class="map-detail-file">' + escapeHtml(unit.file) + '</div>' +
            '</div>' +
            '<button type="button" class="btn btn-ghost" data-close-detail="1" aria-label="Close detail">×</button>' +
          '</div>' +
          '<div class="map-detail-section"><div class="details-label">depends on (' + dependsOn.length + ')</div>' + depsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">depended on by (' + dependedBy.length + ')</div>' + revDepsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">structures (' + definedStructs.length + ')</div>' + structsHtml + '</div>';
        return;
      }

      if (mapTab === "data") {
        if (!selectedMapStructure) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const s = mapData.structures.find(x => x.id === selectedMapStructure);
        if (!s) {
          detailEl.hidden = true;
          detailEl.innerHTML = "";
          return;
        }
        const fieldsHtml = s.fields.length > 0
          ? '<ul class="map-detail-list">' + s.fields.map(f =>
              '<li>' + escapeHtml(f.name) + (f.type ? ': <span class="map-detail-type">' + escapeHtml(f.type) + '</span>' : "") + '</li>'
            ).join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';
        const refsHtml = s.referenced_by.length > 0
          ? '<ul class="map-detail-list">' + s.referenced_by.map(u => '<li>' + escapeHtml(u) + '</li>').join("") + '</ul>'
          : '<div class="map-detail-empty">None</div>';

        detailEl.hidden = false;
        detailEl.innerHTML =
          '<div class="map-detail-head">' +
            '<div>' +
              '<div class="map-detail-id">' + escapeHtml(s.id) + '</div>' +
              '<div class="map-detail-file">' + escapeHtml(s.file + ":" + s.line) + ' · ' + escapeHtml(s.kind) + '</div>' +
            '</div>' +
            '<button type="button" class="btn btn-ghost" data-close-detail="1" aria-label="Close detail">×</button>' +
          '</div>' +
          '<div class="map-detail-section"><div class="details-label">fields (' + s.fields.length + ')</div>' + fieldsHtml + '</div>' +
          '<div class="map-detail-section"><div class="details-label">referenced_by (' + s.referenced_by.length + ')</div>' + refsHtml + '</div>';
      }
    }

    function applySystemHighlight() {
      const entry = mapState;
      const mapData = entry && entry.status === "ok" ? entry.data : null;
      const sysEl = document.getElementById("map-system");
      const activeUnit = hoveredMapUnit || selectedMapUnit;

      const connectedNodes = new Set();
      if (activeUnit) {
        connectedNodes.add("unit:" + activeUnit);
      }

      const paths = sysEl.querySelectorAll(".sys-edge");
      paths.forEach(p => {
        const idx = Number(p.dataset.edgeIdx);
        const edgeMeta = renderedSysEdges[idx];
        if (!activeUnit || !edgeMeta) {
          p.classList.remove("edge-strong", "edge-dim");
          p.setAttribute("marker-end", "url(#sys-arrow-faint)");
          return;
        }
        if (edgeMeta.units.has(activeUnit)) {
          p.classList.add("edge-strong");
          p.classList.remove("edge-dim");
          p.setAttribute("marker-end", "url(#sys-arrow-strong)");
          connectedNodes.add(edgeMeta.fromNode);
          connectedNodes.add(edgeMeta.toNode);
        } else {
          p.classList.add("edge-dim");
          p.classList.remove("edge-strong");
          p.setAttribute("marker-end", "url(#sys-arrow-faint)");
        }
      });

      const nodeEls = sysEl.querySelectorAll("[data-node-id]");
      nodeEls.forEach(el => {
        const nid = el.dataset.nodeId;
        if (!activeUnit) {
          el.classList.remove("node-active", "node-related", "node-dim");
          return;
        }
        el.classList.toggle("node-active", nid === "unit:" + activeUnit);
        el.classList.toggle("node-related", nid !== "unit:" + activeUnit && connectedNodes.has(nid));
        el.classList.toggle("node-dim", !connectedNodes.has(nid));
      });

      renderMapDetail(mapData);
    }

    function buildEdgePath(a, b) {
      const ax = a.x + a.w / 2;
      const ay = a.y + a.h / 2;
      const bx = b.x + b.w / 2;
      const by = b.y + b.h / 2;
      const dx = bx - ax;
      const dy = by - ay;

      if (Math.abs(dx) >= Math.abs(dy)) {
        const x1 = dx < 0 ? a.x : a.x + a.w;
        const y1 = ay;
        const x2 = dx < 0 ? b.x + b.w : b.x;
        const y2 = by;
        const span = Math.max(24, Math.abs(x2 - x1) * 0.45);
        const cx1 = dx < 0 ? x1 - span : x1 + span;
        const cx2 = dx < 0 ? x2 + span : x2 - span;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " C " + cx1.toFixed(1) + " " + y1.toFixed(1) + ", " +
          cx2.toFixed(1) + " " + y2.toFixed(1) + ", " +
          x2.toFixed(1) + " " + y2.toFixed(1);
      }

      if (Math.abs(dx) < 20) {
        const x1 = a.x + a.w;
        const y1 = ay;
        const x2 = b.x + b.w;
        const y2 = by;
        const bow = Math.min(34, 14 + Math.abs(dy) * 0.08);
        const cx = Math.max(x1, x2) + bow;
        return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
          " C " + cx.toFixed(1) + " " + y1.toFixed(1) + ", " +
          cx.toFixed(1) + " " + y2.toFixed(1) + ", " +
          x2.toFixed(1) + " " + y2.toFixed(1);
      }

      const x1 = ax;
      const y1 = dy < 0 ? a.y : a.y + a.h;
      const x2 = bx;
      const y2 = dy < 0 ? b.y + b.h : b.y;
      const span = Math.max(20, Math.abs(y2 - y1) * 0.45);
      const cy1 = dy < 0 ? y1 - span : y1 + span;
      const cy2 = dy < 0 ? y2 + span : y2 - span;
      return "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
        " C " + x1.toFixed(1) + " " + cy1.toFixed(1) + ", " +
        x2.toFixed(1) + " " + cy2.toFixed(1) + ", " +
        x2.toFixed(1) + " " + y2.toFixed(1);
    }

    function drawSystemEdges(mapData) {
      const sysEl = document.getElementById("map-system");
      const canvas = sysEl.querySelector(".sys-canvas");
      const svg = sysEl.querySelector(".sys-svg");
      if (!canvas || !svg || !mapData) return;

      const canvasRect = canvas.getBoundingClientRect();
      const width = Math.max(1, canvas.scrollWidth);
      const height = Math.max(1, canvas.scrollHeight);
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);

      const rects = new Map();
      canvas.querySelectorAll("[data-node-id]").forEach(el => {
        const r = el.getBoundingClientRect();
        rects.set(el.dataset.nodeId, {
          x: r.left - canvasRect.left,
          y: r.top - canvasRect.top,
          w: r.width,
          h: r.height
        });
      });

      const edgeMap = new Map();
      function addEdge(fromNode, toNode, unitIds) {
        if (!rects.has(fromNode) || !rects.has(toNode) || fromNode === toNode) return;
        const key = fromNode + "->" + toNode;
        if (!edgeMap.has(key)) {
          edgeMap.set(key, { fromNode, toNode, units: new Set() });
        }
        const item = edgeMap.get(key);
        for (const u of unitIds) {
          item.units.add(u);
        }
      }

      if (openMapGroup === null) {
        for (const e of mapData.edges) {
          if (e.level === "group") {
            addEdge("group:" + e.from, "group:" + e.to, []);
          }
        }
      } else {
        const unitToGroup = new Map();
        for (const u of mapData.units) {
          unitToGroup.set(u.id, u.group);
        }
        for (const e of mapData.edges) {
          if (e.level === "group" && e.from !== openMapGroup && e.to !== openMapGroup) {
            addEdge("group:" + e.from, "group:" + e.to, []);
          } else if (e.level === "unit") {
            const fg = unitToGroup.get(e.from);
            const tg = unitToGroup.get(e.to);
            if (fg === openMapGroup && tg === openMapGroup) {
              addEdge("unit:" + e.from, "unit:" + e.to, [e.from, e.to]);
            } else if (fg === openMapGroup && tg && tg !== openMapGroup) {
              addEdge("unit:" + e.from, "group:" + tg, [e.from]);
            } else if (tg === openMapGroup && fg && fg !== openMapGroup) {
              addEdge("group:" + fg, "unit:" + e.to, [e.to]);
            }
          }
        }
      }

      renderedSysEdges = Array.from(edgeMap.values());
      const defs =
        '<defs>' +
          '<marker id="sys-arrow-faint" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 1 L 7 4 L 0 7 z" class="sys-arrow-faint"></path>' +
          '</marker>' +
          '<marker id="sys-arrow-strong" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
            '<path d="M 0 1 L 7 4 L 0 7 z" class="sys-arrow-strong"></path>' +
          '</marker>' +
        '</defs>';

      const pathsHtml = renderedSysEdges.map((edge, idx) => {
        const d = buildEdgePath(rects.get(edge.fromNode), rects.get(edge.toNode));
        return '<path class="sys-edge" data-edge-idx="' + idx + '" d="' + d + '" marker-end="url(#sys-arrow-faint)"></path>';
      }).join("");

      svg.innerHTML = defs + pathsHtml;
      applySystemHighlight();
    }

    function renderSystemTab(state, force) {
      if (mapTab !== "system") return;
      const sysEl = document.getElementById("map-system");

      const entry = mapState;
      if (!entry) {
        ensureMapLoaded();
        return;
      }
      if (entry.status === "loading") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        sysEl.innerHTML = '<div class="map-loading">reading the code</div>';
        lastSystemSig = "loading";
        return;
      }
      if (entry.status === "error") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        sysEl.innerHTML = '<div class="map-error">' + escapeHtml(entry.error) + '</div>';
        lastSystemSig = "error:" + entry.error;
        return;
      }

      const mapData = entry.data;
      const overlay = computeOverlay(mapData, state);
      renderMapMeta(mapData, overlay, force);

      const sig = [openMapGroup || "", focusedGroup || "", overlay.sig].join("||");
      if (!force && sig === lastSystemSig) {
        renderMapDetail(mapData);
        return;
      }
      lastSystemSig = sig;

      if (mapData.groups.length === 0) {
        sysEl.innerHTML = '<div class="map-loading">No groups found.</div>';
        renderMapDetail(mapData);
        return;
      }

      const unitsByGroup = new Map();
      for (const g of mapData.groups) {
        unitsByGroup.set(g.id, []);
      }
      for (const u of mapData.units) {
        if (!unitsByGroup.has(u.group)) unitsByGroup.set(u.group, []);
        unitsByGroup.get(u.group).push(u);
      }

      const groupById = new Map();
      for (const g of mapData.groups) {
        groupById.set(g.id, g);
      }
      const groupEdges = mapData.edges.filter(e => e.level === "group");
      const groupCols = computeDependencyColumns(mapData.groups.map(g => g.id), groupEdges);
      const unitById = new Map();
      for (const u of mapData.units) {
        unitById.set(u.id, u);
      }

      function renderGroupHtml(g) {
        const gUnits = unitsByGroup.get(g.id) || [];
        const isOpen = openMapGroup === g.id;
        const isFocused = focusedGroup !== null && focusedGroup === g.path && allGroups.includes(g.path);
        const gRun = (overlay.groupRunning.get(g.id) || { size: 0 }).size;
        const gWait = (overlay.groupWaiting.get(g.id) || { size: 0 }).size;

        const classes = ["sys-group", isOpen ? "open" : "collapsed"];
        if (isFocused) classes.push("focused");
        if (gRun > 0) classes.push("has-running");
        if (gWait > 0) classes.push("has-waiting");

        const statsParts = [
          '<span>' + gUnits.length + (gUnits.length === 1 ? " unit" : " units") + '</span>'
        ];
        if (gRun > 0) {
          statsParts.push('<span class="map-stat-running">' + gRun + ' in progress</span>');
        }
        if (gWait > 0) {
          statsParts.push('<span class="map-stat-waiting">' + gWait + ' waiting</span>');
        }

        let bodyHtml = "";
        if (isOpen) {
          if (gUnits.length === 0) {
            bodyHtml = '<div class="sys-empty-units">No units in this group.</div>';
          } else {
            const groupUnitIds = gUnits.map(u => u.id);
            const groupUnitSet = new Set(groupUnitIds);
            const internalEdges = mapData.edges.filter(
              e => e.level === "unit" && groupUnitSet.has(e.from) && groupUnitSet.has(e.to)
            );
            const unitCols = computeDependencyColumns(groupUnitIds, internalEdges);
            bodyHtml = '<div class="sys-units-cols">' + unitCols.map(col =>
              '<div class="sys-unit-col">' + col.map(uid => {
                const u = unitById.get(uid);
                const uRun = (overlay.unitRunning.get(uid) || { size: 0 }).size;
                const uWait = (overlay.unitWaiting.get(uid) || { size: 0 }).size;
                const uClasses = ["sys-unit"];
                if (uRun > 0) uClasses.push("has-running");
                if (uWait > 0) uClasses.push("has-waiting");
                let uOverlayHtml = "";
                if (uRun > 0 || uWait > 0) {
                  uOverlayHtml = '<span class="sys-unit-overlay nums">' +
                    (uRun > 0 ? '<span class="map-stat-running">' + uRun + ' in progress</span>' : "") +
                    (uWait > 0 ? '<span class="map-stat-waiting">' + uWait + ' waiting</span>' : "") +
                  '</span>';
                }
                return '<button type="button" class="' + uClasses.join(" ") + '" data-unit-id="' + escapeHtml(u.id) + '" data-node-id="unit:' + escapeHtml(u.id) + '" title="' + escapeHtml(u.id) + '">' +
                  '<span class="sys-unit-label">' + escapeHtml(unitShortName(u.id)) + '</span>' +
                  uOverlayHtml +
                '</button>';
              }).join("") + '</div>'
            ).join("") + '</div>';
          }
        }

        const nodeAttr = isOpen ? "" : ' data-node-id="group:' + escapeHtml(g.id) + '"';
        return '<div class="' + classes.join(" ") + '"' + nodeAttr + '>' +
          '<button type="button" class="sys-group-head" data-sys-group="' + escapeHtml(g.id) + '" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="sys-group-top">' +
              '<span class="sys-group-id">' + escapeHtml(g.id).replace(/\./g, ".<wbr>") + '</span>' +
              '<span class="sys-group-kind">' + escapeHtml(g.kind) + '</span>' +
            '</span>' +
            '<span class="sys-group-meta nums">' + statsParts.join("") + '</span>' +
          '</button>' +
          bodyHtml +
        '</div>';
      }

      let groupsMarkup = "";
      if (groupCols.length > 1) {
        groupsMarkup = '<div class="sys-groups-cols">' + groupCols.map(col =>
          '<div class="sys-group-col">' + col.map(gid => renderGroupHtml(groupById.get(gid))).join("") + '</div>'
        ).join("") + '</div>';
      } else {
        groupsMarkup = '<div class="sys-groups-grid">' + mapData.groups.map(renderGroupHtml).join("") + '</div>';
      }

      sysEl.innerHTML =
        '<div class="sys-canvas">' +
          '<svg class="sys-svg" aria-hidden="true"></svg>' +
          groupsMarkup +
        '</div>';

      drawSystemEdges(mapData);
      requestAnimationFrame(() => drawSystemEdges(mapData));
    }

    function renderDataTab(state, force) {
      if (mapTab !== "data") return;
      const headEl = document.getElementById("map-data-head");
      const bodyEl = document.getElementById("map-data-body");

      const entry = mapState;
      if (!entry) {
        ensureMapLoaded();
        return;
      }
      if (entry.status === "loading") {
        headEl.hidden = true;
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        bodyEl.innerHTML = '<div class="map-loading">reading the code</div>';
        lastDataSig = "loading";
        return;
      }
      if (entry.status === "error") {
        headEl.hidden = true;
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        bodyEl.innerHTML = '<div class="map-error">' + escapeHtml(entry.error) + '</div>';
        lastDataSig = "error:" + entry.error;
        return;
      }

      headEl.hidden = false;
      const mapData = entry.data;
      const overlay = computeOverlay(mapData, state);
      renderMapMeta(mapData, overlay, force);
      renderMapDetail(mapData);

      const sig = [showAllStructures ? "1" : "0", selectedMapStructure || "", overlay.sig].join("||");
      if (!force && sig === lastDataSig) return;
      lastDataSig = sig;

      const shown = showAllStructures
        ? mapData.structures
        : mapData.structures.filter(s => s.serialisable);

      if (shown.length === 0) {
        bodyEl.innerHTML = '<div class="map-loading">' +
          (mapData.structures.length > 0 && !showAllStructures
            ? "No serialisable structures in this repository."
            : "No structures in this repository.") +
        '</div>';
        return;
      }

      const byUnit = new Map();
      for (const s of shown) {
        if (!byUnit.has(s.unit)) byUnit.set(s.unit, []);
        byUnit.get(s.unit).push(s);
      }

      const groupsHtml = Array.from(byUnit.entries()).map(([unitId, structs]) => {
        const uRun = (overlay.unitRunning.get(unitId) || { size: 0 }).size;
        const uWait = (overlay.unitWaiting.get(unitId) || { size: 0 }).size;
        const unitStats = [];
        if (uRun > 0) unitStats.push('<span class="map-stat-running">' + uRun + ' in progress</span>');
        if (uWait > 0) unitStats.push('<span class="map-stat-waiting">' + uWait + ' waiting</span>');
        const unitStatsHtml = unitStats.length > 0
          ? '<span class="sys-unit-overlay nums">' + unitStats.join("") + '</span>'
          : "";

        const rowsHtml = structs.map(s => {
          const isSelected = selectedMapStructure === s.id;
          const refCount = s.referenced_by.length;
          return '<button type="button" class="data-struct-row' + (isSelected ? " selected" : "") + '" data-struct-id="' + escapeHtml(s.id) + '">' +
            '<span class="data-struct-main">' +
              '<span class="data-struct-name">' + escapeHtml(s.name) + '</span>' +
              '<span class="data-struct-kind">' + escapeHtml(s.kind) + '</span>' +
            '</span>' +
            '<span class="data-struct-refs nums">' + refCount + (refCount === 1 ? " ref" : " refs") + '</span>' +
          '</button>';
        }).join("");

        return '<section class="data-unit-group">' +
          '<div class="data-unit-head"><span>' + escapeHtml(unitId) + '</span>' + unitStatsHtml + '</div>' +
          '<div class="data-unit-list">' + rowsHtml + '</div>' +
        '</section>';
      }).join("");

      bodyEl.innerHTML = groupsHtml;
    }

    function escapeAttrSelector(val) {
      if (typeof CSS !== "undefined" && typeof CSS.escape === "function") {
        return CSS.escape(val);
      }
      return String(val).replace(/["\\]/g, "\\$&");
    }

    function validateRequestCard(req) {
      const errors = [];
      if (!isPlainObject(req)) {
        return ["invalid request entry: expected object"];
      }
      if (!hasOwn(req, "request") || typeof req.request !== "string" || req.request.length === 0) {
        errors.push("missing or invalid field: request");
      }
      if (!hasOwn(req, "runs") || !Array.isArray(req.runs) || req.runs.some(r => typeof r !== "string")) {
        errors.push("missing or invalid field: runs");
      }
      if (
        !hasOwn(req, "started_by") ||
        (req.started_by !== null && (typeof req.started_by !== "string" || req.started_by.length === 0))
      ) {
        errors.push("missing or invalid field: started_by");
      }
      if (!hasOwn(req, "state") || typeof req.state !== "string" || req.state.length === 0) {
        errors.push("missing or invalid field: state");
        return errors;
      }
      switch (req.state) {
        case "waiting":
          if (
            !hasOwn(req, "waiting_reasons") ||
            !Array.isArray(req.waiting_reasons) ||
            req.waiting_reasons.length === 0 ||
            req.waiting_reasons.some(r => typeof r !== "string")
          ) {
            errors.push("missing or invalid field: waiting_reasons");
          }
          break;
        case "combining":
          break;
        case "combined":
          if (!hasOwn(req, "branch") || typeof req.branch !== "string" || req.branch.length === 0) {
            errors.push("missing or invalid field: branch");
          }
          if (!hasOwn(req, "commits") || !Array.isArray(req.commits)) {
            errors.push("missing or invalid field: commits");
          } else {
            for (const c of req.commits) {
              if (!isPlainObject(c) || typeof c.sha !== "string" || c.sha.length === 0) {
                errors.push("missing or invalid field: commits.sha");
                break;
              }
              if (typeof c.subject !== "string") {
                errors.push("missing or invalid field: commits.subject");
                break;
              }
            }
          }
          if (!hasOwn(req, "pushed") || typeof req.pushed !== "boolean") {
            errors.push("missing or invalid field: pushed");
          }
          if (!hasOwn(req, "pull_request_url") || (req.pull_request_url !== null && typeof req.pull_request_url !== "string")) {
            errors.push("missing or invalid field: pull_request_url");
          }
          if (hasOwn(req, "suggested_title") && req.suggested_title !== null && typeof req.suggested_title !== "string") {
            errors.push("missing or invalid field: suggested_title");
          }
          if (hasOwn(req, "suggested_body") && req.suggested_body !== null && typeof req.suggested_body !== "string") {
            errors.push("missing or invalid field: suggested_body");
          }
          break;
        case "done":
          if (hasOwn(req, "branch") && req.branch !== null && (typeof req.branch !== "string" || req.branch.length === 0)) {
            errors.push("missing or invalid field: branch");
          }
          if (hasOwn(req, "commits")) {
            if (!Array.isArray(req.commits)) {
              errors.push("missing or invalid field: commits");
            } else {
              for (const c of req.commits) {
                if (!isPlainObject(c) || typeof c.sha !== "string" || c.sha.length === 0) {
                  errors.push("missing or invalid field: commits.sha");
                  break;
                }
                if (typeof c.subject !== "string") {
                  errors.push("missing or invalid field: commits.subject");
                  break;
                }
              }
            }
          }
          if (hasOwn(req, "pushed") && typeof req.pushed !== "boolean") {
            errors.push("missing or invalid field: pushed");
          }
          if (hasOwn(req, "pull_request_url") && req.pull_request_url !== null && typeof req.pull_request_url !== "string") {
            errors.push("missing or invalid field: pull_request_url");
          }
          break;
        case "conflict":
          if (!hasOwn(req, "conflicting_run") || typeof req.conflicting_run !== "string" || req.conflicting_run.length === 0) {
            errors.push("missing or invalid field: conflicting_run");
          }
          if (
            !hasOwn(req, "conflicting_files") ||
            !Array.isArray(req.conflicting_files) ||
            req.conflicting_files.length === 0 ||
            req.conflicting_files.some(f => typeof f !== "string")
          ) {
            errors.push("missing or invalid field: conflicting_files");
          }
          break;
        case "check_failed":
          if (!hasOwn(req, "failing_step") || typeof req.failing_step !== "string" || req.failing_step.length === 0) {
            errors.push("missing or invalid field: failing_step");
          }
          if (!hasOwn(req, "output_tail") || typeof req.output_tail !== "string" || req.output_tail.length === 0) {
            errors.push("missing or invalid field: output_tail");
          }
          break;
        case "error":
          if (!hasOwn(req, "error") || typeof req.error !== "string" || req.error.length === 0) {
            errors.push("missing or invalid field: error");
          }
          break;
        default:
          errors.push("unknown state: " + req.state);
          break;
      }
      return errors;
    }

    function renderPullRequestLink(url) {
      if (typeof url === "string" && url.startsWith("https://")) {
        const escaped = escapeHtml(url);
        return '<a class="request-pr-link" href="' + escaped + '" target="_blank" rel="noopener noreferrer">' + escaped + '</a>';
      }
      return '<span class="request-pr-url-text">' + escapeHtml(url) + '</span>';
    }

    function renderRequestCard(req, uiState) {
      const ui = isPlainObject(uiState) ? uiState : {};
      const pushInFlight = Boolean(ui.pushInFlight);
      const prInFlight = Boolean(ui.prInFlight);
      const prFormOpen = Boolean(ui.prFormOpen);
      const prDraft = isPlainObject(ui.prDraft) ? ui.prDraft : null;
      const cardError = typeof ui.cardError === "string" ? ui.cardError : "";

      const validationErrors = validateRequestCard(req);
      const reqId = isPlainObject(req) && typeof req.request === "string" ? req.request : "";
      const stateName = isPlainObject(req) && typeof req.state === "string" ? req.state : "error";
      const validRuns = isPlainObject(req) && Array.isArray(req.runs) && req.runs.every(r => typeof r === "string")
        ? req.runs
        : null;

      let pillClass = "outcome-pill";
      let cardStateClass = "request-state-error";
      let stateLabel = stateName;
      if (stateName === "waiting") {
        pillClass += " request-waiting";
        cardStateClass = "request-state-waiting";
      } else if (stateName === "combining") {
        pillClass += " request-combining";
        cardStateClass = "request-state-combining";
      } else if (stateName === "combined") {
        pillClass += " verified";
        cardStateClass = "request-state-combined";
      } else if (stateName === "done") {
        pillClass += " request-done";
        cardStateClass = "request-state-done";
        stateLabel = "Done";
      } else if (stateName === "conflict" || stateName === "check_failed" || stateName === "error") {
        pillClass += " failed";
        cardStateClass = "request-state-" + stateName;
      }

      const headerHtml = '<div class="request-top">' +
        (reqId ? '<span class="run-id request-id">' + escapeHtml(reqId) + '</span>' : '<span class="run-id request-id">invalid request</span>') +
        '<span class="' + pillClass + '">' + escapeHtml(stateLabel) + '</span>' +
      '</div>';

      const startedByHtml = isPlainObject(req) && typeof req.started_by === "string" && req.started_by.length > 0
        ? '<div class="request-started-by">started by surface ' + escapeHtml(req.started_by) + '</div>'
        : "";

      const runsHtml = validRuns !== null
        ? '<div class="request-runs"><span>runs</span>' +
            validRuns.map(id => '<span class="request-run-id">' + escapeHtml(id) + '</span>').join("") +
          '</div>'
        : "";

      let bodyHtml = "";
      if (validationErrors.length > 0) {
        bodyHtml = '<div class="request-error-box request-validation-error">' + escapeHtml(validationErrors.join("; ")) + '</div>';
      } else if (stateName === "waiting") {
        bodyHtml = '<div class="request-reasons">' +
          req.waiting_reasons.map(r => '<div class="request-reason">' + escapeHtml(r) + '</div>').join("") +
        '</div>';
      } else if (stateName === "combining") {
        bodyHtml = '<div class="request-combining-msg">Combining runs and running checks…</div>';
      } else if (stateName === "combined") {
        const commitsHtml = req.commits.length > 0
          ? '<div class="request-commits">' +
              req.commits.map(c =>
                '<div class="request-commit">' +
                  '<span class="request-sha mono">' + escapeHtml(c.sha.slice(0, 7)) + '</span>' +
                  '<span class="request-subject">' + escapeHtml(c.subject) + '</span>' +
                '</div>'
              ).join("") +
            '</div>'
          : '<div class="request-muted mono">No commits.</div>';

        const pushDisabled = req.pushed || pushInFlight;
        const pushLabel = req.pushed ? "Pushed" : "Push branch";
        const pushBtnHtml = '<button type="button" class="btn btn-primary" data-request-push="' + escapeHtml(reqId) + '"' + (pushDisabled ? ' disabled' : '') + '>' + pushLabel + '</button>';

        const hasPrUrl = typeof req.pull_request_url === "string" && req.pull_request_url.length > 0;
        const prControlHtml = hasPrUrl
          ? renderPullRequestLink(req.pull_request_url)
          : '<button type="button" class="btn" data-request-open-pr="' + escapeHtml(reqId) + '"' + (!req.pushed || prInFlight ? ' disabled' : '') + '>Open pull request</button>';

        let prFormHtml = "";
        if (!hasPrUrl && req.pushed && prFormOpen) {
          const draftTitle = prDraft && typeof prDraft.title === "string"
            ? prDraft.title
            : (typeof req.suggested_title === "string" ? req.suggested_title : "");
          const draftBody = prDraft && typeof prDraft.body === "string"
            ? prDraft.body
            : (typeof req.suggested_body === "string" ? req.suggested_body : "");
          const submitDisabled = draftTitle.trim().length === 0 || prInFlight;
          prFormHtml = '<form class="request-pr-form" data-request-pr-form="' + escapeHtml(reqId) + '">' +
            '<label class="request-pr-label">Title' +
              '<input type="text" class="request-pr-title" data-request-pr-title="' + escapeHtml(reqId) + '" data-preserve-id="pr-title:' + escapeHtml(reqId) + '" value="' + escapeHtml(draftTitle) + '" placeholder="Pull request title">' +
            '</label>' +
            '<label class="request-pr-label">Body' +
              '<textarea class="request-pr-body" rows="4" data-request-pr-body="' + escapeHtml(reqId) + '" data-preserve-id="pr-body:' + escapeHtml(reqId) + '" placeholder="Pull request description">' + escapeHtml(draftBody) + '</textarea>' +
            '</label>' +
            '<div class="row-actions">' +
              '<button type="submit" class="btn btn-primary" data-request-pr-submit="' + escapeHtml(reqId) + '"' + (submitDisabled ? ' disabled' : '') + '>Submit pull request</button>' +
              '<button type="button" class="btn btn-ghost" data-request-pr-cancel="' + escapeHtml(reqId) + '"' + (prInFlight ? ' disabled' : '') + '>Cancel</button>' +
            '</div>' +
          '</form>';
        }

        bodyHtml = '<div class="request-meta-row">' +
            '<span class="request-branch mono">' + escapeHtml(req.branch) + '</span>' +
            '<span class="request-check-passed">check passed</span>' +
          '</div>' +
          commitsHtml +
          '<div class="row-actions request-actions">' +
            pushBtnHtml +
            prControlHtml +
          '</div>' +
          prFormHtml;
      } else if (stateName === "done") {
        const metaRowHtml = typeof req.branch === "string" && req.branch.length > 0
          ? '<div class="request-meta-row"><span class="request-branch mono">' + escapeHtml(req.branch) + '</span></div>'
          : "";
        const commitsHtml = Array.isArray(req.commits) && req.commits.length > 0
          ? '<div class="request-commits">' +
              req.commits.map(c =>
                '<div class="request-commit">' +
                  '<span class="request-sha mono">' + escapeHtml(c.sha.slice(0, 7)) + '</span>' +
                  '<span class="request-subject">' + escapeHtml(c.subject) + '</span>' +
                '</div>'
              ).join("") +
            '</div>'
          : "";
        const prLinkHtml = typeof req.pull_request_url === "string" && req.pull_request_url.length > 0
          ? '<div class="row-actions request-actions">' + renderPullRequestLink(req.pull_request_url) + '</div>'
          : "";
        bodyHtml = metaRowHtml + commitsHtml + prLinkHtml;
      } else if (stateName === "conflict") {
        const filesHtml = '<ul class="details-list">' +
            req.conflicting_files.map(f => '<li>' + escapeHtml(f) + '</li>').join("") +
          '</ul>';
        bodyHtml = '<div class="request-detail-line">' +
            '<span class="details-label">Conflicting run</span>' +
            '<span class="run-id">' + escapeHtml(req.conflicting_run) + '</span>' +
          '</div>' +
          '<div class="request-detail-block">' +
            '<div class="details-label">Conflicting files</div>' +
            filesHtml +
          '</div>';
      } else if (stateName === "check_failed") {
        bodyHtml = '<div class="request-detail-line">' +
            '<span class="details-label">Failing step</span>' +
            '<span class="mono">' + escapeHtml(req.failing_step) + '</span>' +
          '</div>' +
          '<pre class="details-pre request-output-tail">' + escapeHtml(req.output_tail) + '</pre>';
      } else if (stateName === "error") {
        bodyHtml = '<div class="request-error-box request-state-error">' + escapeHtml(req.error) + '</div>';
      }

      const actionErrorHtml = cardError
        ? '<div class="request-error-box request-action-error">' + escapeHtml(cardError) + '</div>'
        : "";

      return '<article class="request-card ' + cardStateClass + '" data-request-id="' + escapeHtml(reqId) + '">' +
        headerHtml +
        startedByHtml +
        runsHtml +
        bodyHtml +
        actionErrorHtml +
      '</article>';
    }

    function lookupStateEntry(collection, key) {
      if (!collection) return undefined;
      if (collection instanceof Map) return collection.get(key);
      if (isPlainObject(collection) && hasOwn(collection, key)) return collection[key];
      return undefined;
    }

    function hasStateEntry(collection, key) {
      if (!collection) return false;
      if (collection instanceof Set) return collection.has(key);
      if (Array.isArray(collection)) return collection.includes(key);
      if (isPlainObject(collection)) return Boolean(collection[key]);
      return false;
    }

    function renderRequestsList(requests, panelState) {
      const state = isPlainObject(panelState) ? panelState : {};
      const errText = typeof state.error === "string" ? state.error : "";
      let html = "";
      if (errText) {
        html += '<div class="map-error">' + escapeHtml(errText) + '</div>';
      }
      if (!Array.isArray(requests) || requests.length === 0) {
        if (!errText) {
          html += '<div class="thread-empty">No requests.</div>';
        }
        return html;
      }
      const ordered = requests.slice().sort((a, b) => {
        const aDone = isPlainObject(a) && a.state === "done" ? 1 : 0;
        const bDone = isPlainObject(b) && b.state === "done" ? 1 : 0;
        return aDone - bDone;
      });
      const cardsHtml = ordered.map(req => {
        const reqId = isPlainObject(req) && typeof req.request === "string" ? req.request : "";
        return renderRequestCard(req, {
          pushInFlight: hasStateEntry(state.pushInFlight, reqId),
          prInFlight: hasStateEntry(state.prInFlight, reqId),
          prFormOpen: hasStateEntry(state.prFormOpen, reqId),
          prDraft: lookupStateEntry(state.prDrafts, reqId) || null,
          cardError: lookupStateEntry(state.cardErrors, reqId) || ""
        });
      }).join("");
      return html + cardsHtml;
    }

    function updateRequestsTabLabel() {
      if (typeof document === "undefined") return;
      const tab = document.getElementById("map-tab-requests");
      if (!tab) return;
      tab.textContent = liveRequests.length > 0
        ? "Requests (" + liveRequests.length + ")"
        : "Requests";
    }

    function renderRequestsPanel(force) {
      if (typeof document === "undefined") return;
      updateRequestsTabLabel();
      const el = document.getElementById("requests");
      if (!el) return;

      const sig = JSON.stringify({
        requests: liveRequests,
        error: requestsError,
        pushInFlight: Array.from(requestPushInFlight),
        prInFlight: Array.from(requestPrInFlight),
        prFormOpen: Array.from(requestPrFormOpen),
        cardErrors: Array.from(requestCardErrors.entries())
      });
      if (!force && sig === lastRequestsSig) return;
      lastRequestsSig = sig;

      const activeInput = document.activeElement;
      const activeInputId = activeInput && activeInput.dataset ? activeInput.dataset.preserveId : null;
      const activeSelStart = activeInput && typeof activeInput.selectionStart === "number" ? activeInput.selectionStart : null;
      const activeSelEnd = activeInput && typeof activeInput.selectionEnd === "number" ? activeInput.selectionEnd : null;

      el.innerHTML = renderRequestsList(liveRequests, {
        error: requestsError,
        pushInFlight: requestPushInFlight,
        prInFlight: requestPrInFlight,
        prFormOpen: requestPrFormOpen,
        prDrafts: requestPrDrafts,
        cardErrors: requestCardErrors
      });

      if (activeInputId) {
        const restored = el.querySelector('[data-preserve-id="' + escapeAttrSelector(activeInputId) + '"]');
        if (restored) {
          restored.focus();
          if (activeSelStart !== null) {
            try {
              restored.setSelectionRange(activeSelStart, activeSelEnd !== null ? activeSelEnd : activeSelStart);
            } catch (_) {}
          }
        }
      }
    }

    function renderMapPane(state, force) {
      renderMapChrome();
      if (openReportKey !== null) {
        renderReportReader();
        return;
      }
      if (mapTab === "runs") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        renderMap(state, force);
      } else if (mapTab === "requests") {
        renderMapMeta(null, null, force);
        renderMapDetail(null);
        renderRequestsPanel(force);
      } else if (mapTab === "system") {
        renderSystemTab(state, force);
      } else if (mapTab === "data") {
        renderDataTab(state, force);
      }
    }

    function renderModeChrome() {
      const designTab = document.getElementById("mode-design");
      const reviewTab = document.getElementById("mode-review");
      const convEl = document.getElementById("conversation");
      const reviewWrap = document.getElementById("review-wrap");

      const isDesign = mode === "design";
      designTab.classList.toggle("active", isDesign);
      designTab.setAttribute("aria-selected", isDesign ? "true" : "false");
      reviewTab.classList.toggle("active", !isDesign);
      reviewTab.setAttribute("aria-selected", !isDesign ? "true" : "false");

      convEl.hidden = !isDesign;
      reviewWrap.hidden = isDesign;
    }

    function renderAll(force) {
      const state = computeState();
      updateHeaderCounters(state);
      renderModeChrome();
      updateFocusIndicator();
      renderMapPane(state, force);
      renderAttachedReports();
      renderQueue(state, force);
    }

    function switchMode(targetMode, scrollToGroup) {
      if (targetMode === mode) {
        if (targetMode === "review" && scrollToGroup) {
          scrollQueueToGroup(scrollToGroup);
        }
        return;
      }
      mode = targetMode;
      renderAll(true);
      if (targetMode === "review") {
        const target = scrollToGroup || focusedGroup || null;
        if (target) scrollQueueToGroup(target);
      }
    }

    function setFocusGroup(groupName) {
      focusedGroup = focusedGroup === groupName ? null : groupName;
      renderAll(true);
      if (focusedGroup !== null && mode === "review") {
        scrollQueueToGroup(focusedGroup);
      }
    }

    function setMapTab(nextTab) {
      if (nextTab === mapTab) return;
      mapTab = nextTab;
      hoveredMapUnit = null;
      if (mapTab === "system" || mapTab === "data") {
        ensureMapLoaded();
      }
      renderAll(true);
    }

    function setHeaderError(msg) {
      const el = document.getElementById("header-error");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
      } else {
        el.hidden = false;
        el.textContent = msg;
      }
    }

    function setComposerError(msg) {
      const el = document.getElementById("composer-error");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
      } else {
        el.hidden = false;
        el.textContent = msg;
      }
    }

    function setQueueError(msg) {
      if (typeof document === "undefined") return;
      const el = document.getElementById("queue-error");
      if (!el) return;
      if (!msg) {
        el.hidden = true;
        el.textContent = "";
      } else {
        el.hidden = false;
        el.textContent = msg;

    function setRunsError(msg) {
      runsError = msg || "";
      setQueueError(runsError);
      updateReviewTabCounter(computeState().undecidedArrived.length);

    async function fetchRuns() {
      if (pollingStopped) {
        return;
      }
      if (runsFetchInFlight) {
        runsRefetchNeeded = true;
        return;
      }
      runsFetchInFlight = true;
      try {
        const res = await fetchWithRetry("/api/runs");
        if (res.status === 403) {
          return;
        }
        if (!res.ok) {
          const errMsg = await parseErrorPayload(res, "/api/runs");
          setRunsError(errMsg);
          return;
        }
        let data;
        try {
          data = await res.json();
        } catch (err) {
          setRunsError("/api/runs returned invalid JSON: " + (err && err.message ? err.message : String(err)));
          return;
        }
        const err = validateRuns(data);
        if (err) {
          setRunsError(err);
          return;
        }
        runsError = "";
        setQueueError("");
        liveRuns = data;
        allGroups = computeGroups();
        if (focusedGroup !== null && !allGroups.includes(focusedGroup)) {
          focusedGroup = null;
        }
        if (openReportKey !== null) {
          const stillExists = liveRuns.runs.some(r => r.key === openReportKey && isUndecided(r));
          if (!stillExists) {
            closeReport();
          }
        }
        renderAll(true);
      } finally {
        runsFetchInFlight = false;
        if (runsRefetchNeeded && !pollingStopped) {
          runsRefetchNeeded = false;
          fetchRuns();
        }
      }
    }

    async function fetchRequests() {
      if (pollingStopped) {
        return;
      }
      if (requestsFetchInFlight) {
        requestsRefetchNeeded = true;
        return;
      }
      requestsFetchInFlight = true;
      try {
        const res = await fetchWithRetry("/api/requests");
        if (res.status === 403) {
          return;
        }
        if (!res.ok) {
          requestsError = await parseErrorPayload(res, "/api/requests");
          renderRequestsPanel(false);
          return;
        }
        let data;
        try {
          data = await res.json();
        } catch (err) {
          requestsError = "/api/requests returned invalid JSON: " + (err && err.message ? err.message : String(err));
          renderRequestsPanel(false);
          return;
        }
        if (!Array.isArray(data)) {
          requestsError = "/api/requests: response must be a JSON array";
          renderRequestsPanel(false);
          return;
        }
        requestsError = "";
        liveRequests = data;
        renderRequestsPanel(false);
      } finally {
        requestsFetchInFlight = false;
        if (requestsRefetchNeeded && !pollingStopped) {
          requestsRefetchNeeded = false;
          fetchRequests();
        }
      }
    }

    async function postRequestPush(requestId) {
      if (requestPushInFlight.has(requestId)) {
        return false;
      }
      if (!surfaceToken) {
        requestCardErrors.set(requestId, MISSING_TOKEN_MSG);
        renderRequestsPanel(true);
        return false;
      }
      requestPushInFlight.add(requestId);
      requestCardErrors.delete(requestId);
      renderRequestsPanel(true);
      const route = "/api/requests/" + encodeURIComponent(requestId) + "/push";
      try {
        const res = await fetchWithRetry(route, { method: "POST" });
        if (!res.ok) {
          const errMsg = await parseErrorPayload(res, route);
          requestCardErrors.set(requestId, errMsg);
          return false;
        }
        let data;
        try {
          data = await res.json();
        } catch (err) {
          requestCardErrors.set(requestId, route + " returned invalid JSON: " + (err && err.message ? err.message : String(err)));
          return false;
        }
        if (!isPlainObject(data) || data.pushed !== true) {
          requestCardErrors.set(requestId, route + ": missing or invalid field pushed");
          return false;
        }
        requestCardErrors.delete(requestId);
        await fetchRequests();
        return true;
      } finally {
        requestPushInFlight.delete(requestId);
        renderRequestsPanel(true);
      }
    }

    async function postRequestPullRequest(requestId, title, body) {
      if (requestPrInFlight.has(requestId)) {
        return false;
      }
      const trimmedTitle = typeof title === "string" ? title.trim() : "";
      if (trimmedTitle.length === 0) {
        requestCardErrors.set(requestId, "Pull request title is required.");
        renderRequestsPanel(true);
        return false;
      }
      if (!surfaceToken) {
        requestCardErrors.set(requestId, MISSING_TOKEN_MSG);
        renderRequestsPanel(true);
        return false;
      }
      const bodyText = typeof body === "string" ? body : "";
      requestPrInFlight.add(requestId);
      requestCardErrors.delete(requestId);
      renderRequestsPanel(true);
      const route = "/api/requests/" + encodeURIComponent(requestId) + "/pull-request";
      try {
        const res = await fetchWithRetry(route, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: trimmedTitle, body: bodyText })
        });
        if (!res.ok) {
          const errMsg = await parseErrorPayload(res, route);
          requestCardErrors.set(requestId, errMsg);
          return false;
        }
        let data;
        try {
          data = await res.json();
        } catch (err) {
          requestCardErrors.set(requestId, route + " returned invalid JSON: " + (err && err.message ? err.message : String(err)));
          return false;
        }
        if (!isPlainObject(data) || typeof data.url !== "string" || data.url.length === 0) {
          requestCardErrors.set(requestId, route + ": missing or invalid field url");
          return false;
        }
        requestCardErrors.delete(requestId);
        requestPrFormOpen.delete(requestId);
        requestPrDrafts.delete(requestId);
        await fetchRequests();
        return true;
      } finally {
        requestPrInFlight.delete(requestId);
        renderRequestsPanel(true);
      }
    }

    async function postDecision(runKey, action, note, shouldRefresh) {
      const run = findRunByKey(runKey);
      if (!run) {
        cardErrors.set(runKey, "run not found in queue");
        renderAll(true);
        return false;
      }
      const trimmedNote = (note || "").trim();
      if ((action === "send_back" || action === "hold") && trimmedNote.length === 0) {
        noteErrors.set(runKey, "A one-line note is required.");
        renderAll(true);
        return false;
      }
      if (!surfaceToken) {
        cardErrors.set(runKey, MISSING_TOKEN_MSG);
        if (openReportKey === runKey) {
          reportReaderError = MISSING_TOKEN_MSG;
        }
        renderAll(true);
        return false;
      }
      const url = "/api/runs/" + encodeURIComponent(run.id) + "/decision";
      const res = await fetchWithRetry(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, note: trimmedNote })
      });
      if (!res.ok) {
        const errMsg = await parseErrorPayload(res, url);
        cardErrors.set(runKey, errMsg);
        if (openReportKey === runKey) {
          reportReaderError = errMsg;
        }
        renderAll(true);
        return false;
      }
      let data;
      try {
        data = await res.json();
      } catch (err) {
        const msg = url + " returned invalid JSON: " + (err && err.message ? err.message : String(err));
        cardErrors.set(runKey, msg);
        if (openReportKey === runKey) reportReaderError = msg;
        renderAll(true);
        return false;
      }
      const validationErr = validateDecisionResponse(data);
      if (validationErr) {
        cardErrors.set(runKey, validationErr);
        if (openReportKey === runKey) reportReaderError = validationErr;
        renderAll(true);
        return false;
      }
      pendingNoteAction.delete(runKey);
      noteDrafts.delete(runKey);
      noteErrors.delete(runKey);
      cardErrors.delete(runKey);
      if (openReportKey === runKey) {
        reportReaderError = "";
      }
      if (shouldRefresh) {
        await fetchRuns();
      }
      return true;
    }

    async function acceptAllCleanInGroup(groupName) {
      const state = computeState();
      const targets = state.undecidedArrived.filter(
        r => r.card === "clean" && !isHeld(r) && runGroupName(r) === groupName
      );
      for (const r of targets) {
        const ok = await postDecision(r.key, "accept", "", false);
        if (!ok) break;
      }
      await fetchRuns();
    }

            requestPrDrafts.set(reqId, existing);
            const form = titleInp.closest("[data-request-pr-form]");
            const submitBtn = form ? form.querySelector("[data-request-pr-submit]") : null;
            if (submitBtn) {
              submitBtn.disabled = titleInp.value.trim().length === 0 || requestPrInFlight.has(reqId);

          const bodyInp = e.target.closest("[data-request-pr-body]");
          if (bodyInp) {
            const reqId = bodyInp.dataset.requestPrBody;
            const existing = requestPrDrafts.get(reqId) || { title: "", body: "" };
            existing.body = bodyInp.value;
            requestPrDrafts.set(reqId, existing);
          }
        });

          const prForm = e.target.closest("[data-request-pr-form]");
          if (prForm) {

            const titleInp = prForm.querySelector("[data-request-pr-title]");
            const bodyInp = prForm.querySelector("[data-request-pr-body]");
            const draft = requestPrDrafts.get(reqId) || { title: "", body: "" };
            const title = titleInp ? titleInp.value : draft.title;
            const body = bodyInp ? bodyInp.value : draft.body;
            requestPrDrafts.set(reqId, { title, body });
            postRequestPullRequest(reqId, title, body);
          }
        });

    async function submitApprovalAnswer(id, answer) {
      const threadEl = document.getElementById("conversation-thread");
      const card = findApprovalCard(threadEl, id);
      const errEl = card ? card.querySelector(".approval-error") : null;
      const setErr = (msg) => {
        if (!errEl) return;
        errEl.textContent = msg;
        errEl.hidden = !msg;
      };
      if (!surfaceToken) {
        setErr(MISSING_TOKEN_MSG);
        return;
      }
      const rec = approvalsById.get(id);
      if (rec && (rec.answer !== null || rec.inFlight)) {
        return;
      }
      if (rec) rec.inFlight = true;
      const btns = card ? card.querySelectorAll(".approval-btn") : [];
      for (const btn of btns) {
        btn.disabled = true;
      }
      const route = "/api/session/approvals/" + encodeURIComponent(id);
      const res = await fetchWithRetry(route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer })
      });
      if (!res.ok) {
        const errMsg = await parseErrorPayload(res, route);
        setErr(errMsg);
        if (rec) rec.inFlight = false;
        if (res.status !== 409 && surfaceToken && (!rec || rec.answer === null)) {
          for (const btn of btns) {
            btn.disabled = false;
          }
        }
        return;
      }
      markApprovalCardAnswered(threadEl, id, answer);
    }

    async function submitMessage() {
      if (!surfaceToken) {
        setComposerError(MISSING_TOKEN_MSG);
        return;
      }
      const input = document.getElementById("conversation-input");
      const text = input.value.trim();
      if (!text) return;
      const sendBtn = document.getElementById("conversation-send");
      const reports = attachedReports.map(r => r.id);
      sendBtn.disabled = true;
      try {
        const res = await fetchWithRetry("/api/session/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, reports })
        });
        if (!res.ok) {
          const errMsg = await parseErrorPayload(res, "/api/session/messages");
          setComposerError(errMsg);
          return;
        }
        let data;
        try {
          data = await res.json();
        } catch (err) {
          setComposerError("/api/session/messages returned invalid JSON: " + (err && err.message ? err.message : String(err)));
          return;
        }
        if (!isPlainObject(data) || typeof data.seq !== "number" || !Number.isFinite(data.seq)) {
          setComposerError("/api/session/messages: missing or invalid field seq");
          return;
        }
        setComposerError("");
        input.value = "";
        attachedReports.length = 0;
        renderAttachedReports();
      } finally {
        sendBtn.disabled = !surfaceToken;
      }
    }

    async function changeModel(nextModel) {
      const select = document.getElementById("model-select");
      const prevModel = sessionState ? sessionState.model : "";
      if (!surfaceToken) {
        setHeaderError(MISSING_TOKEN_MSG);
        if (prevModel) select.value = prevModel;
        return;
      }
      const res = await fetchWithRetry("/api/session/model", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: nextModel })
      });
      if (!res.ok) {
        const errMsg = await parseErrorPayload(res, "/api/session/model");
        setHeaderError(errMsg);
        if (prevModel) select.value = prevModel;
        return;
      }
      let data;
      try {
        data = await res.json();
      } catch (err) {
        setHeaderError("/api/session/model returned invalid JSON: " + (err && err.message ? err.message : String(err)));
        if (prevModel) select.value = prevModel;
        return;
      }
      const err = validateSession(data, "/api/session/model");
      if (err) {
        setHeaderError(err);
        if (prevModel) select.value = prevModel;
        return;
      }
      setHeaderError("");
      applySessionState(data, false);
    }

    async function changeEffort(nextEffort) {
      const select = document.getElementById("effort-select");
      const prevEffort = sessionState ? sessionState.effort : null;
      if (!surfaceToken) {
        setHeaderError(MISSING_TOKEN_MSG);
        select.value = prevEffort === null ? "" : prevEffort;
        return;
      }
      const res = await fetchWithRetry("/api/session/effort", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ effort: nextEffort })
      });
      if (!res.ok) {
        const errMsg = await parseErrorPayload(res, "/api/session/effort");
        setHeaderError(errMsg);
        select.value = prevEffort === null ? "" : prevEffort;
        return;
      }
      let data;
      try {
        data = await res.json();
      } catch (err) {
        setHeaderError("/api/session/effort returned invalid JSON: " + (err && err.message ? err.message : String(err)));
        select.value = prevEffort === null ? "" : prevEffort;
        return;
      }
      const err = validateSession(data, "/api/session/effort");
      if (err) {
        setHeaderError(err);
        select.value = prevEffort === null ? "" : prevEffort;
        return;
      }
      setHeaderError("");
      applySessionState(data, false);
    }

    async function pollEvents() {
      if (eventsPollRunning || pollingStopped) {
        return;
      }
      eventsPollRunning = true;
      try {
        while (!pollingStopped) {
          const url = "/api/session/events?after=" + encodeURIComponent(String(lastSeqSeen)) + "&wait_ms=25000";
          const res = await fetchWithRetry(url);
          if (res.status === 403 || pollingStopped) {
            return;
          }
          if (!res.ok) {
            const errMsg = await parseErrorPayload(res, "/api/session/events");
            appendConversationError(errMsg);
            await new Promise(resolve => setTimeout(resolve, 2000));
            continue;
          }
          let data;
          try {
            data = await res.json();
          } catch (err) {
            appendConversationError("/api/session/events returned invalid JSON: " + (err && err.message ? err.message : String(err)));
            await new Promise(resolve => setTimeout(resolve, 2000));
            continue;
          }
          const validationErr = validateEvents(data);
          if (validationErr) {
            appendConversationError(validationErr);
            await new Promise(resolve => setTimeout(resolve, 2000));
            continue;
          }
          applyLogEntries(data.entries);
          if (data.last_seq > lastSeqSeen) {
            lastSeqSeen = data.last_seq;
          }
          initialEventsLoaded = true;
        }
      } finally {
        eventsPollRunning = false;
      }
    }

    async function loadInitialSession() {
      const res = await fetchWithRetry("/api/session");
      if (res.status === 403) {
        return;
      }
      if (!res.ok) {
        appendConversationError(await parseErrorPayload(res, "/api/session"));
        return;
      }
      let data;
      try {
        data = await res.json();
      } catch (err) {
        appendConversationError("/api/session returned invalid JSON: " + (err && err.message ? err.message : String(err)));
        return;
      }
      const err = validateSession(data, "/api/session");
      if (err) {
        appendConversationError(err);
        return;
      }
      applySessionState(data, true);
    }

    async function loadModels() {
      const res = await fetchWithRetry("/api/models");
      if (res.status === 403) {
        return;
      }
      if (!res.ok) {
        setHeaderError(await parseErrorPayload(res, "/api/models"));
        return;
      }
      let data;
      try {
        data = await res.json();
      } catch (err) {
        setHeaderError("/api/models returned invalid JSON: " + (err && err.message ? err.message : String(err)));
        return;
      }
      const err = validateModels(data);
      if (err) {
        setHeaderError(err);
        return;
      }
      modelsList = data.models;
      renderModelsSelect();
    }

    function startPolling() {
      pollingStopped = false;
      if (runsPollTimer === null) {
        fetchRuns();
        runsPollTimer = setInterval(fetchRuns, RUNS_POLL_MS);
      }
      if (requestsPollTimer === null) {
        fetchRequests();
        requestsPollTimer = setInterval(fetchRequests, RUNS_POLL_MS);
      }
      pollEvents();
    }

    async function init() {
      surfaceToken = readSurfaceToken();
      if (typeof window !== "undefined") {
        window.addEventListener("hashchange", () => {
          const next = readSurfaceToken();
          if (next) {
            surfaceToken = next;
            updateMissingTokenUI();
            if (pollingStopped) {
              startPolling();
            }
          }
        });
      }
      bindEvents();
      updateMissingTokenUI();
      renderAll(true);
      await loadInitialSession();
      if (pollingStopped) {
        return;
      }
      loadModels();
      startPolling();
    }

    if (typeof document !== "undefined") {
      init();
    }
  </script>
</body>
</html>
