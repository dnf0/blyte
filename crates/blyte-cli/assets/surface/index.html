<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blyte</title>
  <style>
    :root {
      --color-page: #ECEFF0;
      --color-card: #F4F6F7;
      --color-line: #C9D0D4;
      --color-line-dark: #B3BCC1;
      --color-text: #2A3238;
      --color-strong: #141A1E;
      --color-muted: #56616A;

      --status-running: #A6441A;
      --status-amber: #8A6A12;
      --status-red: #A93A36;

      --focus-ring: #A6441A;
      --brand-rust: #A6441A;
      --brand-rust-soft: #E8C8B7;

      --font-sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --pass: #2E7A4D;
      --pass-soft: #CFE3D6;
      --fail: #A93A36;
      --fail-soft: #F0D3D1;
      --amber: #8A6A12;
      --amber-soft: #EFE3BF;
      --merged: #3E6D64;
      --merged-soft: #C3D6D1;
      --research: #3B6EA5;
      --research-soft: #D6E4F0;
      --lane: #E6EAEC;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-page: #0F1315;
        --color-card: #171D20;
        --color-line: #283136;
        --color-line-dark: #36414A;
        --color-text: #C9D1D5;
        --color-strong: #E2E7E9;
        --color-muted: #93A0A7;

        --status-running: #E27A44;
        --status-amber: #D9B45A;
        --status-red: #E27B76;

        --focus-ring: #E27A44;
        --brand-rust: #E27A44;
        --brand-rust-soft: #4A2B1D;

        --pass: #6CC08E;
        --pass-soft: #1E3428;
        --fail: #E27B76;
        --fail-soft: #3A2120;
        --amber: #D9B45A;
        --amber-soft: #3A3218;
        --merged: #7FB2A6;
        --merged-soft: #1F3431;
        --research: #6FA3D8;
        --research-soft: #1E2E3E;
        --lane: #131A1D;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--color-page);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    [hidden] {
      display: none !important;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .nums {
      font-variant-numeric: tabular-nums;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #bar {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-line);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
    }

    .m-i { fill: var(--color-strong); }
    .m-s { fill: var(--brand-rust-soft); }
    .m-r { fill: var(--brand-rust); }

    .brand-word {
      font-weight: 900;
      font-variation-settings: "wdth" 125;
      letter-spacing: -0.02em;
      font-size: 17px;
      color: var(--color-strong);
      line-height: 1;
    }

    .btn {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--brand-rust);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      background: var(--brand-rust);
      border-color: var(--brand-rust);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-pass {
      background: var(--pass-soft);
      border-color: var(--pass);
      color: var(--color-strong);
    }

    .btn-warn {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: var(--color-strong);
    }

    .btn-danger {
      background: var(--fail-soft);
      border-color: var(--fail);
      color: var(--color-strong);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--color-line);
      color: var(--color-muted);
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--color-strong);
      border-color: var(--color-line-dark);
    }

    select.ctrl-select {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
    }

    .lost-server {
      background: var(--status-red);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .lost-server[hidden] {
      display: none;
    }

    .missing-token {
      background: var(--status-amber);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .missing-token[hidden] {
      display: none;
    }

    .repo-name {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-muted);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
    }

    .no-repo-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px dashed var(--color-line);
      background: var(--color-page);
    }

    .no-repo-badge[hidden] {
      display: none;
    }

    .working-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--brand-rust-soft);
      border: 1px solid var(--brand-rust);
      color: var(--brand-rust);
    }

    .working-pill[hidden] {
      display: none;
    }

    .inline-error {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--status-red);
    }

    .inline-error[hidden] {
      display: none;
    }

    .metric {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-page);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-text);
    }

    .metric-label {
      color: var(--color-muted);
      font-size: 11px;
    }

    .metric-val {
      font-weight: 500;
      color: var(--color-strong);
    }

    .metric.over-limit {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: var(--amber);
    }

    .metric.over-limit .metric-label,
    .metric.over-limit .metric-val {
      color: var(--amber);
      font-weight: 600;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
      gap: 0;
    }

    .workspace.map-wide {
      grid-template-columns: minmax(0, 2fr) minmax(300px, 3fr);
    }

    .pane-left {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--color-line);
      background: var(--color-page);
    }

    .pane-right {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--lane);
    }

    .pane-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--color-line);
      background: var(--color-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    #mode {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--color-line-dark);
      border-radius: 4px;
      color: var(--color-muted);
      background: transparent;
      cursor: pointer;
    }

    .mode-btn:hover {
      border-color: var(--brand-rust);
      color: var(--color-strong);
    }

    .mode-btn.active {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
      font-weight: 500;
    }

    .focus-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--brand-rust-soft);
      color: var(--color-strong);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .focus-chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0 2px;
      color: var(--color-strong);
      font-weight: 700;
    }

    #conversation {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thread-empty {
      color: var(--color-muted);
      font-size: 13px;
      padding: 24px 0;
      text-align: center;
    }

    .msg-line {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
      border: 1px solid var(--color-line);
      background: var(--color-card);
    }

    .msg-line.user {
      background: var(--brand-rust-soft);
      border-color: var(--brand-rust);
      color: var(--color-strong);
      align-self: flex-end;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg-line.assistant {
      background: var(--color-card);
      border-color: var(--color-line);
      color: var(--color-text);
      align-self: flex-start;
      max-width: 85%;
    }

    .msg-line.peer {
      background: var(--research-soft);
      border-color: var(--research);
      border-left: 3px solid var(--research);
      color: var(--color-strong);
      align-self: flex-start;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg-held-note {
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 11px;
      white-space: normal;
    }

    .msg-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-muted);
      margin-bottom: 2px;
    }

    .msg-report-tag {
      display: inline-block;
      margin-top: 4px;
      margin-right: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-card);
      color: var(--color-muted);
    }

    .msg-queued-badge {
      display: inline-block;
      margin-left: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      color: var(--amber);
    }

    .turn-body.report-body {
      font-size: 13px;
      line-height: 1.5;
    }

    .entry-tool {
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-card);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--color-text);
    }

    .entry-tool + .entry-tool,
    .entry-tool + .entry-tool-matched + .entry-tool {
      margin-top: -5px;
    }

    .entry-tool-matched[hidden] {
      display: none;
    }

    .tool-details {
      width: 100%;
    }

    .tool-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 9px;
      min-width: 0;
    }

    .tool-summary::-webkit-details-marker {
      display: none;
    }

    .tool-name {
      font-weight: 600;
      color: var(--color-strong);
      flex-shrink: 0;
    }

    .tool-input-first {
      color: var(--color-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .tool-status {
      flex-shrink: 0;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-running {
      background: var(--brand-rust-soft);
      color: var(--brand-rust);
    }

    .tool-done {
      background: var(--color-page);
      color: var(--color-muted);
    }

    .tool-waiting {
      background: var(--color-page);
      color: var(--color-muted);
    }

    .tool-error {
      background: var(--fail-soft);
      color: var(--status-red);
      font-weight: 600;
    }

    .tool-input-full {
      margin: 0;
      padding: 6px 10px 8px;
      border-top: 1px solid var(--color-line);
      background: var(--color-page);
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
    }

    .entry-retry {
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--amber-soft);
      border: 1px solid var(--amber);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    .entry-error {
      padding: 6px 10px;
      border-radius: 4px;
      background: var(--fail-soft);
      border: 1px solid var(--status-red);
      color: var(--status-red);
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .entry-quiet {
      padding: 2px 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
    }

    .entry-approval {
      border: 2px solid var(--amber);
      background: var(--amber-soft);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--color-strong);
    }

    .entry-approval.approval-answered {
      border: 1px solid var(--color-line-dark);
      background: var(--color-card);
    }

    .entry-approval-matched[hidden] {
      display: none;
    }

    .approval-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .approval-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--amber);
    }

    .entry-approval.approval-answered .approval-title {
      color: var(--color-muted);
    }

    .approval-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .approval-badge-pending {
      background: var(--amber);
      color: var(--color-page);
    }

    .approval-badge-yes {
      background: var(--pass-soft);
      border: 1px solid var(--pass);
      color: var(--pass);
    }

    .approval-badge-no {
      background: var(--fail-soft);
      border: 1px solid var(--fail);
      color: var(--fail);
    }

    .approval-reason {
      font-size: 13px;
      line-height: 1.45;
      color: var(--color-text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .approval-command {
      margin: 0;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-x: auto;
    }

    .approval-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .approval-actions[hidden] {
      display: none;
    }

    .approval-btn-yes {
      background: var(--pass-soft);
      border-color: var(--pass);
      color: var(--color-strong);
    }

    .approval-btn-no {
      background: var(--fail-soft);
      border-color: var(--fail);
      color: var(--color-strong);
    }

    .approval-error {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--fail);
    }

    .approval-error[hidden] {
      display: none;
    }

    .entry-approval-publish {
      border-color: var(--accent, var(--amber));
    }

    .approval-publish-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .approval-publish-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .approval-publish-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-muted);
      min-width: 56px;
    }

    .approval-publish-value {
      color: var(--color-strong);
      word-break: break-all;
    }

    .approval-publish-commits {
      margin: 0;
      padding-left: 18px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--color-text);
    }

    .approval-publish-commits-empty {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--color-muted);
    }

    .approval-publish-title {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--color-strong);
      word-break: break-word;
    }

    .approval-publish-body {
      margin: 0;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .composer-error {
      padding: 6px 16px 0;
      background: var(--color-card);
    }

    .attached-reports {
      border-top: 1px solid var(--color-line);
      background: var(--color-card);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }

    .attached-report-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--research-soft);
      border: 1px solid var(--research);
      color: var(--color-strong);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .attached-report-chip button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0 2px;
      color: var(--color-strong);
      font-weight: 700;
    }

    .composer {
      border-top: 1px solid var(--color-line);
      background: var(--color-card);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-page);
      color: var(--color-strong);
      font-size: 13px;
    }

    .review-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .queue-error {
      margin: 10px 16px 0;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--fail-soft);
      border: 1px solid var(--status-red);
      color: var(--status-red);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .queue-error[hidden] {

    .card-error {

    }

    .queue-group.focused {

    .group-head {

      align-items: center;

      gap: 10px;
      flex-wrap: wrap;
    }

    .group-name {

      font-size: 13px;
      font-weight: 500;
      color: var(--color-strong);
    }

    .group-meta {

      align-items: center;
      gap: 8px;
    }

    .group-count {

      font-size: 11px;
      color: var(--color-muted);
    }

    .group-body {

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .clean-row {

      align-items: center;
      justify-content: space-between;
      gap: 10px;

      border: 1px solid var(--color-line);

    .clean-main {

      align-items: center;
      gap: 8px;
      min-width: 0;

    .run-id {

      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      flex-shrink: 0;
    }

    .run-title {
      font-size: 13px;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .exception-wrap,

      flex-direction: column;
      gap: 0;
    }

    .exception-card {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-line-dark);
      border-left: 3px solid var(--amber);
      background: var(--color-page);
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .exception-card.is-failed {
      border-left-color: var(--fail);
    }

    .exception-card.is-held {
      border-left-color: var(--brand-rust);
    }

    .research-card {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-line-dark);

    .research-pill {

      font-size: 11px;
      padding: 2px 6px;

      background: var(--research-soft);
      border: 1px solid var(--research);
      color: var(--color-strong);
      flex-shrink: 0;

    .research-summary {
      margin: 2px 0;
      font-size: 12px;
      line-height: 1.4;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .research-hint {
      margin: 2px 0;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.35;
      color: var(--color-muted);
    }

    .hold-note-first {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 3px;
      background: var(--brand-rust-soft);
      color: var(--color-strong);

      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;

    .exc-top {

      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .exc-title-group {

      align-items: center;
      gap: 8px;
      min-width: 0;

    .outcome-pill {

      border-radius: 3px;
      background: var(--color-card);
      border: 1px solid var(--color-line-dark);
      color: var(--color-strong);
      flex-shrink: 0;

      background: var(--pass-soft);
      border-color: var(--pass);
    }

    .outcome-pill.failed {
      background: var(--fail-soft);
      border-color: var(--fail);
    }

    .exc-flags {

      flex-direction: column;
      gap: 2px;
      margin: 2px 0;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.35;
      color: var(--color-muted);
    }

    .exc-flag-item {

      text-overflow: ellipsis;
      color: var(--color-text);

    .exc-flag-more {

    }

    .exc-not-recorded {

    .exc-footer {

      justify-content: space-between;

      flex-shrink: 0;

    .note-prompt {

    .note-error {

    }

    .details-box {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid var(--color-line);
      background: var(--color-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .details-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;

      color: var(--color-muted);

    .details-pre {

      gap: 10px;

    .map-box {
      text-align: left;
      padding: 12px;
      border-radius: 6px;
      border: 1.5px solid var(--color-line-dark);
      background: var(--color-card);

      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.12s, background 0.12s;
    }

    .map-box:hover {
      border-color: var(--brand-rust);
    }

    .map-box.focused {
      border-color: var(--brand-rust);
      background: var(--brand-rust-soft);
    }

    .map-box-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      word-break: break-word;
    }

    .map-box-stats {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: var(--font-mono);
      font-size: 11px;

    .map-stat-running {

    .map-stat-waiting {

    .map-pane-head {

    .map-meta-bar {

    .map-outside {

      font-size: 11px;

    .map-notes {

    .map-notes-toggle {
      align-self: flex-start;

      cursor: pointer;

    .map-notes-toggle:hover {

      font-family: var(--font-mono);
      font-size: 11px;
    }

    .map-notes-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-muted);
      margin-bottom: 2px;
    }

    .map-notes-items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .map-notes-items li {
      color: var(--color-text);
      word-break: break-word;
    }

    .map-notes-reason {
      color: var(--color-muted);
    }

    .map-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;

    .map-loading {

      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-muted);
    }

    .map-error {
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid var(--fail);
      background: var(--fail-soft);
      color: var(--color-strong);

      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;

    .sys-canvas {
      position: relative;
      z-index: 0;
      min-width: min-content;
      min-height: 100%;
    }

    .sys-svg {

      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    .sys-edge {
      fill: none;
      stroke: var(--color-line-dark);
      stroke-width: 1.25;
      opacity: 0.45;
      transition: opacity 0.12s, stroke 0.12s, stroke-width 0.12s;
    }

    .sys-edge.edge-strong {
      stroke: var(--brand-rust);
      stroke-width: 2.2;
      opacity: 1;
    }

    .sys-edge.edge-dim {
      opacity: 0.1;
    }

    .sys-arrow-faint {
      fill: var(--color-line-dark);
    }

    .sys-arrow-strong {
      fill: var(--brand-rust);
    }

    .sys-groups-cols {
      display: flex;
      align-items: flex-start;
      gap: 28px;
    }

    .sys-group-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sys-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .sys-group {
      border-radius: 6px;
      border: 1.5px solid var(--color-line-dark);
      background: var(--color-card);
      transition: border-color 0.12s, background 0.12s, opacity 0.12s;
    }

    .sys-group.collapsed {
      position: relative;
      z-index: 3;
      min-width: 175px;

    .sys-group.open {
      background: var(--color-page);
      border-color: var(--color-line-dark);

      grid-column: 1 / -1;

    .sys-group.focused {
      border-color: var(--brand-rust);
    }

    .sys-group.collapsed.focused {
      background: var(--brand-rust-soft);
    }

    .sys-group.has-running {
      border-color: var(--status-running);
    }

    .sys-group.has-waiting:not(.has-running) {
      border-color: var(--amber);

      z-index: 3;

      text-align: left;

      background: transparent;

      display: flex;
      flex-direction: column;
      gap: 5px;

      border-bottom: 1px solid var(--color-line);

      justify-content: space-between;

      border: 1px solid var(--color-line);
      background: var(--color-page);
      color: var(--color-muted);
      flex-shrink: 0;

    .sys-group-meta {

      align-items: center;
      flex-wrap: wrap;

      font-size: 11px;
      color: var(--color-muted);

      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-line-dark);
      background: var(--color-card);

      flex-direction: column;
      gap: 3px;
      transition: border-color 0.12s, background 0.12s, opacity 0.12s;

    .sys-unit.has-waiting:not(.has-running) {

    .sys-unit-label {

      font-size: 12px;
      font-weight: 500;
      color: var(--color-strong);
      white-space: nowrap;

    .sys-unit-overlay {

      font-size: 10px;

    .sys-empty-units {

      font-size: 11px;
      color: var(--color-muted);

    .map-data-head {

      border-bottom: 1px solid var(--color-line);
      flex-shrink: 0;

      font-size: 12px;

    .map-data-toggle {

      align-items: center;

      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-text);

</head>
<body>
  <div id="app" class="shell">
    <div id="lost-server" class="lost-server" role="status" hidden>No answer from blyte. Trying again.</div>
    <div id="missing-token" class="missing-token" role="status" hidden>Cannot send until this page is opened from the URL blyte printed.</div>
    <header id="bar">
      <div class="bar-row">
        <div class="bar-group">
          <span class="brand">
            <svg viewBox="0 0 100 100" width="20" height="20" aria-hidden="true">
              <rect class="m-i" x="10" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="38" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="66" y="10" width="24" height="24" rx="3"/>
              <rect class="m-i" x="10" y="38" width="24" height="24" rx="3"/>
              <rect class="m-s" x="38" y="38" width="24" height="24" rx="3"/>
              <rect class="m-r" x="66" y="38" width="24" height="24" rx="3"/>
              <rect class="m-i" x="10" y="66" width="24" height="24" rx="3"/>
              <rect class="m-r" x="38" y="66" width="24" height="24" rx="3"/>
              <rect class="m-r" x="66" y="66" width="24" height="24" rx="3"/>
            </svg>
            <span class="brand-word">blyte</span>
          </span>
          <span id="repo-name" class="repo-name"></span>
          <span id="no-repo-badge" class="no-repo-badge" hidden></span>
          <span id="working-indicator" class="working-pill" hidden>working</span>
        </div>

        <div class="bar-group">
          <select id="model-select" class="ctrl-select" aria-label="Model"></select>
          <select id="effort-select" class="ctrl-select" aria-label="Effort">
            <option value="">effort: default</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>

          <span id="header-error" class="inline-error" hidden></span>
          <div id="wip" class="metric nums"><span class="metric-label">wip</span><span class="metric-val">0 / 3</span></div>
          <div id="waiting" class="metric nums"><span class="metric-label">waiting</span><span class="metric-val">0 / 7</span></div>
        </div>

    </header>

    <div class="workspace">
      <section class="pane-left" aria-label="Work surface">
        <div class="pane-head">
          <div id="mode" role="tablist" aria-label="Mode">
            <button type="button" id="mode-design" class="mode-btn active" role="tab" aria-selected="true">Design</button>
            <button type="button" id="mode-review" class="mode-btn" role="tab" aria-selected="false">Review (0)</button>

        <div id="conversation">
          <div id="conversation-thread" class="thread"></div>
          <div id="attached-reports" class="attached-reports" hidden></div>
          <div id="composer-error" class="inline-error composer-error" hidden></div>
          <form id="conversation-form" class="composer">
            <input type="text" id="conversation-input" placeholder="Message the conversation model..." autocomplete="off">
            <button type="submit" id="conversation-send" class="btn btn-primary">Send</button>
          </form>

        <div id="review-wrap" class="review-wrap" hidden>
          <div id="queue-error" class="queue-error" hidden></div>

      </section>

      <aside class="pane-right" aria-label="System map">
        <div class="pane-head map-pane-head">
          <div id="map-tabs" role="tablist" aria-label="Map view">
            <button type="button" class="mode-btn active" data-map-tab="runs" role="tab" aria-selected="true">Runs</button>
            <button type="button" class="mode-btn" id="map-tab-requests" data-map-tab="requests" role="tab" aria-selected="false">Requests</button>
            <button type="button" class="mode-btn" data-map-tab="system" role="tab" aria-selected="false">System</button>

            <button type="button" id="map-wide" class="btn btn-ghost" aria-pressed="false">Wide</button>

          <div id="map-outside" class="map-outside nums" hidden></div>
          <div id="map-notes" class="map-notes" hidden></div>
        </div>
        <div id="map"></div>

          <div id="requests" class="requests-list"></div>

            <label class="map-data-toggle"><input type="checkbox" id="map-data-all"> Show all structures</label>
          </div>

        </div>

  <script>
    const WIP_CAP = 3;
    const QUEUE_BOUND = 7;
    const NO_FILES_GROUP = "no files changed";
    const RESEARCH_GROUP = "research reports";
    const IN_PROGRESS_GROUP = "in progress";
    const RETRY_DELAYS_MS = [1000, 2000, 4000, 8000];
    const RUNS_POLL_MS = 5000;

    let sessionState = null;
    let modelsList = [];
    let sessionBusy = false;
    let lastSeqSeen = 0;
    let initialEventsLoaded = false;

    const seenSeqs = new Set();
    const logEntries = [];
    const queuedUserSeqs = [];
    const openToolsByName = new Map();
    const approvalsById = new Map();

    let liveRuns = { generated_at: 0, repo: "", running: [], runs: [], skipped: [] };
    let allGroups = [];
    let runsError = "";
    let runsFetchInFlight = false;
    let runsRefetchNeeded = false;
    let runsPollTimer = null;
    let eventsPollRunning = false;

    let liveRequests = [];
    let requestsError = "";
    let requestsFetchInFlight = false;
    let requestsRefetchNeeded = false;
    let requestsPollTimer = null;
    const requestPushInFlight = new Set();
    const requestPrInFlight = new Set();
    const requestPrFormOpen = new Set();
    const requestPrDrafts = new Map();
    const requestCardErrors = new Map();
    let lastRequestsSig = "";

    let serverLost = false;
    let mode = "design";
    let focusedGroup = null;
    const openDetails = new Set();
    const runDiffs = new Map();
    const pendingNoteAction = new Map();
    const noteDrafts = new Map();
    const noteErrors = new Map();
    const cardErrors = new Map();

    let lastQueueSig = "";
    let lastMapSig = "";

    let mapTab = "runs";
    let mapWide = false;
    let mapState = null;
    let openMapGroup = null;
    let selectedMapUnit = null;
    let hoveredMapUnit = null;
    let selectedMapStructure = null;
    let showAllStructures = false;
    let mapNotesOpen = false;
    let lastSystemSig = "";
    let lastDataSig = "";
    let lastMetaSig = "";
    let renderedSysEdges = [];

    let openReportKey = null;
    let lastReportReaderKey = null;
    let reportReaderError = "";
    const attachedReports = [];

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isPlainObject(v) {
      return v !== null && typeof v === "object" && !Array.isArray(v);
    }

    function hasOwn(obj, key) {
      return Object.prototype.hasOwnProperty.call(obj, key);
    }

    function isTimestamp(v) {
      return typeof v === "string" || (typeof v === "number" && Number.isFinite(v));
    }

    const TOKEN_HEADER = "X-Blyte-Token";
    const TOKEN_STORAGE_KEY = "blyte.surface.token";
    const MISSING_TOKEN_MSG = "Cannot send until this page is opened from the URL blyte printed.";
    let surfaceToken = null;

    function readSurfaceToken() {
      if (typeof window === "undefined") return null;
      let token = null;
      try {
        const rawHash = window.location && window.location.hash
          ? window.location.hash.replace(/^#/, "")
          : "";
        if (rawHash) {
          const params = new URLSearchParams(rawHash);
          const fromHash = params.get("token");
          if (fromHash) {
            token = fromHash;
            try {
              window.sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            } catch (_) {}
            params.delete("token");
            const nextHash = params.toString();
            const nextUrl =
              window.location.pathname +
              window.location.search +
              (nextHash ? "#" + nextHash : "");
            if (window.history && typeof window.history.replaceState === "function") {
              window.history.replaceState(null, "", nextUrl);
            }
          }
        }
      } catch (_) {}
      if (!token) {
        try {
          const stored = window.sessionStorage.getItem(TOKEN_STORAGE_KEY);
          if (stored) token = stored;
        } catch (_) {}
      }
      return token;
    }

    function clearSurfaceToken() {
      surfaceToken = null;
      if (typeof window !== "undefined") {
        try {
          window.sessionStorage.removeItem(TOKEN_STORAGE_KEY);
        } catch (_) {}
      }
      updateMissingTokenUI();
    }

    function updateMissingTokenUI() {
      if (typeof document === "undefined") return;
      const missing = !surfaceToken;
      const bar = document.getElementById("missing-token");
      if (bar) bar.hidden = !missing;
      const input = document.getElementById("conversation-input");
      if (input) {
        input.disabled = missing;
        input.placeholder = missing
          ? "Open this page from the URL blyte printed to send..."
          : "Message the conversation model...";
      }
      const sendBtn = document.getElementById("conversation-send");
      if (sendBtn) sendBtn.disabled = missing;
      const modelEl = document.getElementById("model-select");
      if (modelEl) modelEl.disabled = missing;
      const effortEl = document.getElementById("effort-select");
      if (effortEl) {
        effortEl.disabled = missing || !(sessionState && sessionState.effort_supported);
      }
      const approvalBtns = document.querySelectorAll(".entry-approval:not(.approval-answered) .approval-btn");
      for (const btn of approvalBtns) {
        const id = btn.dataset.approvalId;
        const rec = id ? approvalsById.get(id) : null;
        btn.disabled = missing || Boolean(rec && rec.inFlight);
      }
    }

    function setServerLost(lost) {
      serverLost = lost;
      if (typeof document === "undefined") return;
      const bar = document.getElementById("lost-server");
      if (bar) bar.hidden = !lost;
      const queueEl = document.getElementById("queue");
      if (queueEl) queueEl.classList.toggle("queue-dimmed", lost);
    }

    let pollingStopped = false;

    function stopAllPolling() {
      pollingStopped = true;
      runsRefetchNeeded = false;
      requestsRefetchNeeded = false;
      if (runsPollTimer !== null) {
        clearInterval(runsPollTimer);
        runsPollTimer = null;
      }
      if (requestsPollTimer !== null) {
        clearInterval(requestsPollTimer);
        requestsPollTimer = null;
      }
    }

    async function fetchWithRetry(url, options) {
      const isPost = Boolean(
        options &&
        typeof options.method === "string" &&
        options.method.toUpperCase() === "POST"
      );
      const isApi = typeof url === "string" && url.startsWith("/api/");
      let reqOptions = options;
      if (isApi || isPost) {
        const headers = Object.assign({}, (options && options.headers) || {});
        if (surfaceToken) {
          headers[TOKEN_HEADER] = surfaceToken;
        }
        reqOptions = Object.assign({}, options || {}, { headers });
      }
      let attempt = 0;
      while (true) {
        try {
          const res = await fetch(url, reqOptions);
          setServerLost(false);
          if (res.status === 403 && (isApi || isPost)) {
            if (!isPost) {
              stopAllPolling();
            }
            clearSurfaceToken();
          }
          return res;
        } catch (_) {
          setServerLost(true);
          const delay = RETRY_DELAYS_MS[Math.min(attempt, RETRY_DELAYS_MS.length - 1)];
          attempt += 1;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    async function parseErrorPayload(res, route) {
      if (typeof res.text === "function") {
        let raw = "";
        try {
          raw = await res.text();
        } catch (_) {
          return route + " failed with HTTP " + res.status;
        }
        try {
          const data = JSON.parse(raw);
          if (isPlainObject(data) && typeof data.error === "string") {
            return data.error;
          }
          return route + " failed with HTTP " + res.status + " (missing error field in response)";
        } catch (_) {
          const trimmed = raw.trim();
          if (trimmed) {
            return route + " failed with HTTP " + res.status + ": " + trimmed;
          }
          return route + " failed with HTTP " + res.status + " (response is not JSON with error field)";
        }
      }
      try {
        const data = await res.json();
        if (isPlainObject(data) && typeof data.error === "string") {
          return data.error;
        }
        return route + " failed with HTTP " + res.status + " (missing error field in response)";
      } catch (_) {
        return route + " failed with HTTP " + res.status + " (response is not JSON with error field)";
      }
    }

    function validateSession(data, route) {
      if (!isPlainObject(data)) return route + ": response must be a JSON object";
      const strFields = ["session_id", "repo", "model"];
      for (const f of strFields) {
        if (typeof data[f] !== "string") return route + ": missing or invalid field " + f;
      }
      if (!hasOwn(data, "started_at") || !isTimestamp(data.started_at)) {
        return route + ": missing or invalid field started_at";
      }
      if (!hasOwn(data, "effort") || (data.effort !== null && typeof data.effort !== "string")) {
        return route + ": missing or invalid field effort";
      }
      if (typeof data.effort_supported !== "boolean") {
        return route + ": missing or invalid field effort_supported";
      }
      if (typeof data.busy !== "boolean") {
        return route + ": missing or invalid field busy";
      }
      if (typeof data.queued !== "number" || !Number.isFinite(data.queued)) {
        return route + ": missing or invalid field queued";
      }
      if (typeof data.last_seq !== "number" || !Number.isFinite(data.last_seq)) {
        return route + ": missing or invalid field last_seq";
      }
      return null;
    }

    function validateModels(data) {
      if (!isPlainObject(data) || !Array.isArray(data.models)) {
        return "/api/models: missing models array";
      }
      for (let i = 0; i < data.models.length; i++) {
        const m = data.models[i];
        if (!isPlainObject(m) || typeof m.id !== "string" || typeof m.effort_supported !== "boolean") {
          return "/api/models: invalid models[" + i + "]";
        }
      }
      return null;
    }

    function validateEvents(data) {
      if (!isPlainObject(data)) return "/api/session/events: response must be a JSON object";
      if (!Array.isArray(data.entries)) return "/api/session/events: missing entries array";
      if (typeof data.last_seq !== "number" || !Number.isFinite(data.last_seq)) {
        return "/api/session/events: missing or invalid field last_seq";
      }
      return null;
    }

    function validateRuns(data) {
      if (!isPlainObject(data)) return "/api/runs: response must be a JSON object";
      if (typeof data.generated_at !== "number" || !Number.isFinite(data.generated_at)) {
        return "/api/runs: missing or invalid field generated_at";
      }
      if (typeof data.repo !== "string") return "/api/runs: missing or invalid field repo";
      if (!Array.isArray(data.running)) return "/api/runs: missing running array";
      for (let i = 0; i < data.running.length; i++) {
        const r = data.running[i];
        if (!isPlainObject(r)) return "/api/runs: running[" + i + "] must be an object";
        for (const f of ["key", "id", "title", "task", "activity"]) {
          if (typeof r[f] !== "string") return "/api/runs: running[" + i + "] missing or invalid field " + f;
        }
        if (typeof r.research !== "boolean") return "/api/runs: running[" + i + "] missing or invalid field research";
        if (typeof r.gate_running !== "boolean") return "/api/runs: running[" + i + "] missing or invalid field gate_running";
        if (typeof r.turns !== "number" || !Number.isFinite(r.turns)) {
          return "/api/runs: running[" + i + "] missing or invalid field turns";
        }
        for (const f of ["plan_file", "plan_task"]) {
          if (!hasOwn(r, f) || (r[f] !== null && typeof r[f] !== "string")) {
            return "/api/runs: running[" + i + "] missing or invalid field " + f;
          }
        }
        if (!hasOwn(r, "started_at") || (r.started_at !== null && (typeof r.started_at !== "number" || !Number.isFinite(r.started_at)))) {
          return "/api/runs: running[" + i + "] missing or invalid field started_at";
        }
      }
      if (!Array.isArray(data.runs)) return "/api/runs: missing runs array";
      const reqStr = ["key", "id", "repo", "title", "task", "outcome"];
      const reqBool = ["research", "checks_recorded", "combined"];
      const reqNum = ["started_at", "finished_at", "turns"];
      const nullStr = ["plan_file", "plan_task", "final_message", "group", "verdict", "verdict_notes", "report"];
      const nullNum = ["cost_usd", "verdict_ts"];
      for (let i = 0; i < data.runs.length; i++) {
        const r = data.runs[i];
        if (!isPlainObject(r)) return "/api/runs: runs[" + i + "] must be an object";
        for (const f of reqStr) {
          if (typeof r[f] !== "string") return "/api/runs: runs[" + i + "] missing or invalid field " + f;
        }
        for (const f of reqBool) {
          if (typeof r[f] !== "boolean") return "/api/runs: runs[" + i + "] missing or invalid field " + f;
        }
        for (const f of reqNum) {
          if (typeof r[f] !== "number" || !Number.isFinite(r[f])) {
            return "/api/runs: runs[" + i + "] missing or invalid field " + f;
          }
        }
        for (const f of nullStr) {
          if (!hasOwn(r, f) || (r[f] !== null && typeof r[f] !== "string")) {
            return "/api/runs: runs[" + i + "] missing or invalid field " + f;
          }
        }
        for (const f of nullNum) {
          if (!hasOwn(r, f) || (r[f] !== null && (typeof r[f] !== "number" || !Number.isFinite(r[f])))) {
            return "/api/runs: runs[" + i + "] missing or invalid field " + f;
          }
        }
        if (r.card !== "clean" && r.card !== "exception" && r.card !== "research") {
          return "/api/runs: runs[" + i + "] invalid field card";
        }
        if (!Array.isArray(r.flags) || !r.flags.every(x => typeof x === "string")) {
          return "/api/runs: runs[" + i + "] invalid field flags";
        }
        if (!Array.isArray(r.changed_files) || !r.changed_files.every(x => typeof x === "string")) {
          return "/api/runs: runs[" + i + "] invalid field changed_files";
        }
        if (!Array.isArray(r.commits)) return "/api/runs: runs[" + i + "] invalid field commits";
        for (let j = 0; j < r.commits.length; j++) {
          const c = r.commits[j];
          if (!isPlainObject(c) || typeof c.sha !== "string" || typeof c.subject !== "string") {
            return "/api/runs: runs[" + i + "].commits[" + j + "] invalid";
          }
        }
        if (!hasOwn(r, "hold")) return "/api/runs: runs[" + i + "] missing field hold";
        if (r.hold !== null) {
          if (!isPlainObject(r.hold) || typeof r.hold.note !== "string" || !hasOwn(r.hold, "ts") || !isTimestamp(r.hold.ts)) {
            return "/api/runs: runs[" + i + "] invalid field hold";
          }
        }
      }
      if (!Array.isArray(data.skipped)) return "/api/runs: missing skipped array";
      for (let i = 0; i < data.skipped.length; i++) {
        const s = data.skipped[i];
        if (!isPlainObject(s) || typeof s.key !== "string" || typeof s.reason !== "string") {
          return "/api/runs: skipped[" + i + "] invalid";
        }
      }
      return null;
    }

    function validateDecisionResponse(data) {
      if (!isPlainObject(data)) return "decision response must be a JSON object";
      if (typeof data.seq !== "number" || !Number.isFinite(data.seq)) {
        return "decision response missing or invalid field seq";
      }
      if (!isPlainObject(data.decision)) return "decision response missing field decision";
      const d = data.decision;
      if (typeof d.run !== "string") return "decision response missing field decision.run";
      if (typeof d.action !== "string") return "decision response missing field decision.action";
      if (!hasOwn(d, "note") || (d.note !== null && typeof d.note !== "string")) {
        return "decision response missing field decision.note";
      }
      if (!hasOwn(d, "conversation_message") || (d.conversation_message !== null && typeof d.conversation_message !== "string")) {
        return "decision response missing field decision.conversation_message";
      }
      return null;
    }

    function runGroupName(run) {
      if (run.card === "research") {
        return RESEARCH_GROUP;
      }
      return run.group === null ? NO_FILES_GROUP : run.group;
    }

    function runningGroupName(run) {
      return run.research ? RESEARCH_GROUP : IN_PROGRESS_GROUP;
    }

    function isUndecided(run) {
      return run.verdict === null && !(run.combined && run.card === "clean" && run.hold === null);
    }

    function isHeld(run) {
      return isUndecided(run) && run.hold !== null;
    }

    function computeGroups() {
      const named = new Set();
      let hasNoFiles = false;
      let hasResearch = false;
      let hasInProgressCode = false;
      for (const r of liveRuns.running) {
        if (r.research) hasResearch = true;
        else hasInProgressCode = true;
      }
      for (const r of liveRuns.runs) {
        if (!isUndecided(r)) continue;
        if (r.card === "research") hasResearch = true;
        else if (r.group === null) hasNoFiles = true;
        else named.add(r.group);
      }
      const list = Array.from(named).sort();
      if (hasResearch) list.push(RESEARCH_GROUP);
      if (hasNoFiles) list.push(NO_FILES_GROUP);
      if (hasInProgressCode && !list.includes(IN_PROGRESS_GROUP)) list.push(IN_PROGRESS_GROUP);
      return list;
    }

    function computeState() {
      const inProgress = liveRuns.running.slice();
      const undecidedArrived = [];
      const waitingGroupSet = new Set();

      for (const r of liveRuns.runs) {
        if (isUndecided(r)) {
          undecidedArrived.push(r);
          waitingGroupSet.add(runGroupName(r));
        }
      }

      return {
        inProgress,
        undecidedArrived,
        waitingGroupsCount: waitingGroupSet.size
      };
    }

    function updateReviewTabCounter(undecidedCount) {
      if (typeof document === "undefined") return;
      const reviewTab = document.getElementById("mode-review");
      if (!reviewTab) return;
      if (runsError) {
        reviewTab.textContent = "Review (" + undecidedCount + ") !";
        reviewTab.title = runsError;
      } else {
        reviewTab.textContent = "Review (" + undecidedCount + ")";
        reviewTab.title = "";
        if (typeof reviewTab.removeAttribute === "function") {
          reviewTab.removeAttribute("title");
        }
      }
    }

    function updateHeaderCounters(state) {
      const wipEl = document.getElementById("wip");
      wipEl.querySelector(".metric-val").textContent = state.inProgress.length + " / " + WIP_CAP;
      wipEl.classList.toggle("over-limit", state.inProgress.length > WIP_CAP);

      const waitEl = document.getElementById("waiting");
      waitEl.querySelector(".metric-val").textContent = state.waitingGroupsCount + " / " + QUEUE_BOUND;
      waitEl.classList.toggle("over-limit", state.waitingGroupsCount > QUEUE_BOUND);

      updateReviewTabCounter(state.undecidedArrived.length);
    }

    function updateWorkingState() {
      if (typeof document === "undefined") return;
      const workingEl = document.getElementById("working-indicator");
      if (workingEl) workingEl.hidden = !sessionBusy;
      const sendBtn = document.getElementById("conversation-send");
      if (sendBtn) sendBtn.textContent = sessionBusy ? "Queue" : "Send";
    }

    function renderModelsSelect() {
      if (typeof document === "undefined") return;
      const select = document.getElementById("model-select");
      if (!select) return;
      const ids = modelsList.map(m => m.id);
      if (sessionState && sessionState.model && !ids.includes(sessionState.model)) {
        ids.unshift(sessionState.model);
      }
      select.innerHTML = ids.map(id =>
        '<option value="' + escapeHtml(id) + '">' + escapeHtml(id) + '</option>'
      ).join("");
      if (sessionState && sessionState.model) {
        select.value = sessionState.model;
      }
    }

    function renderNoRepoNotice(repository) {
      if (repository === false) {
        return escapeHtml("not a git repository");
      }
      return "";
    }

    function applySessionState(data, syncBusy) {
      sessionState = data;
      if (syncBusy) {
        sessionBusy = data.busy;
      }
      if (typeof document === "undefined") return;
      const repoEl = document.getElementById("repo-name");
      if (repoEl) repoEl.textContent = data.repo;
      const noRepoEl = document.getElementById("no-repo-badge");
      if (noRepoEl) {
        const notice = renderNoRepoNotice(data.repository);
        noRepoEl.innerHTML = notice;
        noRepoEl.hidden = !notice;
      }
      if (typeof data.surface_name === "string" && data.surface_name) {
        document.title = data.surface_name + " - blyte";
      }
      renderModelsSelect();
      const effortEl = document.getElementById("effort-select");
      if (effortEl) {
        effortEl.value = data.effort === null ? "" : data.effort;
        effortEl.disabled = !surfaceToken || !data.effort_supported;
      }
      updateWorkingState();
    }

    function updateFocusIndicator() {
      const holder = document.getElementById("focus-indicator");
      if (focusedGroup === null) {
        holder.innerHTML = "";
      } else {
        holder.innerHTML = '<span class="focus-chip">focus: ' + escapeHtml(focusedGroup) +
          ' <button type="button" data-clear-focus="1" aria-label="Clear focus">×</button></span>';
      }
    }

    function renderEntryError(seq, msg) {
      return '<div class="entry entry-error" data-seq="' + escapeHtml(String(seq == null ? "" : seq)) + '">' +
        escapeHtml(msg) + '</div>';
    }

    function renderTurn(entry) {
      if (typeof entry.n !== "number" || !Number.isFinite(entry.n)) {
        return renderEntryError(entry.seq, "turn entry missing or invalid field n");
      }
      if (typeof entry.text !== "string") {
        return renderEntryError(entry.seq, "turn entry missing or invalid field text");
      }
      if (typeof entry.input_tokens !== "number" || !Number.isFinite(entry.input_tokens)) {
        return renderEntryError(entry.seq, "turn entry missing or invalid field input_tokens");
      }
      if (typeof entry.output_tokens !== "number" || !Number.isFinite(entry.output_tokens)) {
        return renderEntryError(entry.seq, "turn entry missing or invalid field output_tokens");
      }
      if (!hasOwn(entry, "cost_usd") || (entry.cost_usd !== null && (typeof entry.cost_usd !== "number" || !Number.isFinite(entry.cost_usd)))) {
        return renderEntryError(entry.seq, "turn entry missing or invalid field cost_usd");
      }
      return '<div class="entry msg-line assistant" data-seq="' + escapeHtml(String(entry.seq)) + '">' +
        '<div class="msg-meta">conversation model · turn ' + escapeHtml(String(entry.n)) + '</div>' +
        '<div class="turn-body report-body">' + renderReportMarkdown(entry.text) + '</div>' +
        '</div>';
    }

    function formatBlyteArg(arg) {
      if (arg.length === 0 || /[\s"']/.test(arg)) {
        return JSON.stringify(arg);
      }
      return arg;
    }

    function parseBlyteToolInput(input) {
      let obj = null;
      if (isPlainObject(input)) {
        obj = input;
      } else if (typeof input === "string") {
        const trimmed = input.trim();
        if (trimmed.startsWith("{")) {
          try {
            const parsed = JSON.parse(trimmed);
            if (isPlainObject(parsed)) obj = parsed;
          } catch (_) {
            obj = null;
          }
        }
      }
      if (!obj || !Array.isArray(obj.args) || !obj.args.every(a => typeof a === "string")) {
        return null;
      }
      return {
        args: obj.args,
        background: obj.background === true,
      };
    }

    function formatBlyteCommand(parsed) {
      const parts = ["blyte"].concat(parsed.args.map(formatBlyteArg));
      const cmd = parts.join(" ");
      return parsed.background ? cmd + " (background)" : cmd;
    }

    function isBlyteWaitCall(name, input) {
      if (name !== "blyte") return false;
      const parsed = parseBlyteToolInput(input);
      if (parsed) {
        return parsed.args.length > 0 && parsed.args[0] === "wait";
      }
      if (typeof input === "string") {
        return /^blyte\s+wait(?:\s|$)/.test(input.trim());
      }
      return false;
    }

    function resolveToolStatus(name, input, finish) {
      const trimmed = finish.summary.trim();
      const isWait = isBlyteWaitCall(name, input);
      if (isWait && ((finish.is_error && /^exit 2(?:\s|$)/.test(trimmed)) || (!finish.is_error && trimmed === "still waiting"))) {
        return { className: "tool-waiting", label: "still waiting" };
      }
      return {
        className: finish.is_error ? "tool-error" : "tool-done",
        label: finish.summary,
      };
    }

    function formatToolInput(input, name) {
      if (name === "blyte") {
        const parsed = parseBlyteToolInput(input);
        if (parsed) return formatBlyteCommand(parsed);
      }
      if (typeof input === "string") return input;
      return JSON.stringify(input, null, 2);
    }

    function renderEntry(entry, opts) {
      if (!isPlainObject(entry)) {
        return renderEntryError("", "invalid entry: expected object");
      }
      if (typeof entry.seq !== "number" || !Number.isFinite(entry.seq)) {
        return renderEntryError("", "entry missing or invalid field seq");
      }
      if (!hasOwn(entry, "ts") || !isTimestamp(entry.ts)) {
        return renderEntryError(entry.seq, "entry missing or invalid field ts");
      }
      if (typeof entry.kind !== "string") {
        return renderEntryError(entry.seq, "entry missing or invalid field kind");
      }
      const seqAttr = escapeHtml(String(entry.seq));
      switch (entry.kind) {
        case "user_message": {
          if (typeof entry.text !== "string") {
            return renderEntryError(entry.seq, "user_message entry missing or invalid field text");
          }
          if (!Array.isArray(entry.reports) || !entry.reports.every(r => typeof r === "string")) {
            return renderEntryError(entry.seq, "user_message entry missing or invalid field reports");
          }
          if (typeof entry.queued !== "boolean") {
            return renderEntryError(entry.seq, "user_message entry missing or invalid field queued");
          }
          const stillQueued = (opts && typeof opts.stillQueued === "boolean") ? opts.stillQueued : entry.queued;
          const queuedBadge = stillQueued ? '<span class="msg-queued-badge">queued</span>' : "";
          const reportsHtml = entry.reports.length > 0
            ? '<div>' + entry.reports.map(id => '<span class="msg-report-tag">with report ' + escapeHtml(id) + '</span>').join("") + '</div>'
            : "";
          return '<div class="entry msg-line user" data-seq="' + seqAttr + '">' +
            '<div class="msg-meta">you' + queuedBadge + '</div>' +
            '<div>' + escapeHtml(entry.text) + '</div>' +
            reportsHtml +
            '</div>';
        }
        case "peer_message": {
          if (typeof entry.from_name !== "string" || entry.from_name.length === 0) {
            return renderEntryError(entry.seq, "peer_message entry missing or invalid field from_name");
          }
          if (typeof entry.from_repository !== "string" || entry.from_repository.length === 0) {
            return renderEntryError(entry.seq, "peer_message entry missing or invalid field from_repository");
          }
          if (typeof entry.text !== "string") {
            return renderEntryError(entry.seq, "peer_message entry missing or invalid field text");
          }
          if (typeof entry.queued !== "boolean") {
            return renderEntryError(entry.seq, "peer_message entry missing or invalid field queued");
          }
          if (typeof entry.held !== "boolean") {
            return renderEntryError(entry.seq, "peer_message entry missing or invalid field held");
          }
          const stillQueued = (opts && typeof opts.stillQueued === "boolean") ? opts.stillQueued : entry.queued;
          const queuedBadge = stillQueued ? '<span class="msg-queued-badge">queued</span>' : "";
          const heldHtml = entry.held
            ? '<div class="msg-held-note">held: this surface has run five turns from other surfaces since you last wrote. It runs after your next message.</div>'
            : "";
          const heading = "from surface " + entry.from_name + " (" + entry.from_repository + ")";
          return '<div class="entry msg-line peer" data-seq="' + seqAttr + '">' +
            '<div class="msg-meta">' + escapeHtml(heading) + queuedBadge + '</div>' +
            '<div>' + escapeHtml(entry.text) + '</div>' +
            heldHtml +
            '</div>';
        }
        case "turn":
          return renderTurn(entry);
        case "tool_started": {
          if (typeof entry.name !== "string") {
            return renderEntryError(entry.seq, "tool_started entry missing or invalid field name");
          }
          if (!hasOwn(entry, "input")) {
            return renderEntryError(entry.seq, "tool_started entry missing field input");
          }
          const fullInput = formatToolInput(entry.input, entry.name);
          const firstLine = fullInput.split(/\r?\n/)[0];
          const matched = opts && opts.matchedFinish;
          let statusHtml;
          if (matched) {
            const status = resolveToolStatus(entry.name, entry.input, matched);
            statusHtml = '<span class="tool-status ' + status.className + '">' + escapeHtml(status.label) + '</span>';
          } else {
            statusHtml = '<span class="tool-status tool-running">running</span>';
          }
          return '<div class="entry entry-tool" data-seq="' + seqAttr + '" data-tool-name="' + escapeHtml(entry.name) + '">' +
            '<details class="tool-details">' +
              '<summary class="tool-summary">' +
                '<span class="tool-name">' + escapeHtml(entry.name) + '</span>' +
                '<span class="tool-input-first">' + escapeHtml(firstLine) + '</span>' +
                statusHtml +
              '</summary>' +
              '<pre class="tool-input-full">' + escapeHtml(fullInput) + '</pre>' +
            '</details>' +
            '</div>';
        }
        case "tool_finished": {
          if (typeof entry.name !== "string") {
            return renderEntryError(entry.seq, "tool_finished entry missing or invalid field name");
          }
          if (typeof entry.summary !== "string") {
            return renderEntryError(entry.seq, "tool_finished entry missing or invalid field summary");
          }
          if (typeof entry.is_error !== "boolean") {
            return renderEntryError(entry.seq, "tool_finished entry missing or invalid field is_error");
          }
          if (opts && opts.matched) {
            return '<div class="entry entry-tool-matched" data-seq="' + seqAttr + '" hidden></div>';
          }
          const isUnmatchedWaiting = !entry.is_error && entry.name === "blyte" && entry.summary.trim() === "still waiting";
          const cls = isUnmatchedWaiting ? "tool-waiting" : (entry.is_error ? "tool-error" : "tool-done");
          return '<div class="entry entry-tool entry-tool-finished" data-seq="' + seqAttr + '">' +
            '<div class="tool-summary">' +
              '<span class="tool-name">' + escapeHtml(entry.name) + '</span>' +
              '<span class="tool-status ' + cls + '">' + escapeHtml(entry.summary) + '</span>' +
            '</div>' +
            '</div>';
        }
        case "retry": {
          if (typeof entry.attempt !== "number" || !Number.isFinite(entry.attempt)) {
            return renderEntryError(entry.seq, "retry entry missing or invalid field attempt");
          }
          if (typeof entry.max !== "number" || !Number.isFinite(entry.max)) {
            return renderEntryError(entry.seq, "retry entry missing or invalid field max");
          }
          if (typeof entry.wait_ms !== "number" || !Number.isFinite(entry.wait_ms)) {
            return renderEntryError(entry.seq, "retry entry missing or invalid field wait_ms");
          }
          if (typeof entry.reason !== "string") {
            return renderEntryError(entry.seq, "retry entry missing or invalid field reason");
          }
          const seconds = entry.wait_ms % 1000 === 0
            ? String(entry.wait_ms / 1000)
            : String(Math.round(entry.wait_ms / 100) / 10);
          const msg = "model call failed (" + entry.reason + "); retry " + entry.attempt + " of " + entry.max + " in " + seconds + " s";
          return '<div class="entry entry-retry" data-seq="' + seqAttr + '">' + escapeHtml(msg) + '</div>';
        }
        case "error": {
          if (typeof entry.message !== "string") {
            return renderEntryError(entry.seq, "error entry missing or invalid field message");
          }
          return '<div class="entry entry-error" data-seq="' + seqAttr + '">' + escapeHtml(entry.message) + '</div>';
        }
        case "idle": {
          if (typeof entry.turns !== "number" || !Number.isFinite(entry.turns)) {
            return renderEntryError(entry.seq, "idle entry missing or invalid field turns");
          }
          if (!hasOwn(entry, "cost_usd") || (entry.cost_usd !== null && (typeof entry.cost_usd !== "number" || !Number.isFinite(entry.cost_usd)))) {
            return renderEntryError(entry.seq, "idle entry missing or invalid field cost_usd");
          }
          const costStr = entry.cost_usd === null ? "cost not known" : "USD " + entry.cost_usd.toFixed(2);
          const line = entry.turns + " turns · " + costStr;
          return '<div class="entry entry-quiet" data-seq="' + seqAttr + '">' + escapeHtml(line) + '</div>';
        }
        case "model_changed": {
          if (typeof entry.model !== "string") {
            return renderEntryError(entry.seq, "model_changed entry missing or invalid field model");
          }
          return '<div class="entry entry-quiet" data-seq="' + seqAttr + '">' + escapeHtml("model changed to " + entry.model) + '</div>';
        }
        case "effort_changed": {
          if (!hasOwn(entry, "effort") || (entry.effort !== null && typeof entry.effort !== "string")) {
            return renderEntryError(entry.seq, "effort_changed entry missing or invalid field effort");
          }
          const label = entry.effort === null ? "default" : entry.effort;
          return '<div class="entry entry-quiet" data-seq="' + seqAttr + '">' + escapeHtml("effort changed to " + label) + '</div>';
        }
        case "decision": {
          if (typeof entry.run !== "string") {
            return renderEntryError(entry.seq, "decision entry missing or invalid field run");
          }
          if (typeof entry.action !== "string") {
            return renderEntryError(entry.seq, "decision entry missing or invalid field action");
          }
          if (!hasOwn(entry, "note") || (entry.note !== null && typeof entry.note !== "string")) {
            return renderEntryError(entry.seq, "decision entry missing or invalid field note");
          }
          const suffix = entry.note ? " — " + entry.note : "";
          const line = "decision on " + entry.run + ": " + entry.action + suffix;
          return '<div class="entry entry-quiet" data-seq="' + seqAttr + '">' + escapeHtml(line) + '</div>';
        }
        case "approval_requested": {
          if (typeof entry.id !== "string" || !entry.id) {
            return renderEntryError(entry.seq, "approval_requested entry missing or invalid field id");
          }
          if (typeof entry.command !== "string") {
            return renderEntryError(entry.seq, "approval_requested entry missing or invalid field command");
          }
          if (typeof entry.reason !== "string") {
            return renderEntryError(entry.seq, "approval_requested entry missing or invalid field reason");
          }
          const idAttr = escapeHtml(entry.id);
          const disabledAttr = surfaceToken ? "" : " disabled";
          if (hasOwn(entry, "publish") && entry.publish !== undefined && entry.publish !== null) {
            if (!isValidPublishDetails(entry.publish)) {
              return renderEntryError(entry.seq, "approval_requested entry has invalid field publish");
            }
            const p = entry.publish;
            const shortCommit = p.commit.slice(0, 7);
            const commitsHtml = p.commits.length > 0
              ? '<ul class="approval-publish-commits">' +
                  p.commits.map(subject => '<li>' + escapeHtml(subject) + '</li>').join("") +
                '</ul>'
              : '<div class="approval-publish-commits-empty">No commits.</div>';
            return (
              '<div class="entry entry-approval entry-approval-publish" data-seq="' + seqAttr + '" data-approval-card="' + idAttr + '">' +
                '<div class="approval-header">' +
                  '<span class="approval-title">Publish request ' + escapeHtml(p.request) + '?</span>' +
                  '<span class="approval-badge approval-badge-pending">Waiting for approval</span>' +
                '</div>' +
                '<div class="approval-publish-meta">' +
                  '<div class="approval-publish-row"><span class="approval-publish-label">Remote</span><span class="approval-publish-value mono">' + escapeHtml(p.remote_url) + '</span></div>' +
                  '<div class="approval-publish-row"><span class="approval-publish-label">Branch</span><span class="approval-publish-value mono">' + escapeHtml(p.branch) + ' &#8594; ' + escapeHtml(p.base) + '</span></div>' +
                  '<div class="approval-publish-row"><span class="approval-publish-label">Commit</span><span class="approval-publish-value mono">' + escapeHtml(shortCommit) + '</span></div>' +
                '</div>' +
                commitsHtml +
                '<div class="approval-publish-title">' + escapeHtml(p.title) + '</div>' +
                '<pre class="approval-publish-body">' + escapeHtml(p.body) + '</pre>' +
                '<div class="approval-actions">' +
                  '<button type="button" class="btn approval-btn approval-btn-yes" data-approval-id="' + idAttr + '" data-approval-answer="yes"' + disabledAttr + '>Approve once</button>' +
                  '<button type="button" class="btn approval-btn approval-btn-no" data-approval-id="' + idAttr + '" data-approval-answer="no"' + disabledAttr + '>Refuse</button>' +
                '</div>' +
                '<div class="approval-error" hidden></div>' +
              '</div>'
            );
          }
          return (
            '<div class="entry entry-approval" data-seq="' + seqAttr + '" data-approval-card="' + idAttr + '">' +
              '<div class="approval-header">' +
                '<span class="approval-title">Command outside the sandbox</span>' +
                '<span class="approval-badge approval-badge-pending">Waiting for approval</span>' +
              '</div>' +
              '<div class="approval-reason">' + escapeHtml(entry.reason) + '</div>' +
              '<pre class="approval-command">' + escapeHtml(entry.command) + '</pre>' +
              '<div class="approval-actions">' +
                '<button type="button" class="btn approval-btn approval-btn-yes" data-approval-id="' + idAttr + '" data-approval-answer="yes"' + disabledAttr + '>Approve once</button>' +
                '<button type="button" class="btn approval-btn approval-btn-no" data-approval-id="' + idAttr + '" data-approval-answer="no"' + disabledAttr + '>Refuse</button>' +
              '</div>' +
              '<div class="approval-error" hidden></div>' +
            '</div>'
          );
        }
        case "approval_answered": {
          if (typeof entry.id !== "string" || !entry.id) {
            return renderEntryError(entry.seq, "approval_answered entry missing or invalid field id");
          }
          if (typeof entry.command !== "string") {
            return renderEntryError(entry.seq, "approval_answered entry missing or invalid field command");
          }
          if (entry.answer !== "yes" && entry.answer !== "no") {
            return renderEntryError(entry.seq, "approval_answered entry missing or invalid field answer");
          }
          if (opts && opts.matched) {
            return '<div class="entry entry-approval-matched" data-seq="' + seqAttr + '" hidden></div>';
          }
          const approved = entry.answer === "yes";
          const label = approved ? "Approved" : "Refused";
          const badgeClass = approved ? "approval-badge-yes" : "approval-badge-no";
          return (
            '<div class="entry entry-approval approval-answered" data-seq="' + seqAttr + '" data-approval-card="' + escapeHtml(entry.id) + '">' +
              '<div class="approval-header">' +
                '<span class="approval-title">Command outside the sandbox</span>' +
                '<span class="approval-badge ' + badgeClass + '">' + label + '</span>' +
              '</div>' +
              '<pre class="approval-command">' + escapeHtml(entry.command) + '</pre>' +
            '</div>'
          );
        }
        default:
          return renderEntryError(entry.seq, "unknown entry kind " + entry.kind);
      }
    }

    function isValidPublishDetails(p) {
      if (!isPlainObject(p)) return false;
      if (typeof p.request !== "string" || !p.request) return false;
      if (typeof p.remote_url !== "string") return false;
      if (typeof p.branch !== "string") return false;
      if (typeof p.base !== "string") return false;
      if (typeof p.commit !== "string") return false;
      if (!Array.isArray(p.commits) || !p.commits.every(c => typeof c === "string")) return false;
      if (typeof p.title !== "string") return false;
      if (typeof p.body !== "string") return false;
      return true;
    }

    function findApprovalCard(threadEl, id) {
      if (!threadEl) return null;
      const cards = threadEl.querySelectorAll("[data-approval-card]");
      for (const card of cards) {
        if (card.getAttribute("data-approval-card") === id) {
          return card;
        }
      }
      return null;
    }

    function markApprovalCardAnswered(threadEl, id, answer) {
      const rec = approvalsById.get(id);
      if (rec) {
        rec.answer = answer;
        rec.inFlight = false;
      }
      const card = findApprovalCard(threadEl, id);
      if (!card) return;
      const approved = answer === "yes";
      card.classList.add("approval-answered");
      const badge = card.querySelector(".approval-badge");
      if (badge) {
        badge.className = "approval-badge " + (approved ? "approval-badge-yes" : "approval-badge-no");
        badge.textContent = approved ? "Approved" : "Refused";
      }
      const actions = card.querySelector(".approval-actions");
      if (actions) {
        actions.hidden = true;
      }
      const btns = card.querySelectorAll(".approval-btn");
      for (const btn of btns) {
        btn.disabled = true;
      }
      const errEl = card.querySelector(".approval-error");
      if (errEl) {
        errEl.textContent = "";
        errEl.hidden = true;
      }
    }

    function appendConversationError(msg) {
      if (typeof document === "undefined") return;
      const threadEl = document.getElementById("conversation-thread");
      if (!threadEl) return;
      const atBottom = threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 40;
      const emptyEl = threadEl.querySelector(".thread-empty");
      if (emptyEl) emptyEl.remove();
      const wrap = document.createElement("div");
      wrap.className = "entry entry-error";
      wrap.textContent = msg;
      threadEl.appendChild(wrap);
      if (atBottom) threadEl.scrollTop = threadEl.scrollHeight;
    }

    function insertEntryHtml(threadEl, seq, html) {
      const emptyEl = threadEl.querySelector(".thread-empty");
      if (emptyEl) emptyEl.remove();
      const tpl = document.createElement("template");
      tpl.innerHTML = html.trim();
      const node = tpl.content.firstElementChild;
      if (!node) return;
      if (typeof seq === "number" && Number.isFinite(seq)) {
        const children = threadEl.children;
        for (let i = children.length - 1; i >= 0; i--) {
          const existingSeq = Number(children[i].getAttribute("data-seq"));
          if (Number.isFinite(existingSeq) && existingSeq <= seq) {
            if (i === children.length - 1) {
              threadEl.appendChild(node);
            } else {
              threadEl.insertBefore(node, children[i + 1]);
            }
            return;
          }
        }
