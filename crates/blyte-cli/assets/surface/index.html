        if (children.length > 0 && children[0].hasAttribute("data-seq")) {
          threadEl.insertBefore(node, children[0]);
          return;
        }
      }
      threadEl.appendChild(node);
    }

    function applyLogEntries(entries) {
      const threadEl = document.getElementById("conversation-thread");
      const atBottom = threadEl.scrollHeight - threadEl.scrollTop - threadEl.clientHeight < 40;
      const sorted = entries.slice().sort((a, b) => {
        const sa = isPlainObject(a) && typeof a.seq === "number" ? a.seq : Number.MAX_SAFE_INTEGER;
        const sb = isPlainObject(b) && typeof b.seq === "number" ? b.seq : Number.MAX_SAFE_INTEGER;
        return sa - sb;
      });
      let sawDecision = false;
      let sawPendingApproval = false;
      for (const entry of sorted) {
        const hasValidSeq = isPlainObject(entry) && typeof entry.seq === "number" && Number.isFinite(entry.seq);
        if (hasValidSeq) {
          if (seenSeqs.has(entry.seq)) continue;
          seenSeqs.add(entry.seq);
          if (entry.seq > lastSeqSeen) lastSeqSeen = entry.seq;
        }
        logEntries.push(entry);

        if (isPlainObject(entry) && entry.kind === "tool_started" && typeof entry.name === "string" && hasOwn(entry, "input") && hasValidSeq && isTimestamp(entry.ts)) {
          if (!openToolsByName.has(entry.name)) openToolsByName.set(entry.name, []);
          openToolsByName.get(entry.name).push({ seq: entry.seq, input: entry.input });
          insertEntryHtml(threadEl, entry.seq, renderEntry(entry));
          continue;
        }

        if (isPlainObject(entry) && entry.kind === "tool_finished" && typeof entry.name === "string" && typeof entry.summary === "string" && typeof entry.is_error === "boolean" && hasValidSeq && isTimestamp(entry.ts)) {
          const queue = openToolsByName.get(entry.name);
          if (queue && queue.length > 0) {
            const started = queue.shift();
            const startedEl = threadEl.querySelector('[data-seq="' + String(started.seq) + '"]');
            if (startedEl) {
              const statusEl = startedEl.querySelector(".tool-status");
              if (statusEl) {
                const status = resolveToolStatus(entry.name, started.input, entry);
                statusEl.className = "tool-status " + status.className;
                statusEl.textContent = status.label;
              }
            }
            insertEntryHtml(threadEl, entry.seq, renderEntry(entry, { matched: true }));
            continue;
          }
        }

        if (isPlainObject(entry) && entry.kind === "approval_requested" && typeof entry.id === "string" && entry.id && typeof entry.command === "string" && typeof entry.reason === "string" && (!hasOwn(entry, "publish") || entry.publish === undefined || entry.publish === null || isValidPublishDetails(entry.publish)) && hasValidSeq && isTimestamp(entry.ts)) {
          approvalsById.set(entry.id, {
            seq: entry.seq,
            command: entry.command,
            reason: entry.reason,
            publish: hasOwn(entry, "publish") ? entry.publish : null,
            answer: null,
            inFlight: false
          });
          insertEntryHtml(threadEl, entry.seq, renderEntry(entry));
          sawPendingApproval = true;
          continue;
        }

        if (isPlainObject(entry) && entry.kind === "approval_answered" && typeof entry.id === "string" && entry.id && typeof entry.command === "string" && (entry.answer === "yes" || entry.answer === "no") && hasValidSeq && isTimestamp(entry.ts)) {
          if (approvalsById.has(entry.id)) {
            markApprovalCardAnswered(threadEl, entry.id, entry.answer);
            insertEntryHtml(threadEl, entry.seq, renderEntry(entry, { matched: true }));
            continue;
          }
        }

        insertEntryHtml(threadEl, hasValidSeq ? entry.seq : null, renderEntry(entry));

        if (!isPlainObject(entry) || typeof entry.kind !== "string") continue;
        if (entry.kind === "user_message" && typeof entry.queued === "boolean") {
          if (entry.queued && hasValidSeq) {
            queuedUserSeqs.push(entry.seq);
          }
          sessionBusy = true;
          updateWorkingState();
        } else if (
          entry.kind === "peer_message" &&
          typeof entry.from_name === "string" && entry.from_name.length > 0 &&
          typeof entry.from_repository === "string" && entry.from_repository.length > 0 &&
          typeof entry.text === "string" &&
          typeof entry.queued === "boolean" &&
          typeof entry.held === "boolean"
        ) {
          if (!entry.held) {
            if (entry.queued && hasValidSeq) {
              queuedUserSeqs.push(entry.seq);
            }
            sessionBusy = true;
            updateWorkingState();
          }
        } else if (entry.kind === "idle" && typeof entry.turns === "number") {
          if (queuedUserSeqs.length > 0) {
            const startedSeq = queuedUserSeqs.shift();
            const userEl = threadEl.querySelector('[data-seq="' + String(startedSeq) + '"]');
            if (userEl) {
              const badge = userEl.querySelector(".msg-queued-badge");
              if (badge) badge.remove();
            }
            sessionBusy = true;
          } else {
            sessionBusy = false;
          }
          updateWorkingState();
        } else if (entry.kind === "model_changed" && typeof entry.model === "string") {
          if (sessionState) {
            sessionState.model = entry.model;
            const found = modelsList.find(m => m.id === entry.model);
            if (found) sessionState.effort_supported = found.effort_supported;
            applySessionState(sessionState, false);
          }
        } else if (entry.kind === "effort_changed" && (entry.effort === null || typeof entry.effort === "string")) {
          if (sessionState) {
            sessionState.effort = entry.effort;
            applySessionState(sessionState, false);
          }
        } else if (entry.kind === "decision") {
          sawDecision = true;
        }
      }
      if (threadEl.children.length === 0) {
        threadEl.innerHTML = '<div class="thread-empty">Conversation with the conversation model will appear here.</div>';
      }
      if (atBottom || sawPendingApproval) {
        threadEl.scrollTop = threadEl.scrollHeight;
      }
      if (sawDecision && initialEventsLoaded) {
        fetchRuns();
      }
    }

    function renderReportMarkdown(text) {
      const renderInline = (raw) => {
        let out = "";
        let plain = "";
        const flush = () => {
          if (plain.length > 0) {
            out += escapeHtml(plain);
            plain = "";
          }
        };
        let i = 0;
        while (i < raw.length) {
          if (raw[i] === "`") {
            const end = raw.indexOf("`", i + 1);
            if (end > i + 1) {
              flush();
              out += "<code>" + escapeHtml(raw.slice(i + 1, end)) + "</code>";
              i = end + 1;
              continue;
            }
          }
          if (raw[i] === "*" && raw[i + 1] === "*") {
            const end = raw.indexOf("**", i + 2);
            if (end > i + 2) {
              flush();
              out += "<strong>" + renderInline(raw.slice(i + 2, end)) + "</strong>";
              i = end + 2;
              continue;
            }
          }
          if (raw[i] === "[" && (i === 0 || raw[i - 1] !== "!")) {
            const closeBracket = raw.indexOf("]", i + 1);
            if (closeBracket > i + 1 && raw[closeBracket + 1] === "(") {
              let depth = 1;
              let p = closeBracket + 2;
              while (p < raw.length && depth > 0) {
                if (raw[p] === "(") depth += 1;
                else if (raw[p] === ")") depth -= 1;
                if (depth > 0) p += 1;
              }
              const closeParen = depth === 0 ? p : -1;
              if (closeParen > closeBracket + 2) {
                const linkText = raw.slice(i + 1, closeBracket);
                const linkUrl = raw.slice(closeBracket + 2, closeParen).trim();
                if (linkUrl.length > 0 && !linkText.includes("[")) {
                  flush();
                  out += renderInline(linkText) + ' <span class="report-link-url">(' + escapeHtml(linkUrl) + ")</span>";
                  i = closeParen + 1;
                  continue;
                }
              }
            }
          }
          plain += raw[i];
          i += 1;
        }
        flush();
        return out;
      };

      const splitTableRow = (line) => {
        let trimmed = line.trim();
        if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
        if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
        return trimmed.split("|").map(cell => cell.trim());
      };

      const isTableSep = (line) => {
        if (!line || !line.includes("|")) return false;
        const cells = splitTableRow(line);
        return cells.length > 0 && cells.every(c => /^:?-{1,}:?$/.test(c));
      };

      const isTableStart = (lines, idx) => {
        if (idx + 1 >= lines.length) return false;
        const head = lines[idx];
        const sep = lines[idx + 1];
        if (!head.includes("|") || !isTableSep(sep)) return false;
        return splitTableRow(head).length > 0;
      };

      const isHeading = (line) => /^(#{1,4})\s+(.+)$/.test(line);
      const isFence = (line) => /^```/.test(line);
      const isUl = (line) => /^ {0,3}[-*+]\s+(.+)$/.test(line);
      const isOl = (line) => /^ {0,3}\d+\.\s+(.+)$/.test(line);

      const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
      const blocks = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        if (line.trim() === "") {
          i += 1;
          continue;
        }

        if (isFence(line)) {
          i += 1;
          const codeLines = [];
          while (i < lines.length && !/^```\s*$/.test(lines[i])) {
            codeLines.push(lines[i]);
            i += 1;
          }
          if (i < lines.length) i += 1;
          blocks.push('<pre class="report-code"><code>' + escapeHtml(codeLines.join("\n")) + "</code></pre>");
          continue;
        }

        const headingMatch = line.match(/^(#{1,4})\s+(.+)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          const content = headingMatch[2].replace(/\s+#+\s*$/, "").trim();
          blocks.push("<h" + level + ">" + renderInline(content) + "</h" + level + ">");
          i += 1;
          continue;
        }

        if (isTableStart(lines, i)) {
          const headers = splitTableRow(lines[i]);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim() !== "" && lines[i].includes("|") && !isFence(lines[i])) {
            rows.push(splitTableRow(lines[i]));
            i += 1;
          }
          const headHtml = "<thead><tr>" +
            headers.map(h => "<th>" + renderInline(h) + "</th>").join("") +
            "</tr></thead>";
          const bodyHtml = rows.length > 0
            ? "<tbody>" + rows.map(row => {
                const cells = [];
                for (let c = 0; c < headers.length; c++) {
                  cells.push("<td>" + renderInline(c < row.length ? row[c] : "") + "</td>");
                }
                return "<tr>" + cells.join("") + "</tr>";
              }).join("") + "</tbody>"
            : "";
          blocks.push('<div class="report-table-wrap"><table>' + headHtml + bodyHtml + "</table></div>");
          continue;
        }

        if (isUl(line)) {
          const items = [];
          while (i < lines.length) {
            const m = lines[i].match(/^ {0,3}[-*+]\s+(.+)$/);
            if (!m) break;
            items.push("<li>" + renderInline(m[1]) + "</li>");
            i += 1;
          }
          blocks.push("<ul>" + items.join("") + "</ul>");
          continue;
        }

        if (isOl(line)) {
          const items = [];
          while (i < lines.length) {
            const m = lines[i].match(/^ {0,3}\d+\.\s+(.+)$/);
            if (!m) break;
            items.push("<li>" + renderInline(m[1]) + "</li>");
            i += 1;
          }
          blocks.push("<ol>" + items.join("") + "</ol>");
          continue;
        }

        const paraLines = [];
        while (
          i < lines.length &&
          lines[i].trim() !== "" &&
          !isFence(lines[i]) &&
          !isHeading(lines[i]) &&
          !isTableStart(lines, i) &&
          !isUl(lines[i]) &&
          !isOl(lines[i])
        ) {
          paraLines.push(lines[i].trim());
          i += 1;
        }
        blocks.push("<p>" + renderInline(paraLines.join(" ")) + "</p>");
      }

      return blocks.join("");
    }

    function findRunByKey(runKey) {
      if (!liveRuns || !Array.isArray(liveRuns.runs)) {
        return null;
      }
      return liveRuns.runs.find(r => r.key === runKey) || null;
    }

    function renderReportReader() {
      const readerEl = document.getElementById("report-reader");
      if (openReportKey === null) {
        if (lastReportReaderKey !== null) {
          readerEl.innerHTML = "";
          lastReportReaderKey = null;
        }
        return;
      }
      const run = findRunByKey(openReportKey);
      if (!run) {
        openReportKey = null;
        lastReportReaderKey = null;
        reportReaderError = "";
        readerEl.innerHTML = "";
        return;
      }
      const pending = pendingNoteAction.get(run.key) || null;
      const draft = noteDrafts.get(run.key) || "";
      const noteErr = noteErrors.get(run.key) || "";
      const err = reportReaderError || cardErrors.get(run.key) || "";
      const sig = [run.key, pending || "", noteErr, err, run.hold ? run.hold.note : ""].join("|");
      if (sig === lastReportReaderKey) return;
      lastReportReaderKey = sig;

      const hasReport = run.report !== null && run.report.trim().length > 0;
      const bodyHtml = hasReport
        ? '<div class="report-body">' + renderReportMarkdown(run.report) + '</div>'
        : '<div class="report-body">' +
            '<div class="report-missing">No report file was recorded for this run.</div>' +
            (run.final_message !== null && run.final_message.length > 0
              ? '<pre class="report-fallback-msg">' + escapeHtml(run.final_message) + '</pre>'
              : "") +
          '</div>';

      const flagsHtml = run.flags.length > 0
        ? '<div class="report-flags">' +
            '<div class="details-label">flags (' + run.flags.length + ')</div>' +
            '<ul class="details-list">' +
              run.flags.map(fl => '<li>' + escapeHtml(fl) + '</li>').join("") +
            '</ul>' +
          '</div>'
        : "";

      const questionHtml = '<details class="report-question">' +
        '<summary>Question</summary>' +
        '<pre class="report-question-body">' + escapeHtml(run.task) + '</pre>' +
      '</details>';

      const holdPromptHtml = pending === "hold"
        ? '<form class="note-prompt" data-note-form="' + escapeHtml(run.key) + '" data-note-action="hold">' +
            '<input type="text" data-note-input="' + escapeHtml(run.key) + '" value="' + escapeHtml(draft) + '" placeholder="One-line note required for Hold..." autocomplete="off">' +
            '<button type="submit" class="btn btn-primary">Hold</button>' +
            '<button type="button" class="btn btn-ghost" data-cancel-note="' + escapeHtml(run.key) + '">Cancel</button>' +
            (noteErr ? '<div class="note-error">' + escapeHtml(noteErr) + '</div>' : "") +
          '</form>'
        : "";

      const errHtml = err ? '<div class="card-error">' + escapeHtml(err) + '</div>' : "";

      readerEl.innerHTML =
        '<div class="report-reader-head">' +
          '<div class="report-reader-title-row">' +
            '<div class="report-reader-ident">' +
              '<span class="run-id">' + escapeHtml(run.id) + '</span>' +
              '<span class="report-reader-title">' + escapeHtml(run.title) + '</span>' +
            '</div>' +
            '<span class="research-pill">research</span>' +
          '</div>' +
          '<div class="report-reader-actions">' +
            '<button type="button" class="btn btn-pass" data-action="mark_read" data-run-key="' + escapeHtml(run.key) + '">Mark read</button>' +
            '<button type="button" class="btn" data-action="hold" data-run-key="' + escapeHtml(run.key) + '">Hold</button>' +
            '<button type="button" class="btn btn-primary" data-report-use="' + escapeHtml(run.key) + '"' + (hasReport ? "" : " disabled") + '>Use in conversation</button>' +
            '<button type="button" id="report-close" class="btn btn-ghost">Close</button>' +
          '</div>' +
          holdPromptHtml +
          errHtml +
        '</div>' +
        '<div class="report-reader-scroll">' +
          '<div class="report-reader-col">' +
            questionHtml +
            bodyHtml +
            flagsHtml +
          '</div>' +
        '</div>';
    }

    function openReport(runKey) {
      const run = findRunByKey(runKey);
      if (!run || openReportKey === run.key) return;
      openReportKey = run.key;
      lastReportReaderKey = null;
      reportReaderError = "";
      renderAll(true);
    }

    function closeReport() {
      if (openReportKey === null) return;
      openReportKey = null;
      lastReportReaderKey = null;
      reportReaderError = "";
      const readerEl = document.getElementById("report-reader");
      if (readerEl) readerEl.innerHTML = "";
      renderAll(true);
    }

    function useReportInConversation(runKey) {
      const run = findRunByKey(runKey);
      if (!run || run.report === null || run.report.trim().length === 0) return;
      if (!attachedReports.some(item => item.key === run.key)) {
        attachedReports.push({ key: run.key, id: run.id });
      }
      closeReport();
      switchMode("design", null);
      renderAttachedReports();
      const input = document.getElementById("conversation-input");
      if (input) input.focus();
    }

    function renderAttachedReports() {
      const el = document.getElementById("attached-reports");
      if (!el) return;
      if (attachedReports.length === 0) {
        el.hidden = true;
        el.innerHTML = "";
        return;
      }
      el.hidden = false;
      el.innerHTML = attachedReports.map(item =>
        '<span class="attached-report-chip">report ' + escapeHtml(item.id) +
          ' <button type="button" data-report-detach="' + escapeHtml(item.key) + '" aria-label="Remove report ' + escapeHtml(item.id) + '">×</button>' +
        '</span>'
      ).join("");
    }

    async function loadRunDiff(run) {
      const existing = runDiffs.get(run.key);
      if (existing && (existing.loading || typeof existing.text === "string")) return;
      runDiffs.set(run.key, { loading: true });
      renderAll(true);
      const url = "/api/runs/" + encodeURIComponent(run.id) + "/diff";
      const res = await fetchWithRetry(url);
      if (!res.ok) {
        const msg = await parseErrorPayload(res, url);
        runDiffs.set(run.key, { error: msg });
        renderAll(true);
        return;
      }
      const text = await res.text();
      runDiffs.set(run.key, { text });
      renderAll(true);
    }

    function renderDetailsHtml(run) {
      if (run.card === "research") return "";
      if (!openDetails.has(run.key)) return "";
      const finalMsg = run.final_message !== null ? run.final_message : "(not recorded)";
      const filesHtml = run.changed_files.length > 0
        ? '<ul class="details-list">' + run.changed_files.map(f => '<li>' + escapeHtml(f) + '</li>').join("") + '</ul>'
        : '<div class="mono" style="color: var(--color-muted);">None</div>';
      const commitsHtml = run.commits.length > 0
        ? '<ul class="details-list">' + run.commits.map(c => '<li><strong>' + escapeHtml(c.sha.slice(0, 7)) + '</strong> ' + escapeHtml(c.subject) + '</li>').join("") + '</ul>'
        : '<div class="mono" style="color: var(--color-muted);">None</div>';
      const extraFlagsHtml = run.checks_recorded && run.flags.length > 3
        ? '<div><div class="details-label">all flags (' + run.flags.length + ')</div><ul class="details-list">' +
          run.flags.map(fl => '<li>' + escapeHtml(fl) + '</li>').join("") + '</ul></div>'
        : "";
      const diffState = runDiffs.get(run.key);
      let diffHtml = '<div class="mono" style="color: var(--color-muted);">Loading diff...</div>';
      if (diffState && diffState.error) {
        diffHtml = '<div class="card-error">' + escapeHtml(diffState.error) + '</div>';
      } else if (diffState && typeof diffState.text === "string") {
        diffHtml = diffState.text.length > 0
          ? '<pre class="details-pre">' + escapeHtml(diffState.text) + '</pre>'
          : '<div class="mono" style="color: var(--color-muted);">(empty diff)</div>';
      }
      return '<div class="details-box">' +
        '<div><div class="details-label">diff</div>' + diffHtml + '</div>' +
        '<div><div class="details-label">final_message</div><pre class="details-pre">' + escapeHtml(finalMsg) + '</pre></div>' +
        '<div><div class="details-label">task</div><pre class="details-pre">' + escapeHtml(run.task) + '</pre></div>' +
        extraFlagsHtml +
        '<div><div class="details-label">changed_files</div>' + filesHtml + '</div>' +
        '<div><div class="details-label">commits</div>' + commitsHtml + '</div>' +
        '</div>';
    }

    function renderResearchPreviewHtml(run) {
      const trimmedMsg = run.final_message !== null ? run.final_message.trim() : "";
      if (trimmedMsg.length > 0) {
        const firstLine = trimmedMsg.split(/\r?\n/)[0].trim();
        return '<div class="research-summary" title="' + escapeHtml(firstLine) + '">' + escapeHtml(firstLine) + '</div>';
      }
      if (run.flags.length > 0) {
        const shown = run.flags.slice(0, 3).map(fl =>
          '<div class="exc-flag-item" title="' + escapeHtml(fl) + '">• ' + escapeHtml(fl) + '</div>'
        ).join("");
        const more = run.flags.length > 3
          ? '<div class="exc-flag-more">+' + (run.flags.length - 3) + ' more</div>'
          : "";
        return '<div class="exc-flags">' + shown + more + '</div>';
      }
      const hint = run.report !== null && run.report.length > 0
        ? "Report ready to read"
        : "No report file recorded";
      return '<div class="research-hint">' + hint + '</div>';
    }

    function renderExceptionFlagsHtml(run) {
      if (!run.checks_recorded) {
        return '<div class="exc-not-recorded">checks not recorded</div>';
      }
      if (run.flags.length === 0) {
        return '<div class="exc-flag-item">outcome: ' + escapeHtml(run.outcome) + '</div>';
      }
      const shown = run.flags.slice(0, 3).map(fl =>
        '<div class="exc-flag-item" title="' + escapeHtml(fl) + '">• ' + escapeHtml(fl) + '</div>'
      ).join("");
      const more = run.flags.length > 3
        ? '<div class="exc-flag-more">+' + (run.flags.length - 3) + ' more</div>'
        : "";
      return shown + more;
    }

    function renderRunCard(r) {
      const held = isHeld(r);
      const holdNote = held ? r.hold.note : "";
      const cardErr = cardErrors.get(r.key) || "";
      const cardErrHtml = cardErr ? '<div class="card-error">' + escapeHtml(cardErr) + '</div>' : "";
      const pending = pendingNoteAction.get(r.key) || null;
      const draft = noteDrafts.get(r.key) || "";
      const noteErr = noteErrors.get(r.key) || "";

      if (r.card === "research") {
        const isReading = openReportKey === r.key;
        const outcomeClass = r.outcome === "verified" ? "verified" : "failed";
        const cardClass = "research-card" + (held ? " is-held" : "") + (isReading ? " is-reading" : "");
        const promptHtml = pending === "hold"
          ? '<form class="note-prompt" data-note-form="' + escapeHtml(r.key) + '" data-note-action="hold">' +
              '<input type="text" data-note-input="' + escapeHtml(r.key) + '" data-preserve-id="note:' + escapeHtml(r.key) + '" value="' + escapeHtml(draft) + '" placeholder="One-line note required for Hold..." autocomplete="off">' +
              '<button type="submit" class="btn btn-primary">Hold</button>' +
              '<button type="button" class="btn btn-ghost" data-cancel-note="' + escapeHtml(r.key) + '">Cancel</button>' +
              (noteErr ? '<div class="note-error">' + escapeHtml(noteErr) + '</div>' : "") +
            '</form>'
          : "";

        return '<div class="research-wrap">' +
          '<div class="' + cardClass + '">' +
            (held ? '<div class="hold-note-first" title="' + escapeHtml(holdNote) + '">Held: ' + escapeHtml(holdNote) + '</div>' : "") +
            '<div class="exc-top">' +
              '<div class="exc-title-group">' +
                '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
                '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
              '</div>' +
              '<div class="row-actions">' +
                '<span class="research-pill">research</span>' +
                '<span class="outcome-pill ' + outcomeClass + '">' + escapeHtml(r.outcome) + '</span>' +
              '</div>' +
            '</div>' +
            renderResearchPreviewHtml(r) +
            '<div class="exc-footer">' +
              '<div class="row-actions">' +
                '<button type="button" class="btn btn-pass" data-action="mark_read" data-run-key="' + escapeHtml(r.key) + '">Mark read</button>' +
                '<button type="button" class="btn" data-action="hold" data-run-key="' + escapeHtml(r.key) + '">Hold</button>' +
              '</div>' +
              '<div class="row-actions">' +
                '<button type="button" class="btn btn-ghost" data-report-open="' + escapeHtml(r.key) + '"' + (isReading ? " disabled" : "") + '>' + (isReading ? "Reading" : "Read report") + '</button>' +
              '</div>' +
            '</div>' +
            cardErrHtml +
          '</div>' +
          promptHtml +
        '</div>';
      }

      if (r.card === "clean" && !held) {
        const isOpen = openDetails.has(r.key);
        return '<div>' +
          '<div class="clean-row">' +
            '<div class="clean-main">' +
              '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
              '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
            '</div>' +
            '<div class="row-actions">' +
              '<button type="button" class="btn btn-ghost" data-toggle-details="' + escapeHtml(r.key) + '">' + (isOpen ? "Hide details" : "Details") + '</button>' +
              '<button type="button" class="btn btn-pass" data-action="accept" data-run-key="' + escapeHtml(r.key) + '">Accept</button>' +
            '</div>' +
          '</div>' +
          cardErrHtml +
          renderDetailsHtml(r) +
        '</div>';
      }

      const isOpen = openDetails.has(r.key);
      const outcomeClass = r.outcome === "verified" ? "verified" : "failed";
      const cardClass = "exception-card" + (held ? " is-held" : (r.outcome !== "verified" ? " is-failed" : ""));
      let promptHtml = "";
      if (pending === "send_back" || pending === "hold") {
        const label = pending === "send_back" ? "Send back" : "Hold";
        promptHtml = '<form class="note-prompt" data-note-form="' + escapeHtml(r.key) + '" data-note-action="' + pending + '">' +
          '<input type="text" data-note-input="' + escapeHtml(r.key) + '" data-preserve-id="note:' + escapeHtml(r.key) + '" value="' + escapeHtml(draft) + '" placeholder="One-line note required for ' + label + '..." autocomplete="off">' +
          '<button type="submit" class="btn btn-primary">' + label + '</button>' +
          '<button type="button" class="btn btn-ghost" data-cancel-note="' + escapeHtml(r.key) + '">Cancel</button>' +
          (noteErr ? '<div class="note-error">' + escapeHtml(noteErr) + '</div>' : "") +
          '</form>';
      }

      return '<div class="exception-wrap">' +
        '<div class="' + cardClass + '">' +
          (held ? '<div class="hold-note-first" title="' + escapeHtml(holdNote) + '">Held: ' + escapeHtml(holdNote) + '</div>' : "") +
          '<div class="exc-top">' +
            '<div class="exc-title-group">' +
              '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
              '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
            '</div>' +
            '<span class="outcome-pill ' + outcomeClass + '">' + escapeHtml(r.outcome) + '</span>' +
          '</div>' +
          '<div class="exc-flags">' + renderExceptionFlagsHtml(r) + '</div>' +
          '<div class="exc-footer">' +
            '<div class="row-actions">' +
              '<button type="button" class="btn btn-pass" data-action="accept" data-run-key="' + escapeHtml(r.key) + '">Accept</button>' +
              '<button type="button" class="btn btn-warn" data-action="send_back" data-run-key="' + escapeHtml(r.key) + '">Send back</button>' +
              '<button type="button" class="btn btn-danger" data-action="redo" data-run-key="' + escapeHtml(r.key) + '">Redo</button>' +
              '<button type="button" class="btn" data-action="hold" data-run-key="' + escapeHtml(r.key) + '">Hold</button>' +
            '</div>' +
            '<div class="row-actions">' +
              '<button type="button" class="btn btn-ghost" data-toggle-details="' + escapeHtml(r.key) + '">' + (isOpen ? "Hide details" : "Details") + '</button>' +
            '</div>' +
          '</div>' +
          cardErrHtml +
        '</div>' +
        promptHtml +
        renderDetailsHtml(r) +
      '</div>';
    }

    function renderQueue(state, force) {
      if (mode !== "review") return;

      const runningSig = state.inProgress.map(r => r.key + ":" + r.turns + ":" + r.activity + ":" + (r.gate_running ? "1" : "0")).join(",");
      const runsSig = state.undecidedArrived.map(r => r.key + ":" + (r.hold ? r.hold.note : "")).join(",");
      const detailsSig = Array.from(openDetails).map(k => {
        const d = runDiffs.get(k);
        return k + ":" + (d ? (d.loading ? "L" : (d.error ? "E" : "T")) : "N");
      }).join(",");
      const pendingSig = Array.from(pendingNoteAction.entries()).map(([k, v]) => k + ":" + v).join(",");
      const noteErrSig = Array.from(noteErrors.entries()).map(([k, v]) => k + ":" + v).join(",");
      const cardErrSig = Array.from(cardErrors.entries()).map(([k, v]) => k + ":" + v).join(",");
      const sig = [runningSig, runsSig, detailsSig, pendingSig, noteErrSig, cardErrSig, focusedGroup || "", openReportKey || ""].join("||");

      if (!force && sig === lastQueueSig) return;
      lastQueueSig = sig;

      const queueEl = document.getElementById("queue");
      queueEl.hidden = false;

      const activeInput = document.activeElement;
      const activeInputId = activeInput && activeInput.dataset ? activeInput.dataset.preserveId : null;
      const activeSelStart = activeInput && typeof activeInput.selectionStart === "number" ? activeInput.selectionStart : null;

      let runningHtml = "";
      if (state.inProgress.length > 0) {
        const rows = state.inProgress.map(r =>
          '<div class="running-row">' +
            '<span class="run-id">' + escapeHtml(r.id) + '</span>' +
            '<span class="run-title" title="' + escapeHtml(r.title) + '">' + escapeHtml(r.title) + '</span>' +
            '<span class="running-turns">' + escapeHtml(String(r.turns)) + ' turns</span>' +
            '<span class="running-activity" title="' + escapeHtml(r.activity) + '">' + escapeHtml(r.activity) + '</span>' +
            (r.gate_running ? '<span class="running-gate">gate</span>' : "") +
          '</div>'
        ).join("");
        runningHtml = '<section class="running-section">' +
          '<div class="running-head">In progress (' + state.inProgress.length + ')</div>' +
          '<div class="running-list">' + rows + '</div>' +
        '</section>';
      }

      const byGroup = new Map();
      for (const r of state.undecidedArrived) {
        const g = runGroupName(r);
        if (!byGroup.has(g)) byGroup.set(g, { active: [], held: [] });
        if (isHeld(r)) {
          byGroup.get(g).held.push(r);
        } else {
          byGroup.get(g).active.push(r);
        }
      }

      if (state.inProgress.length === 0 && byGroup.size === 0) {
        queueEl.innerHTML = '<div class="thread-empty">No runs in progress or waiting for review.</div>';
        return;
      }

      const orderedGroups = allGroups.filter(g => byGroup.has(g));
      for (const g of byGroup.keys()) {
        if (!orderedGroups.includes(g)) orderedGroups.push(g);
      }

      const groupsHtml = orderedGroups.map(groupName => {
        const bucket = byGroup.get(groupName);
        const active = bucket.active;
        const held = bucket.held;
        const totalUndecided = active.length + held.length;
        const researchRuns = active.filter(r => r.card === "research");
        const exceptionRuns = active.filter(r => r.card === "exception");
        const cleanRuns = active.filter(r => r.card === "clean");
        const isFocused = focusedGroup === groupName;

        let headActions = '<span class="group-count">' + totalUndecided + ' undecided</span>';
        if (cleanRuns.length >= 2) {
          headActions = '<button type="button" class="btn btn-pass" data-accept-all-clean="' + escapeHtml(groupName) + '">Accept all clean (' + cleanRuns.length + ')</button>' + headActions;
        }

        const activeHtml = researchRuns.map(renderRunCard).join("") +
          exceptionRuns.map(renderRunCard).join("") +
          cleanRuns.map(renderRunCard).join("");

        const heldHtml = held.length > 0
          ? '<div class="held-heading">Held</div>' + held.map(renderRunCard).join("")
          : "";

        return '<section class="queue-group' + (isFocused ? " focused" : "") + '" data-group="' + escapeHtml(groupName) + '">' +
          '<div class="group-head">' +
            '<span class="group-name">' + escapeHtml(groupName) + '</span>' +
            '<div class="group-meta">' + headActions + '</div>' +
          '</div>' +
          '<div class="group-body">' +
            activeHtml +
            heldHtml +
          '</div>' +
        '</section>';
      }).join("");

      queueEl.innerHTML = runningHtml + groupsHtml;

      if (activeInputId) {
        const restored = queueEl.querySelector('[data-preserve-id="' + CSS.escape(activeInputId) + '"]');
        if (restored) {
          restored.focus();
          if (activeSelStart !== null) {
            try { restored.setSelectionRange(activeSelStart, activeSelStart); } catch (_) {}
          }
        }
      }
    }

    function scrollQueueToGroup(groupName) {
      if (mode !== "review") return;
      const queueEl = document.getElementById("queue");
      const target = queueEl.querySelector('[data-group="' + CSS.escape(groupName) + '"]');
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderMap(state, force) {
      if (mapTab !== "runs") return;
      const counts = new Map();
      for (const g of allGroups) {
        counts.set(g, { running: 0, waiting: 0 });
      }
      for (const r of state.inProgress) {
        const g = runningGroupName(r);
        if (!counts.has(g)) counts.set(g, { running: 0, waiting: 0 });
        counts.get(g).running += 1;
      }
      for (const r of state.undecidedArrived) {
        const g = runGroupName(r);
        if (!counts.has(g)) counts.set(g, { running: 0, waiting: 0 });
        counts.get(g).waiting += 1;
      }

      const sig = Array.from(counts.entries()).map(([g, c]) => g + ":" + c.running + ":" + c.waiting).join("|") + "||" + (focusedGroup || "");
      if (!force && sig === lastMapSig) return;
      lastMapSig = sig;

      const mapEl = document.getElementById("map");
      if (allGroups.length === 0) {
        mapEl.innerHTML = '<div class="thread-empty">No active or waiting runs.</div>';
        return;
      }

      mapEl.innerHTML = allGroups.map(g => {
        const c = counts.get(g) || { running: 0, waiting: 0 };
        const isFocused = focusedGroup === g;
        return '<button type="button" class="map-box' + (isFocused ? " focused" : "") + '" data-map-group="' + escapeHtml(g) + '" aria-pressed="' + (isFocused ? "true" : "false") + '">' +
          '<span class="map-box-name">' + escapeHtml(g) + '</span>' +
          '<span class="map-box-stats nums">' +
            '<span class="' + (c.running > 0 ? "map-stat-running" : "") + '">' + c.running + ' in progress</span>' +
            '<span class="' + (c.waiting > 0 ? "map-stat-waiting" : "") + '">' + c.waiting + ' waiting</span>' +
          '</span>' +
        '</button>';
      }).join("");
    }

    function unitShortName(id) {
      if (id.includes("::")) {
        const parts = id.split("::");
        return parts[parts.length - 1];
      }
      if (id.includes(".")) {
        const parts = id.split(".");
        return parts[parts.length - 1];
      }
      return id;
    }

    function computeDependencyColumns(ids, edges) {
      const sortedIds = Array.from(ids).sort();
      const idSet = new Set(sortedIds);
      const deps = new Map();
      for (const id of sortedIds) {
        deps.set(id, []);
      }
      for (const e of edges) {
        if (e.from !== e.to && idSet.has(e.from) && idSet.has(e.to)) {
          deps.get(e.from).push(e.to);
        }
      }
      for (const list of deps.values()) {
        list.sort();
      }
      const visiting = new Set();
      const depth = new Map();

      function visit(id) {
        if (depth.has(id)) return depth.get(id);
        visiting.add(id);
        let maxDep = -1;
        for (const dep of deps.get(id)) {
          if (visiting.has(dep)) continue;
          const d = visit(dep);
          if (d > maxDep) maxDep = d;
        }
        visiting.delete(id);
        const col = maxDep + 1;
        depth.set(id, col);
        return col;
      }

      for (const id of sortedIds) {
        visit(id);
      }

      const cols = [];
      for (const id of sortedIds) {
        const c = depth.get(id) || 0;
        while (cols.length <= c) cols.push([]);
        cols[c].push(id);
      }
      return cols;
    }

    function addToSetMap(map, key, val) {
      if (!map.has(key)) map.set(key, new Set());
      map.get(key).add(val);
    }

    function computeOverlay(mapData, state) {
      const repoWaiting = state.undecidedArrived;

      const fileToUnit = new Map();
      for (const u of mapData.units) {
        fileToUnit.set(u.file, u);
      }
      const groupPrefixes = mapData.groups.map(g => ({
        group: g,
        prefix: g.path === "." ? "." : g.path.replace(/\/+$/, "")
      }));

      function placeFile(filePath) {
        if (fileToUnit.has(filePath)) {
          return { type: "unit", unit: fileToUnit.get(filePath) };
        }
        let best = null;
        let bestLen = -1;
        for (const gp of groupPrefixes) {
          if (gp.prefix === ".") {
            if (bestLen < 0) {
              best = gp.group;
              bestLen = 0;
            }
          } else if (filePath === gp.prefix || filePath.startsWith(gp.prefix + "/")) {
            if (gp.prefix.length > bestLen) {
              best = gp.group;
              bestLen = gp.prefix.length;
            }
          }
        }
        if (best) return { type: "group", group: best };
        return { type: "outside" };
      }

      const unitRunning = new Map();
      const unitWaiting = new Map();
      const groupRunning = new Map();
      const groupWaiting = new Map();
      const outsideFiles = new Set();

      for (const r of repoWaiting) {
        for (const f of r.changed_files) {
          const loc = placeFile(f);
          if (loc.type === "unit") {
            addToSetMap(unitWaiting, loc.unit.id, r.key);
            addToSetMap(groupWaiting, loc.unit.group, r.key);
          } else if (loc.type === "group") {
            addToSetMap(groupWaiting, loc.group.id, r.key);
          } else {
            outsideFiles.add(f);
          }
        }
      }

      const sig = repoWaiting.map(r => r.key).join(",");
      return {
        unitRunning,
        unitWaiting,
        groupRunning,
        groupWaiting,
        outsideCount: outsideFiles.size,
        sig
      };
    }

    function ensureMapLoaded() {
      if (mapState !== null) return;
      mapState = { status: "loading" };
      renderAll(true);
      (async () => {
        const response = await fetchWithRetry("/api/map");
        if (!response.ok) {
          const errMsg = await parseErrorPayload(response, "/api/map");
          mapState = { status: "error", error: errMsg };
          renderAll(true);
          return;
        }
        let data;
        try {
          data = await response.json();
        } catch (err) {
          mapState = {
            status: "error",
            error: "/api/map returned invalid JSON: " + (err && err.message ? err.message : String(err))
          };
          renderAll(true);
          return;
        }
        if (!isPlainObject(data) || !Array.isArray(data.groups) || !Array.isArray(data.units) ||
            !Array.isArray(data.edges) || !Array.isArray(data.structures) ||
            !Array.isArray(data.unparsed) || !Array.isArray(data.unresolved)) {
          mapState = { status: "error", error: "/api/map response missing required fields" };
        } else {
          mapState = { status: "ok", data };
        }
        renderAll(true);
      })();
    }

    function renderMapChrome() {
      const readerOpen = openReportKey !== null;
      const paneHead = document.querySelector(".map-pane-head");
      const tabsEl = document.getElementById("map-tabs");
      const controlsEl = document.querySelector(".map-controls");
      const metaBar = document.getElementById("map-meta-bar");
      const detailEl = document.getElementById("map-detail");
      const readerEl = document.getElementById("report-reader");

      tabsEl.querySelectorAll("[data-map-tab]").forEach(btn => {
        const isActive = btn.dataset.mapTab === mapTab;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-selected", isActive ? "true" : "false");
      });

      if (paneHead) paneHead.hidden = readerOpen;
      tabsEl.hidden = readerOpen;
      if (controlsEl) controlsEl.hidden = readerOpen;
      readerEl.hidden = !readerOpen;

      if (readerOpen) {

        document.getElementById("requests-panel").hidden = true;
        document.getElementById("map-system").hidden = true;
        document.getElementById("map-data").hidden = true;
        metaBar.hidden = true;
        detailEl.hidden = true;
      } else {
        document.getElementById("map").hidden = mapTab !== "runs";
        document.getElementById("requests-panel").hidden = mapTab !== "requests";
