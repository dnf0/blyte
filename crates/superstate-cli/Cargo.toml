[package]
name = "superstate-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Superstate unified CLI and state engine runner."

[lib]
name = "superstate_cli"
path = "src/lib.rs"

[[bin]]
name = "superstate"
path = "src/main.rs"

[[bin]]
name = "state"
path = "src/state_main.rs"

[dependencies]
superstate-core = { path = "../superstate-core" }
superstate-syntax = { path = "../superstate-syntax" }
superstate-review = { path = "../superstate-review" }
superstate-rules = { path = "../superstate-rules" }
superstate-mcp = { path = "../superstate-mcp" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
fd-lock.workspace = true
tempfile.workspace = true
