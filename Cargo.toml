[workspace]
members = [
    "crates/blyte-provider",
    "crates/blyte-agent",
    "crates/blyte-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Climate X Engineering"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/climate-x-org/superstate"
homepage = "https://github.com/climate-x-org/superstate"
readme = "README.md"
keywords = ["coding-agent", "llm", "harness", "sandbox", "cli"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.17"
clap = { version = "4.5", features = ["derive"] }
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
globset = "0.4.20"
