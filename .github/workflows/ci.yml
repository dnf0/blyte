name: CI

# The checks for a pull request run on the author's machine: scripts/land.sh runs them and then
# merges. What stays here is the one thing a Mac cannot check: the tests on Linux, once per merge.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Pytest
        run: pipx install pytest || pip install pytest || true

      - name: Rustfmt Check
        run: cargo fmt --all --check

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace Tests
        run: python3 scripts/test-parallel.py -- --workspace --all-targets
