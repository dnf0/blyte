name: CD (Cargo Publish)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish with --dry-run (safe packaging and verification test)'
        type: boolean
        required: true
        default: true
      confirm:
        description: "Type 'publish' to confirm live release to crates.io (ignored if dry_run=true)"
        type: string
        required: false
        default: ''

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Release Confirmation Gate
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            if [ "${{ inputs.confirm }}" != "publish" ]; then
              echo "::error::Live publish aborted: Confirmation prompt did not match 'publish'. Received: '${{ inputs.confirm }}'"
              exit 1
            fi
            if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
              echo "::error::Live publish aborted: CARGO_REGISTRY_TOKEN secret is not configured in repository settings."
              echo "To enable live publishing to crates.io:"
              echo "  1. Generate an API token on crates.io with publish permissions."
              echo "  2. Go to Repo Settings -> Secrets and variables -> Actions."
              echo "  3. Add secret CARGO_REGISTRY_TOKEN with your token."
              exit 1
            fi
            echo "::notice::Live publish confirmed. Proceeding with crates.io upload in topological dependency order."
          else
            echo "::notice::Running in safe DRY-RUN mode. Packages will be packed and verified without publishing."
          fi

      - name: Publish Workspace Crates in Topological Order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          TOPOLOGICAL_CRATES=(
            "blyte-provider"
            "blyte-agent"
            "blyte"
          )

          for crate in "${TOPOLOGICAL_CRATES[@]}"; do
            echo "=================================================="
            echo "Processing crate: $crate"
            echo "=================================================="

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              if [ "$crate" = "blyte-provider" ]; then
                echo "Testing dry-run publish for leaf crate: $crate"
                cargo publish --dry-run -p "$crate"
              else
                echo "Dependent crate '$crate' requires upstream crates on crates.io before packaging resolution."
                echo "Verifying local compilation and type integrity for '$crate'..."
                cargo check -p "$crate" --all-targets
              fi
            else
              echo "Publishing $crate to crates.io..."
              cargo publish -p "$crate"
              echo "Waiting 25 seconds for crates.io index propagation..."
              sleep 25
            fi

            echo "[✓] Crate $crate processed successfully."
          done
