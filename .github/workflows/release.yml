name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-binaries:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Static Binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name binary for release
        run: cp target/${{ matrix.target }}/release/blyte blyte-${{ matrix.target }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blyte-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/blyte
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: blyte-${{ matrix.target }}
