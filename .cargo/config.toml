# Tests run blyte without a provider key to exercise the "no key" paths. An empty BLYTE_ENV_FILE
# turns off blyte's key file (~/.config/blyte/env), so a developer's own key is never loaded by a test.
[env]
BLYTE_ENV_FILE = ""
# Tests never ask GitHub for the latest release: a slow answer adds up to 3 s to every blyte a test starts.
# A test of the release check itself removes this from the child it starts.
BLYTE_NO_UPDATE_CHECK = "1"
# Tests never write the developer's usage ledger. A test that needs a ledger points this at a
# temporary file.
BLYTE_USAGE_LOG = "off"
