# Releases (2026-09-30): every merge to main is released by .github/workflows/release-on-merge.yml.
# commitizen reads the Conventional Commits since the last tag: feat -> minor, fix/refactor/perf ->
# patch, a breaking change -> minor while the version is 0.x; docs/ci/chore/test/style -> no release.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = true
update_changelog_on_bump = true
changelog_incremental = true
changelog_file = "CHANGELOG.md"
version_files = [
    "Cargo.toml:^version = ",
    # blyte-cli and blyte-agent pin their sibling crates; a 0.x caret requirement only matches the same minor.
    "crates/blyte-cli/Cargo.toml:^blyte-(agent|provider) = ",
    "crates/blyte-agent/Cargo.toml:^blyte-provider = ",
]
