site_name: Superstate
site_description: Deterministic state engine, tree-sitter AST intelligence, zero-noise code review, and MCP server for autonomous agents.
site_author: Climate X Engineering
repo_url: https://github.com/climate-x-org/superstate
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: teal
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - State Machine & DFA: state.md
  - Code Intelligence (AST): syntax.md
  - Adversarial Review: review.md
  - MCP Server & Integrations: mcp.md
  - Contributing: contributing.md

plugins:
  - search
