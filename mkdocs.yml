site_name: blyte
site_description: A lean coding-agent harness in Rust. One loop, a sealed verification gate, sandboxed tools.
site_author: Climate X Engineering
repo_url: https://github.com/dnf0/blyte
repo_name: blyte
edit_uri: edit/main/docs/
copyright: Apache-2.0

# Historical plans and specs stay in the repository, not on the site.
exclude_docs: |
  superpowers/
  adr/0001-*
  adr/0002-*

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  logo: assets/blyte-mark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/blyte.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - "The workflow: plan, delegate, review": orchestration.md
      - How tasks are written: writing-tasks.md
      - Running tasks: usage.md
      - Providers: providers.md
      - Security and the sandbox: security.md
      - Run reports: reports.md
  - How it works:
      - Architecture: how-it-works.md
      - Architecture deep dive: architecture.md
      - Manifesto: manifesto.md
      - Roadmap: roadmap.md
  - Evidence:
      - Overview: evidence.md
      - FrontierHarness run: research/2026-09-27-frontierharness-gemini.md
      - Harness research: research/2026-09-24-harness-research.md
  - Reference:
      - CLI flags: reference/cli.md
      - "Architecture decision: one loop, a sealed gate, an implementer": adr/0003-one-loop-implementer.md
  - Contributing: contributing.md
